<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  «Налей до черты» — мини-игра WeDrink (Новосибирск), прототип по общему стандарту (SPEC.md: v2 + дополнения v3 и v4, 2026-11-16).
  Один файл: HTML + CSS + JS, без внешних библиотек, шрифтов, картинок и запросов в сеть.

  ПАЛИТРА. Фирменные цвета — из SPEC.md (аудит бренда и исходники постеров; брендбука нет):
    brand #1B8F8E, brand-dark #156F6E, accent #DC223C, bg #FBF7EC, ink #1F2A2A.
  Цвета напитков подобраны правдоподобно под игру, по техкартам не сверялись.
  Составы слоёв — по описаниям позиций в меню (wedrink-tools/cards/menu_data.py).
  Все цвета меняются в одном месте — в :root ниже; canvas читает их оттуда же.

  СЕЗОН. Зимний вид включается сам с 15 ноября по 28 февраля; для проверки: ?season=winter или ?season=default.
  Проверка попыток: ?reset=1 в адресе обнуляет счётчик попыток за сегодня.
-->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#156F6E">
<meta name="description" content="Налей чай до красной черты: три слоя, три черты, 30 секунд. Мини-игра WeDrink, Новосибирск.">
<link rel="icon" type="image/webp" href="../assets/icon-96.webp">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WeDrink">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="WeDrink — Налей до черты">
<meta property="og:description" content="Налей чай до красной черты: три слоя, три черты, 30 секунд. Мини-игра WeDrink, Новосибирск.">
<meta property="og:url" content="https://holopi1.github.io/wedrink-games/naley-do-cherty/">
<meta property="og:image" content="https://holopi1.github.io/wedrink-games/assets/mascot-512.webp">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<title>WeDrink — Налей до черты</title>
<style>
:root{
  /* --- фирменные цвета WeDrink (SPEC) --- */
  --brand:#1B8F8E;
  --brand-dark:#156F6E;
  --accent:#DC223C;
  --bg:#FBF7EC;
  --ink:#1F2A2A;
  /* --- вспомогательные (исходники постеров) --- */
  --card:#FFFDF6;
  --muted:#3E4E50;
  --soft:#DDEDEA;
  --soft-2:#CFE9E6;
  --line:#E8DFC4;
  --sun:#FFD45C;
  --mint:#8FE3DC;       /* светлая бирюза: огни и текст на тёмном */
  /* --- цвета напитков: у каждой жидкости верх и низ градиента --- */
  --tea-top:#E09A45;    --tea-bot:#B8621F;     /* чёрный чай */
  --light-top:#F5D67E;  --light-bot:#DDAA3E;   /* жасминовый чай */
  --rose-top:#F59C90;   --rose-bot:#DB5F66;    /* жасминовый чай, клубничный вкус */
  --choco-top:#9A6642;  --choco-bot:#5F3A22;   /* шоколадный чай */
  --milk-top:#FFFAF0;   --milk-bot:#F1E2C8;    /* молочная основа */
  --coco-top:#FFFFFF;   --coco-bot:#EFEADF;    /* кокосовое молоко */
  --grape-top:#A77BCB;  --grape-bot:#6A3B97;   /* виноградный джем */
  --foam-top:#FFF4C4;   --foam-bot:#FFE08C;    /* сырная пенка */
  /* --- топпинги и добавки --- */
  --pearl:#3B2519;      --pearl-hi:#7A5136;    /* жемчужная тапиока */
  --bean:#8E2F2A;       --bean-hi:#C2584C;     /* красная фасоль */
  --jelly:#FFBE85;      --jelly-edge:#F0955A;  /* персиковое желе */
  --ice:#F4FBFF;        --ice-edge:#A6D0DC;    /* лёд */
  --lemon:#FFE873;      --lemon-edge:#E9B81F;  /* лимон */
  --oreo:#2B201C;       --oreo-cream:#F4EDE0;  /* Oreo */
  --glass:#FFFFFF;      /* стекло и блики */
  /* --- зима (SEASON = 'winter') --- */
  --night-1:#0F5059;    --night-2:#10405E;    --night-3:#142C52;   /* вечернее небо: тёмная бирюза — синий */
  --warm-1:#FFE9A8;     --warm-2:#FFBE63;     --warm-3:#F0934A;    /* тёплый свет окна */
  --snow:#FFFFFF;       --snow-shade:#C9E2EE;
  /* --- текст поверх фона приложения (зимой фон тёмный) --- */
  --on-bg:var(--ink);
  --on-bg-muted:var(--muted);
  --on-bg-brand:var(--brand-dark);
  --mark:var(--brand);
  --star:var(--accent);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--brand-dark);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
#app{
  position:fixed;top:0;right:0;bottom:0;left:0;margin:auto;
  width:100%;max-width:460px;height:100%;max-height:920px;
  background:
    radial-gradient(120% 55% at 50% 0%,rgba(255,255,255,.9) 0%,rgba(255,255,255,0) 62%),
    linear-gradient(180deg,var(--bg) 0%,#EFF6EE 58%,var(--soft) 100%);
  display:flex;flex-direction:column;overflow:hidden;color:var(--on-bg);
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app.winter{
  --on-bg:#F4FBFA;--on-bg-muted:#C9E0E3;--on-bg-brand:var(--sun);--mark:#FFFFFF;--star:var(--sun);
  background:linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 55%,var(--night-3) 100%);
}
@media (min-width:520px) and (min-height:640px){
  #app{height:calc(100% - 40px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
}

/* фон: едва заметный узор из шариков тапиоки, чуть сдвигается за пальцем (--px, --py ставит скрипт) */
#app::before{
  content:"";position:absolute;top:-20px;right:-20px;bottom:-20px;left:-20px;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle,rgba(31,42,42,.05) 0,rgba(31,42,42,.05) 5px,transparent 6px),
    radial-gradient(circle,rgba(27,143,142,.08) 0,rgba(27,143,142,.08) 3px,transparent 4px);
  background-size:84px 96px,84px 96px;background-position:0 0,42px 48px;
  transform:translate3d(var(--px,0px),var(--py,0px),0);
}
/* зима: вместо узора — огни гирлянды под верхним краем */
#app.winter::before{
  top:0;right:0;bottom:0;left:0;transform:none;background-size:auto;background-position:0 0;
  background-image:
    radial-gradient(circle at 7% 22px,rgba(255,212,92,.95) 0,rgba(255,212,92,.42) 7px,rgba(255,212,92,0) 30px),
    radial-gradient(circle at 23% 37px,rgba(240,70,95,.95) 0,rgba(240,70,95,.42) 7px,rgba(240,70,95,0) 30px),
    radial-gradient(circle at 40% 46px,rgba(143,227,220,.95) 0,rgba(143,227,220,.42) 7px,rgba(143,227,220,0) 30px),
    radial-gradient(circle at 60% 46px,rgba(255,255,255,.95) 0,rgba(255,255,255,.42) 7px,rgba(255,255,255,0) 30px),
    radial-gradient(circle at 77% 37px,rgba(255,212,92,.95) 0,rgba(255,212,92,.42) 7px,rgba(255,212,92,0) 30px),
    radial-gradient(circle at 93% 22px,rgba(240,70,95,.95) 0,rgba(240,70,95,.42) 7px,rgba(240,70,95,0) 30px);
  background-repeat:no-repeat;opacity:.75;animation:twinkle 3.4s ease-in-out infinite;
}
#app.winter.party::before{opacity:1;animation-duration:1.1s}
@keyframes twinkle{0%,100%{opacity:.6}50%{opacity:.95}}

/* шапка бренда — одна на все экраны */
.wd{position:relative;z-index:1;flex:0 0 auto;text-align:center;padding:12px 16px 4px;line-height:1}
.wd-mark{display:inline-flex;align-items:flex-start;gap:3px;font:900 34px/1 var(--font);letter-spacing:-.03em;color:var(--mark)}
#app.winter .wd-mark{text-shadow:0 2px 14px rgba(143,227,220,.4)}
.wd-flake{display:none;width:14px;height:14px;margin-top:1px;fill:none;stroke:var(--mint);stroke-width:1.6;stroke-linecap:round}
#app.winter .wd-flake{display:block;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.wd-city{margin-top:4px;font:700 11px/1 var(--font);letter-spacing:.2em;text-transform:uppercase;color:var(--on-bg-muted)}
.wd-tag{display:none;margin-top:8px;font:800 12px/1 var(--font);letter-spacing:.05em;color:var(--on-bg-brand)}
#app.is-start .wd-tag{display:block}
#app.is-game .wd{padding:8px 16px 0}
#app.is-game .wd-mark{font-size:23px}
#app.is-game .wd-flake{width:10px;height:10px}
#app.is-game .wd-city{font-size:9px;margin-top:2px}
@media (max-height:600px){.wd{padding-top:8px}.wd-mark{font-size:27px}.wd-tag{margin-top:6px}}

/* экраны: плавное появление и уход */
.screens{position:relative;z-index:1;flex:1;min-height:0;display:flex}
.screen{display:none;flex:1;min-width:0;min-height:0;flex-direction:column}
.screen.is-on{display:flex;animation:scr-in .36s cubic-bezier(.2,.9,.3,1) both}
.screen.is-leaving{display:flex;position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;animation:scr-out .22s ease both}
@keyframes scr-in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes scr-out{from{opacity:1}to{opacity:0;transform:translateY(-10px) scale(.985)}}
.screen.scroll{overflow-y:auto;touch-action:pan-y}

/* кнопки */
.btn{
  -webkit-appearance:none;appearance:none;border:0;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#F0445C 0%,var(--accent) 60%,#C41A33 100%);color:#fff;
  font:900 20px/1 var(--font);letter-spacing:.01em;padding:17px 30px;min-width:220px;
  box-shadow:0 6px 0 rgba(31,42,42,.22),0 12px 22px rgba(220,34,60,.3),inset 0 2px 0 rgba(255,255,255,.3);
  touch-action:manipulation;transition:transform .12s cubic-bezier(.3,1.6,.5,1),box-shadow .12s;
}
.btn::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));
  animation:shine 3.6s ease-in-out infinite;
}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(31,42,42,.22),0 4px 10px rgba(220,34,60,.25),inset 0 2px 0 rgba(255,255,255,.3)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.btn.ghost{
  background:rgba(255,255,255,.14);color:var(--on-bg-brand);padding:13px 22px;font-size:16px;font-weight:800;
  box-shadow:inset 0 0 0 2px var(--brand);
}
#app.winter .btn.ghost{color:#fff;box-shadow:inset 0 0 0 2px var(--mint)}
.btn.ghost::after{display:none}
.btn-row{display:flex;gap:8px;width:100%;max-width:340px;justify-content:center}
.btn-row .btn{flex:1;min-width:0;padding-left:8px;padding-right:8px}
.btn-row .btn[hidden] + .btn{flex:0 1 220px}

/* старт */
#s-start{align-items:center;text-align:center;padding:4px 20px 12px;gap:9px}
#s-start > :first-child{margin-top:auto}
#s-start > :last-child{margin-bottom:auto}
.hero-row{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.hero{height:22vh;max-height:190px;min-height:100px;width:auto;display:block;overflow:visible;animation:bob 4.2s ease-in-out infinite;filter:drop-shadow(0 10px 12px rgba(31,42,42,.2))}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(-6px) rotate(1.2deg)}}
.h-pearl{fill:var(--pearl)}
.h-outline{fill:none;stroke:#fff;stroke-width:2.4;stroke-linejoin:round;opacity:.95}
.h-edge{fill:none;stroke:var(--ink);stroke-width:5;stroke-linejoin:round;opacity:.14}
.h-film{fill:var(--brand)}
.h-film-shine{fill:var(--glass);opacity:.4}
.h-logo{font:900 11px var(--font);fill:var(--brand-dark);stroke:var(--glass);stroke-width:2.6px;paint-order:stroke;stroke-linejoin:round}
.h-mark{stroke:var(--accent);stroke-width:3;stroke-dasharray:7 5;stroke-linecap:round}
.h-winter{display:none}
#app.winter .h-winter{display:block}
.h-steam{display:none;fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:0}
#app.winter.is-hot .h-steam{display:block;animation:steam 3s ease-in-out infinite}
#app.winter.is-hot .h-steam.s2{animation-delay:1.1s}
#app.winter.is-hot .h-steam.s3{animation-delay:2s}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}35%{opacity:.5}100%{opacity:0;transform:translateY(-16px)}}
.title{font-size:32px;line-height:1.05;font-weight:900;letter-spacing:-.02em}
.title span{border-bottom:4px dashed var(--accent);padding-bottom:1px}
.daily{font-size:15px;line-height:1.3;color:var(--on-bg-muted);max-width:330px}
.daily b{color:var(--on-bg-brand);font-weight:900}
.stars{color:var(--star);letter-spacing:.06em;white-space:nowrap}
.rule{font-size:14px;line-height:1.35;color:var(--on-bg-muted);max-width:330px}
.meta{font-size:13px;line-height:1.45;color:var(--on-bg-muted)}
.proto{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--on-bg-brand);opacity:.8}
@media (max-width:340px){.title{font-size:27px}}
@media (max-height:600px){
  #s-start{gap:7px}
  .hero{height:17vh;min-height:88px}
  .btn{padding:14px 26px}
  .rule{font-size:13px}
}

/* профиль: серия и коллекция */
.profile{width:100%;max-width:340px;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:16px;padding:8px 10px;box-shadow:0 6px 16px rgba(31,42,42,.08)}
.p-line{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-weight:800;white-space:nowrap}
.cups{display:flex;justify-content:space-between;margin-top:6px}
.cup{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.cup svg{width:26px;height:26px;display:block}
.cup circle{fill:var(--card);stroke:var(--line);stroke-width:1.5}
.cup path{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linejoin:round;opacity:.5}
.cup rect{fill:var(--muted);opacity:.35}
.cup.is-got circle{fill:var(--brand);stroke:var(--brand-dark)}
.cup.is-got path{fill:#fff;stroke:#fff;opacity:1}
.cup.is-got rect{fill:#fff;opacity:1}
.cup.is-today circle{stroke:var(--accent);stroke-width:2}
.cup i{font-style:normal;font-size:10px;font-weight:700;color:var(--muted)}
.cup.is-today i{color:var(--accent);font-weight:900}

/* игра */
.hud{display:flex;gap:6px;padding:8px 12px 8px}
.chip{
  flex:1;min-width:0;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;
  padding:6px 2px 7px;text-align:center;transition:border-color .2s,background .2s,transform .25s cubic-bezier(.3,1.7,.5,1);
}
.chip i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip b{display:block;font-size:19px;font-weight:900;line-height:1.15;font-variant-numeric:tabular-nums}
.chip.is-now{border-color:var(--accent);transform:translateY(-2px)}
.chip.is-now i{color:var(--accent)}
.chip.is-done{background:var(--soft);border-color:var(--soft-2)}
.chip.bump{animation:bump .4s cubic-bezier(.3,1.7,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.14)}100%{transform:scale(1)}}
.chip.total{background:var(--brand-dark);border-color:var(--brand-dark)}
.chip.total i{color:rgba(255,255,255,.75)}
.chip.total b{color:#fff}
.stage{
  position:relative;flex:1;min-height:0;margin:0 12px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,var(--soft),var(--soft-2));
  box-shadow:inset 0 0 0 1px rgba(31,42,42,.06);
  touch-action:none;cursor:pointer;
}
#app.winter .stage{background:linear-gradient(180deg,var(--night-1),var(--night-3));box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.caption,.pop{
  position:absolute;left:50%;top:10px;z-index:2;pointer-events:none;text-align:center;
  width:max-content;max-width:calc(100% - 24px);color:var(--ink);
  background:var(--card);border-radius:18px;padding:9px 16px 10px;box-shadow:0 8px 22px rgba(31,42,42,.2);
  opacity:0;transform:translate(-50%,-8px) scale(.92);transition:opacity .18s,transform .18s;
}
.caption.on{opacity:1;transform:translate(-50%,0) scale(1);transition:opacity .2s,transform .34s cubic-bezier(.3,1.6,.5,1)}
.caption small{display:block;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--brand)}
.caption strong{display:block;font-size:19px;font-weight:900;line-height:1.15}
.pop b{display:block;font-size:34px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand-dark)}
.pop span{display:block;font-size:14px;font-weight:800;margin-top:3px}
.pop.on{opacity:1;animation:pop .42s cubic-bezier(.2,1.6,.4,1) both}
.pop.perfect{background:linear-gradient(180deg,#FFE58F,var(--sun));box-shadow:0 8px 26px rgba(255,212,92,.6)}
.pop.perfect b{color:var(--ink)}
.pop.bad b{color:var(--accent)}
@keyframes pop{from{transform:translate(-50%,-8px) scale(.5)}to{transform:translate(-50%,0) scale(1)}}
.hint{height:50px;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:900;color:var(--on-bg-brand)}
.hint.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (max-width:340px){.caption strong{font-size:17px}}

/* результат и лимит */
#s-result,#s-limit{align-items:center;text-align:center;padding:8px 18px 14px}
#s-result{justify-content:flex-start;gap:8px}
#s-limit{justify-content:flex-start;gap:12px}
#s-limit > :first-child{margin-top:auto}
#s-limit > :last-child{margin-bottom:auto}
.res-title{font-size:25px;line-height:1.12;font-weight:900;letter-spacing:-.01em;margin-top:auto;max-width:330px}
.win .res-title{font-size:30px;color:var(--on-bg-brand)}
.res-sub{font-size:16px;line-height:1.2;font-weight:800}
.res-sub:empty{display:none}
.score{display:flex;align-items:baseline;justify-content:center;gap:8px}
.score b{font-size:68px;line-height:.95;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.win .score b{text-shadow:0 4px 24px rgba(255,212,92,.6)}
.score span{font-size:18px;font-weight:700;color:var(--on-bg-muted)}
.res-drink{font-size:13px;line-height:1.3;color:var(--on-bg-muted);max-width:330px}
.rows{display:flex;gap:6px;width:100%;max-width:340px}
.rows div{flex:1;min-width:0;background:var(--card);color:var(--ink);border:2px solid var(--line);border-radius:14px;padding:5px 2px}
.rows span{display:block;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rows b{display:block;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.rows .is-100{background:linear-gradient(180deg,#FFE58F,var(--sun));border-color:var(--sun)}
/* призовой билет */
.ticket{
  position:relative;width:100%;max-width:340px;background:var(--card);color:var(--ink);margin-top:8px;
  border:3px dashed var(--brand);border-radius:22px;padding:18px 14px 11px;box-shadow:0 10px 26px rgba(31,42,42,.12);
}
.ticket-tag{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;white-space:nowrap;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;z-index:1;
}
.ticket-main{font-size:15px;line-height:1.25;font-weight:800}
.ticket-word{
  display:inline-block;margin-top:8px;font-size:30px;line-height:1;font-weight:900;letter-spacing:.05em;color:var(--accent);
  background:#fff;border-radius:14px;padding:9px 16px;box-shadow:inset 0 0 0 2px var(--line);
}
.ticket-one{margin-top:8px;font-size:13px;font-weight:700;color:var(--muted)}
.ticket-stamp{
  margin-top:8px;padding-top:8px;border-top:2px dashed var(--line);
  font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand-dark);
}
.ticket-deco{display:none;position:absolute;pointer-events:none}
/* зима: билет как новогодняя открытка — тёплый свет, ленточка с бантом, ёлочный шар */
#app.winter .ticket{
  border:0;background:radial-gradient(130% 90% at 50% 0%,#FFF1CC 0%,#FFFDF6 55%,#FFEEDA 100%);
  box-shadow:0 0 0 2px #F3D59A,0 0 0 6px rgba(255,255,255,.92),0 14px 44px rgba(255,190,99,.5);
}
#app.winter .ticket::before{
  content:"";position:absolute;left:0;top:0;width:60px;height:60px;border-top-left-radius:22px;pointer-events:none;
  background:linear-gradient(135deg,rgba(220,34,60,0) 30%,#C41A33 30%,#F0445C 41%,#C41A33 52%,rgba(220,34,60,0) 52%);
}
#app.winter .ticket-deco{display:block}
.ticket-bow{left:4px;top:5px;width:30px;height:25px}
.ticket-ball{right:16px;top:-3px;width:22px;height:44px}
#app.winter .ticket-main{padding:0 36px}
#app.winter .ticket-stamp{border-top-color:#F3D59A}
.note{font-size:15px;line-height:1.35;color:var(--on-bg-muted);max-width:330px}
.note:empty{display:none}
.note.strong{color:var(--on-bg);font-weight:800}
#res-left{margin-bottom:auto}
.limit-title{font-size:27px;line-height:1.15;font-weight:900;max-width:320px}
.limit-record{font-size:18px;line-height:1.3;font-weight:800;color:var(--on-bg-brand)}
.limit-prize{font-size:20px;line-height:1.2;font-weight:900}
.limit-prize small{display:block;font-size:15px;font-weight:800;color:var(--on-bg-muted)}
@media (max-height:600px){
  #s-result{gap:6px;padding-top:2px}
  .res-title{font-size:22px}
  .win .res-title{font-size:25px}
  .res-sub{font-size:15px}
  .score b{font-size:50px}
  .win .res-drink{display:none}
  .ticket{padding:16px 12px 9px;margin-top:6px}
  .ticket-main{font-size:14px}
  .ticket-word{font-size:26px;padding:7px 14px;margin-top:6px}
  .ticket-one{margin-top:6px;font-size:12px}
  .ticket-stamp{margin-top:6px;padding-top:6px;font-size:16px}
  .btn-row .btn{padding-top:11px;padding-bottom:11px}
  .note{font-size:13px}
  .limit-title{font-size:24px}
}

#fx{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:3}
.toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.on{opacity:.92}
@media (prefers-reduced-motion:reduce){
  .hero,.btn::after,.wd-flake,#app.winter::before,.hint.pulse,.h-steam,.chip.bump{animation:none !important}
  .screen.is-on{animation-duration:.01s}
  .screen.is-leaving{display:none}
}

.wd-mascot{display:block;flex:none;width:clamp(72px,18vh,136px);height:clamp(72px,18vh,136px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;
  animation:wd-sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(31,42,42,.18));
  pointer-events:none;-webkit-user-select:none;user-select:none}
/* у билета маскот выглядывает над его правым верхним краем и не занимает места в потоке (кнопки не уезжают) */
.wd-prize-m{display:none;position:relative;height:0;width:100%;flex:none;pointer-events:none;z-index:2}
.wd-prize-m::before{content:"";position:absolute;right:0;bottom:-12px;width:clamp(68px,10vh,88px);height:clamp(68px,10vh,88px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;animation:wd-sway 3.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 6px rgba(31,42,42,.22))}
.screen:has(.ticket:not([hidden])) .wd-prize-m{display:block}
@keyframes wd-sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
#app.winter .wd-mascot,#app[data-season="winter"] .wd-mascot{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#app.winter .wd-prize-m::before,#app[data-season="winter"] .wd-prize-m::before{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@media (max-height:640px){.wd-mascot{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.wd-mascot,.wd-prize-m::before{animation:none}}

/* ===== v6: общий слой — кнопка «Все игры», настройки, быстрая кнопка звука, касания, безопасные зоны ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}
a,button{-webkit-touch-callout:none}
.wdx-ibtn{
  position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);
  display:none;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:#156F6E;box-shadow:0 2px 10px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(27,143,142,.35);
  font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .1s;
}
.wdx-ibtn svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wdx-ibtn:active{transform:scale(.92)}
.wdx-ibtn:focus-visible,.wdx-row:focus-visible,.wdx-done:focus-visible,.wdx-next:focus-visible,.wdx-back:focus-visible{outline:3px solid #DC223C;outline-offset:2px}
.wdx-gear{display:flex}
.wdx-snd{top:calc(env(safe-area-inset-top,0px) + 4px);width:42px;height:42px}
.wdx-snd svg{width:22px;height:22px}
#app .wdx-gear{display:none}
#app:has(#s-start.is-on) .wdx-gear,#app:has(#s-result.is-on) .wdx-gear,#app:has(#s-limit.is-on) .wdx-gear{display:flex}
#app:has(#s-game.is-on) .wdx-snd{display:flex}
@supports not selector(:has(*)){#app .wdx-gear{display:flex}}
body > .wdx-ibtn{position:absolute}

.wdx-back{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;min-height:50px;margin:4px auto 0;padding:12px 18px;
  border-radius:16px;background:#fff;color:#156F6E;box-shadow:inset 0 0 0 2.5px #1B8F8E,0 3px 0 rgba(21,111,110,.35);
  font:800 17px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-decoration:none;text-align:center;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,box-shadow .08s;
}
.wdx-back:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px #1B8F8E,0 1px 0 rgba(21,111,110,.35)}
.wdx-back::before{content:"";width:9px;height:9px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);margin-right:2px;flex:none}

.wdx-set{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,32,36,.62);animation:wdx-in .18s ease both}
.wdx-set.wdx-fixed{position:fixed}
.wdx-set[hidden]{display:none !important}
.wdx-card{width:100%;max-width:340px;max-height:100%;overflow:auto;padding:20px 18px 18px;border-radius:24px;background:#FFFDF6;color:#1F2A2A;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:wdx-pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.wdx-card h2{margin:0 0 6px;font:900 24px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;color:#156F6E}
.wdx-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;margin:0;padding:8px 2px;border:0;border-bottom:1px solid #E8DFC4;border-radius:0;background:none;
  color:#1F2A2A;font:800 18px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;
}
.wdx-sw{position:relative;flex:none;width:54px;height:32px;border-radius:16px;background:#B9C6C5;transition:background .15s}
.wdx-sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.wdx-row[aria-checked="true"] .wdx-sw{background:#1B8F8E}
.wdx-row[aria-checked="true"] .wdx-sw::after{transform:translateX(22px)}
.wdx-done{display:block;width:100%;min-height:52px;margin:16px 0 0;padding:12px;border:0;border-radius:16px;background:#DC223C;color:#fff;box-shadow:0 4px 0 #A5192C;
  font:900 18px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-done:active{transform:translateY(2px);box-shadow:0 2px 0 #A5192C}
.wdx-now{margin:12px 2px 0;font:700 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#4E5F5E;overflow-wrap:anywhere}
.wdx-next{display:block;width:100%;min-height:48px;margin:10px 0 0;padding:10px;border:2px solid #1B8F8E;border-radius:14px;background:none;color:#156F6E;font:800 16px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-next:active{transform:translateY(1px)}
.wdx-next:disabled{opacity:.4;cursor:default}
.wdx-now[hidden],.wdx-next[hidden]{display:none}
@keyframes wdx-in{from{opacity:0}to{opacity:1}}
@keyframes wdx-pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wdx-set,.wdx-card{animation:none}.wdx-ibtn,.wdx-back,.wdx-sw,.wdx-sw::after{transition:none}}

<script>
/* ============================================================================
   WDX (v8) — общий слой всех игр и зала WeDrink: настройки, музыка, Telegram Mini App, MAX, VK Mini Apps, слова дня.
   Один и тот же код лежит в зале и в каждой игре (файлы самодостаточны).
   Профиль wedrink.profile.v1: пишем только поля music и sfx (по умолчанию включено), остальное не трогаем.
   Музыка: плейлист assets/music/playlist.json, треки идут по кругу; текущий тянется лениво, только после первого касания. Внешних запросов нет,
   кроме скриптов клиентов (Telegram, MAX, VK Bridge) и только внутри своего клиента.
   ============================================================================ */
(function () {
  'use strict';
  var PROFILE_KEY = 'wedrink.profile.v1';
  var MUSIC_DIR = 'assets/music/';           // playlist.json и треки
  var MUSIC_GAP = 400;                       // пауза, если перехода нет, мс
  var MUSIC_XF = 1.5;                        // плавный переход между треками, с
  var MUSIC_XF_SKIP = 0.6;                   // то же по кнопке «Следующий трек»
  var MUSIC_VOL = 0.35;                      // громкость фоновой музыки
  var TG_SRC = 'https://telegram.org/js/telegram-web-app.js';
  var TG_FLAG = 'wedrink.tg';
  var MAX_SRC = 'https://st.max.ru/js/max-web-app.js';                  // dev.max.ru/docs/webapps/bridge, «Подключение библиотеки»
  var MAX_FLAG = 'wedrink.max';
  var VK_SRC = 'https://unpkg.com/@vkontakte/vk-bridge@2.15.12/dist/browser.min.js';   // адрес из dev.vk.ru/en/bridge/getting-started, версия закреплена
  var VK_SRI = 'sha384-zMslrVQ3fVDIQqW7ztZS5ewZJsN29NP1vJFbKATVzqIeeinYRVG8gCR2p7X/SuwC';
  var LP_KEY = 'wedrink.lp';                  // параметры запуска (VK / MAX / Telegram), чтобы не терять при переходах зал <-> игра
  /* Строки условий приза: одна и та же на экране приза во всех играх */
  var COND = '290 очков — −40 ₽ на напиток, все 300 — напиток до 250 ₽ за наш счёт. Назови на кассе слово дня и номер телефона: каждый приз — раз в день, в одном заказе — один приз, кофе не участвует.';
  var VALID = 'Слово действует сегодня до закрытия точки (22:00 по Новосибирску).';
  var HEAD = { topping: '−40\u00a0₽ на\u00a0напиток', drink: 'Напиток до\u00a0250\u00a0₽ за\u00a0наш\u00a0счёт' };
  var HALL_COLOR = { light: '#FBF7EC', winter: '#0F5059' };
  var GAME_COLOR = { light: '#FBF7EC', winter: '#0F5059' };

  var cfg = { base: '', hall: false, sfx: false };
  var cache = {}, ui = {}, audio = null, ctx = null, gain = null;
  var list = null, idx = 0, loaded = -1, seekTo = 0, wantPlay = false, listLoading = false, listTries = 0, gapT = 0, errs = 0, slots = [], cur = null, primed = false;
  var started = false, suspended = false, lastFocus = null, touched = false;
  var theme = { winter: false }, tgW = null, tgPending = false, tgLoading = false;
  var mxW = null, mxLoading = false, vkB = null, vkLoading = false, coded = null;

  /* ---------- профиль: читаем целиком, меняем одно поле ---------- */
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function readProfile() {
    try { var o = JSON.parse(window.localStorage.getItem(PROFILE_KEY)); return isObj(o) ? o : {}; } catch (e) { return {}; }
  }
  function pref(name) {
    if (Object.prototype.hasOwnProperty.call(cache, name)) return cache[name];
    return readProfile()[name] !== false;     // по умолчанию включено
  }
  function setPref(name, on) {
    var p;
    cache[name] = !!on;
    try { p = readProfile(); p[name] = !!on; window.localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* без хранилища — до конца сессии */ }
  }

  /* ---------- параметры запуска клиентов: VK (vk_*, sign), Telegram (tgWebApp*), MAX (WebApp*) ---------- */
  var LP_NAME = /^(vk_[a-z_]+|sign|tgWebApp[A-Za-z]*|WebApp[A-Za-z]*)$/;
  function launchQuery() {                    // только служебные параметры клиентов, без ?preview= и ?season=
    var q = '', parts, i, out = [], k, saved = '';
    try { q = String(window.location.search || '').replace(/^\?/, ''); } catch (e) { q = ''; }
    parts = q ? q.split('&') : [];
    for (i = 0; i < parts.length; i++) { k = parts[i].split('=')[0]; if (LP_NAME.test(k)) out.push(parts[i]); }
    if (out.length) {
      q = out.join('&');
      try { window.sessionStorage.setItem(LP_KEY, q); } catch (e) { /* нет sessionStorage */ }
      return q;
    }
    try { saved = window.sessionStorage.getItem(LP_KEY) || ''; } catch (e) { saved = ''; }
    return /^[A-Za-z0-9_=&%.~+\-]*$/.test(saved) ? saved : '';
  }
  function maxHash() {                        // MAX кладёт WebAppData, WebAppPlatform, WebAppVersion в часть после # (dev.max.ru/docs/webapps/validation)
    var h = '';
    try { h = String(window.location.hash || ''); } catch (e) { h = ''; }
    return /[#&](WebAppData|WebAppPlatform|WebAppVersion)=/.test(h) ? h : '';
  }
  function withParams(url) {                  // дописать к ссылке параметры запуска, если они есть
    var h = '', i = url.indexOf('#'), lp = launchQuery();
    if (i >= 0) { h = url.slice(i); url = url.slice(0, i); }
    if (lp) url += (url.indexOf('?') < 0 ? '?' : '&') + lp;
    if (!h) h = maxHash();
    return url + h;
  }
  function hallUrl() {
    var m = null, q = '';
    try { m = /[?&]season=(winter|default)(?:&|$)/.exec(String(window.location.search || '')); } catch (e) { m = null; }
    if (m && !cfg.hall) q = '?season=' + m[1];
    return withParams(cfg.base + 'index.html' + q);
  }
  function goHall() { try { window.location.href = hallUrl(); } catch (e) { /* адрес недоступен */ } }

  /* ---------- музыка: плейлист assets/music/playlist.json, плавные переходы между треками ---------- */
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';   // для «разблокировки» запасных плееров первым касанием
  function trackUrl(i) { return cfg.base + MUSIC_DIR + list[i].file; }
  function nextIdx(i) { return (i + 1) % list.length; }
  function curTitle() { return (list && list[idx]) ? list[idx].title : ''; }
  function savePos() {                        // файл и позиция текущего трека — для перехода зал <-> игра
    var t = 0;
    if (!list || !list[idx]) return;
    if (loaded === idx && audio && audio.currentTime > 0) t = audio.currentTime;
    try { window.sessionStorage.setItem('wedrink.mt', JSON.stringify({ f: list[idx].file, t: t, ts: Date.now() })); } catch (e) { /* нет sessionStorage */ }
  }
  function restoreIdx() {                     // первый запуск — случайный трек, дальше по порядку
    var s = null, i, k = -1;
    try { s = JSON.parse(window.sessionStorage.getItem('wedrink.mt')); } catch (e) { s = null; }
    if (s && typeof s.f === 'string') for (i = 0; i < list.length; i++) if (list[i].file === s.f) k = i;
    if (k < 0) { idx = Math.floor(Math.random() * list.length); return; }
    if (isFinite(s.t) && Date.now() - s.ts < 20000) { idx = k; seekTo = s.t > 0 ? s.t : 0; }   // продолжаем с того же места
    else idx = nextIdx(k);
  }
  function loadList() {
    var done;
    if (list || listLoading || listTries >= 2) return;
    listLoading = true; listTries++;
    done = function (arr) {
      var out = [], i, o;
      listLoading = false;
      if (!Array.isArray(arr)) return;
      for (i = 0; i < arr.length; i++) {
        o = arr[i];
        if (isObj(o) && typeof o.file === 'string' && /^[A-Za-z0-9_\-]+\.mp3$/.test(o.file)) out.push({ file: o.file, title: typeof o.title === 'string' ? o.title : '', sec: +o.sec || 0 });
      }
      if (!out.length) return;
      list = out;
      restoreIdx();
      syncUi();
      if (wantPlay) { wantPlay = false; play(); }
    };
    try {
      fetch(cfg.base + MUSIC_DIR + 'playlist.json').then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(done, function () { listLoading = false; });
    } catch (e) { listLoading = false; }
  }

  /* уровень слота 0..1 (итоговая громкость = уровень * MUSIC_VOL): через усилитель Web Audio или audio.volume */
  function setLv(s, v) {
    var t;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    s.lv = v;
    if (s.g) { try { t = ctx.currentTime; s.g.gain.cancelScheduledValues(t); s.g.gain.setValueAtTime(v * MUSIC_VOL, t); } catch (e) { /* не страшно */ } }
    else { try { s.a.volume = v * MUSIC_VOL; } catch (e) { /* не страшно */ } }
  }
  function rampLv(s, to, secs) {
    var from = s.lv, t, t0;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    if (s.g) {
      try {
        t = ctx.currentTime;
        s.g.gain.cancelScheduledValues(t);
        s.g.gain.setValueAtTime(s.g.gain.value, t);
        s.g.gain.linearRampToValueAtTime(to * MUSIC_VOL, t + secs);
      } catch (e) { /* не страшно */ }
      s.lv = to;
      return;
    }
    t0 = Date.now();
    s.ivl = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / (secs * 1000));
      s.lv = from + (to - from) * k;
      try { s.a.volume = s.lv * MUSIC_VOL; } catch (e) { /* не страшно */ }
      if (k >= 1) { clearInterval(s.ivl); s.ivl = 0; }
    }, 40);
  }
  function quiet(s) {                         // слот освобождается: пауза, таймеры сброшены
    if (s.tm) { clearTimeout(s.tm); s.tm = 0; }
    if (s.pend) { clearTimeout(s.pend); s.pend = 0; }
    s.wantIn = false;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    try { s.a.pause(); } catch (e) { /* не страшно */ }
    if (s.st === 'fade') s.st = 'idle';
    if (s.st === 'idle') s.f = -1;
    s.lv = 0;
  }
  function loadInto(s, i) { if (s.f !== i) { s.f = i; try { s.a.src = trackUrl(i); } catch (e) { /* не страшно */ } } }
  function slotWith(i) { var k; for (k = 0; k < slots.length; k++) if (slots[k].st === 'idle' && slots[k].f === i) return slots[k]; return null; }
  function idleSlot() { var k; for (k = 0; k < slots.length; k++) if (slots[k].st === 'idle') return slots[k]; return null; }
  function makeCur(s) { cur = s; s.st = 'cur'; audio = s.a; loaded = s.f; }

  function preloadNext() {                    // следующий трек подгружаем во второй плеер, когда текущий дошёл до середины
    var n, s;
    if (!list || list.length < 2 || loaded < 0) return;
    n = nextIdx(loaded);
    if (slotWith(n)) return;
    s = idleSlot();
    if (!s) return;
    setLv(s, 0); loadInto(s, n);
  }
  function startQuick(s) {                    // следующий не успел догрузиться: старт после затухания, короткое нарастание
    var p;
    s.pend = 0; s.wantIn = true; setLv(s, 0);
    try { p = s.a.play(); if (p && p.catch) p.catch(function () { /* ждём следующего касания */ }); } catch (e) { /* не страшно */ }
  }
  function fadeTo(n, secs) {                  // плавный переход к треку n: текущий затухает, следующий нарастает
    var out = cur, inc, ready, k, p;
    if (!out || !list || list.length < 2) return false;
    inc = slotWith(n) || idleSlot();
    if (!inc) return false;                   // все плееры заняты — вызывающий сделает обычный старт
    for (k = 0; k < slots.length; k++) if (slots[k].st === 'fade' && slots[k] !== out) {   // прежний переход добиваем быстро
      rampLv(slots[k], 0, 0.08);
      (function (s) { if (s.tm) clearTimeout(s.tm); s.tm = setTimeout(function () { s.tm = 0; quiet(s); }, 120); })(slots[k]);

    var err = Math.abs(level - target), s;
    var mid = (diff && diff.mid) || DIFFICULTY[2].mid, near = (diff && diff.near) || DIFFICULTY[2].near;

  /* =====================================================================

  var fx = { x: el.fx.getContext('2d'), w: 0, h: 0, d: 1, run: false, last: 0, snow: [], conf: [], t: 0 };

      c.fillStyle = '#FFFFFF';

        p = fx.snow[i];
        p.y += p.vy * dt;

  function celebrate(prize) {
    var cols = [css.brand, css.accent, css.sun, css.mint, '#FFFFFF'];
    var pts = [[0.5, 0.3, 0], [0.2, 0.38, 0.35], [0.8, 0.38, 0.7]];

  var game = null;

  var SP_N = 25, spH = [], spV = [];    // поверхность жидкости: столбики на пружинах
  var bodies = [];                      // твёрдые тела: тапиока, фасоль, желе, лёд, лимон, Oreo
  var parts = [];                       // брызги, искры, снежная пыль

  }

  function newGame(dateInt, attemptNo, dow) {
    var g = planRound(dateInt, attemptNo, dow), i;
    g.scores = [];
    for (i = 0; i < SLOTS.length; i++) g.scores.push(null);
    g.idx = 0;             // номер текущего слоя

  /* =====================================================================
     ЦИКЛ: requestAnimationFrame с дельтой времени

  var running = false, rafId = 0, lastFrame = 0;

    else if (g.state === 'settle') { if (since >= (g.idx === SLOTS.length - 1 ? FINAL_MS : SETTLE_MS)) nextLayer(); }
    else if (g.state === 'spill') { if (since >= SPILL_MS) finishRound(); }

  /* =====================================================================

    el.stage.addEventListener('touchend', function () { stopPour(); });
    el.stage.addEventListener('touchcancel', function () { stopPour(); });
    el.stage.addEventListener('mousedown', function (e) { if (e.button === 0) startPour(); });
    window.addEventListener('mouseup', function () { stopPour(); });
  }
  el.stage.addEventListener('touchmove', function (e) { if (e.cancelable) e.preventDefault(); }, { passive: false });

  function isSpace(e) { return e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.keyCode === 32; }
  window.addEventListener('keydown', function (e) {
    if (!isSpace(e) || screen !== 'game') return;   // на остальных экранах пробел жмёт кнопку, как обычно
    e.preventDefault();
    if (!e.repeat) startPour();
  });
  window.addEventListener('keyup', function (e) {
    if (!isSpace(e) || screen !== 'game') return;
    e.preventDefault();
    stopPour();
  });
  // свернули вкладку или ушёл фокус — это отпускание
  window.addEventListener('blur', function () { activePointer = null; stopPour(); });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { activePointer = null; stopPour(); return; }
    if (running) { lastFrame = nowMs(); if (!rafId) rafId = window.requestAnimationFrame(frame); }
    fxKick();
    if (screen === 'start' || screen === 'limit') showStart();   // вернулись на другой день — новый напиток и попытки
  });

  // без контекстного меню, выделения и масштабирования жестом
  el.app.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  el.app.addEventListener('selectstart', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });

  el.play.addEventListener('click', startRound);
  el.again.addEventListener('click', startRound);
  el.home.addEventListener('click', showStart);    // попытки кончились — showStart сам покажет экран «На сегодня всё»

  // ресайз и поворот экрана
  function onResize() { layout(); if (fxSize()) fxKick(); }
  window.addEventListener('resize', onResize);
  window.addEventListener('orientationchange', function () { setTimeout(onResize, 120); });
  if (window.ResizeObserver) {
    try { new ResizeObserver(layout).observe(el.stage); } catch (e) { /* хватит события resize */ }
  }

  /* =====================================================================
     СТАРТ
     ===================================================================== */
  // Telegram Mini App: только безопасный вызов, если объект уже есть (скрипт Telegram здесь не подключается)
  try { WDX.init({ base: '../' }); WDX.theme(WINTER); } catch (e) { /* общий слой не критичен */ }

  if (WINTER) el.app.classList.add('winter');     // зимний вид: тёмный фон, гирлянда, снег
  readPalette();

  // Скрытый сброс для проверки: ?reset=1 обнуляет счётчик попыток за сегодня (рекорды и профиль остаются)
  var wasReset = false;
  try {
    if (/[?&]reset=1(?:&|$)/.test(String(window.location.search || ''))) {
      var d0 = loadDay();
      d0.used = 0;
      saveDay(d0);
      wasReset = true;
    }
  } catch (e) { /* адрес недоступен */ }

  var pvScore = null;
  try { pvScore = WDX.previewScore(); } catch (e) { pvScore = null; }
  if (pvScore !== null) {
    // Просмотр экрана результата: ничего не сохраняет, попытку не тратит, слово дня — «ПРИМЕР»
    PREVIEW = true;
    var pvPlan = planRound(0, 1, new Date().getDay()), pvLeft = pvScore, pvScores = [], pvI;
    for (pvI = 0; pvI < SLOTS.length; pvI++) { pvScores.push(Math.min(LAYER_MAX, pvLeft)); pvLeft -= pvScores[pvI]; }
    showResult({ drink: pvPlan.drink, ings: pvPlan.ings, scores: pvScores, spilled: false, idx: SLOTS.length - 1 },
      pvScore, { used: 0, best: 0, top: 0 }, false);
    toast('Просмотр экрана: ничего не сохраняется');
  } else {
    showStart();
    if (wasReset) toast('Счётчик попыток сброшен');
  }
})();
</script>
</body>
</html>
