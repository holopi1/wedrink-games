<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Правила акции — Игры WeDrink</title>
<style>
body{margin:0;background:#FBF7EC;color:#123;font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 32px}
h2{font-size:22px;margin:0 0 12px;color:#0F5059}h3{font-size:17px;margin:16px 0 6px;color:#0F5059}
p{margin:0 0 10px}ul{margin:0 0 10px;padding-left:22px}li{margin:0 0 6px}
.back{display:inline-block;margin-top:12px;font-weight:800;color:#1B8F8E}
</style>
</head>
<body>
<main>
  <div id="rules">Загружаем правила…</div>
  <a class="back" href="index.html">← Все игры</a>
</main>
<script>
/* Тот же текст, что в окне «Правила акции» внутри игр: config/rules.md (правит штаб). Разметка: # ## «- » **жирный**, <!-- --> не показывается. */
(function () {
  'use strict';
  var box = document.getElementById('rules');
  function inline(node, text) {
    var parts = String(text).split('**'), i, b;
    for (i = 0; i < parts.length; i++) {
      if (!parts[i]) continue;
      if (i % 2) { b = document.createElement('b'); b.textContent = parts[i]; node.appendChild(b); } else node.appendChild(document.createTextNode(parts[i]));
    }
  }
  function render(md) {
    var lines = String(md).replace(/<!--[\s\S]*?-->/g, '').split(/\r?\n/), i, l, m, ul = null, node;
    box.textContent = '';
    for (i = 0; i < lines.length; i++) {
      l = lines[i].replace(/\s+$/, '');
      if (!l.trim()) { ul = null; continue; }
      if ((m = /^\s*[-*]\s+(.*)$/.exec(l))) { if (!ul) { ul = document.createElement('ul'); box.appendChild(ul); } node = document.createElement('li'); inline(node, m[1]); ul.appendChild(node); continue; }
      ul = null;
      if ((m = /^#\s+(.*)$/.exec(l))) node = document.createElement('h2');
      else if ((m = /^##+\s+(.*)$/.exec(l))) node = document.createElement('h3');
      else { m = [l, l.trim()]; node = document.createElement('p'); }
      inline(node, m[1]); box.appendChild(node);
    }
  }
  fetch('config/rules.md', { cache: 'no-cache' }).then(function (r) { return r.ok ? r.text() : ''; })
    .then(function (t) { if (t) render(t); else box.textContent = 'Правила не загрузились. Обновите страницу.'; },
          function () { box.textContent = 'Правила не загрузились. Обновите страницу.'; });
})();
</script>
</body>
</html>
