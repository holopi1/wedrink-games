<!DOCTYPE html>

<meta charset="utf-8">
<!--
  «Трубочка» — прототип мини-игры для WeDrink (Новосибирск). slug = trubochka.
  Один файл: HTML + CSS + JS, без внешних библиотек, шрифтов, картинок и запросов в сеть.
  Стандарт: D:/Obsidian/_code/wedrink-game/SPEC.md (v2 + дополнения v3 и v4, 2026-11-16).

  Суть: стакан запаян бирюзовой плёнкой, по плёнке ездит печать WeDrink, над стаканом висит трубочка.
  Тап, клик или пробел — трубочка бьёт вниз. 10 стаканов, за каждый 0–30, итог 0–300.

  Палитра бренда и цвета напитков — в :root (источник: аудит бренда и исходники постеров; брендбука нет).
  Состав напитков — по меню (wedrink-tools/cards/menu_data.py).
  Проверка: ?reset=1 обнуляет счётчик попыток этой игры; ?season=winter или ?season=default переключает оформление.
-->

<style>
:root{
  /* --- фирменные цвета WeDrink --- */
  --brand:#1B8F8E;
  --brand-dark:#156F6E;
  --accent:#DC223C;
  --bg:#FBF7EC;
  --ink:#1F2A2A;
  /* --- служебные тона интерфейса --- */
  --accent-dark:#AE1830;
  --card:#FFFDF6;
  --muted:#4A5A5A;
  --soft:#DDEDEA;
  --soft-2:#C6E4E0;
  --line:#E8DFC4;
  --sun:#FFD45C;
  --film-hi:#3DB8B4;
  /* --- зима: вечерний фон и тёплый свет --- */
  --night-1:#0E4B52;
  --night-2:#123C5A;
  --night-3:#152B4E;
  --warm:#FFC56B;
  --warm-hi:#FFF1CF;
  --snow:#F4FAFF;
  /* --- цвета напитков и добавок (по меню) --- */
  --milk-tea:#DDB184;
  --milk-tea-deep:#B88453;
  --milk:#F8EEDC;
  --grape-tea:#CFA9DA;
  --grape-tea-deep:#A677BC;
  --grape-jam:#6A3C8C;
  --lemon:#F1CD43;
  --lemon-in:#FBEFA6;
  --berry-tea:#F6AAB4;
  --berry-tea-deep:#E36F86;
  --cheese:#FFE9A8;
  --peach-jelly:#FFB077;
  --coco-jelly:#F6F3E8;
  --tapioca:#3A2418;
  --oreo:#2B2320;
  --oreo-cream:#F4EEE2;
  --choco:#8F5E40;
  --choco-deep:#5E3823;
  --coconut-milk:#F3E6D2;
  --ice:#E6F5F8;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--brand-dark);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body.winter{background:#0A2233}
#app{
  /* цвета текста на фоне страницы: в зимнем оформлении фон тёмный, текст светлый */
  --t-ink:var(--ink);--t-muted:var(--muted);--t-brand:var(--brand);--t-brand-dark:var(--brand-dark);--t-accent:var(--accent);
  position:fixed;top:0;right:0;bottom:0;left:0;margin:auto;
  width:100%;max-width:460px;height:100%;max-height:920px;
  background:
    radial-gradient(120% 55% at 50% -8%,rgba(27,143,142,.24),rgba(27,143,142,0) 62%),
    radial-gradient(90% 45% at 105% 102%,rgba(220,34,60,.09),rgba(220,34,60,0) 60%),
    radial-gradient(80% 40% at -10% 90%,rgba(27,143,142,.12),rgba(27,143,142,0) 60%),
    var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app.winter{
  --t-ink:#F7FCFB;--t-muted:#C9E0E3;--t-brand:#FFFFFF;--t-brand-dark:#C4F0EC;--t-accent:var(--sun);
  background:
    radial-gradient(90% 40% at 50% 104%,rgba(255,197,107,.20),rgba(255,197,107,0) 70%),
    linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 55%,var(--night-3) 100%);
}
/* едва заметный узор из шариков тапиоки; сдвигается за пальцем (параллакс) */
#app::before{
  content:"";position:absolute;top:0;right:0;bottom:0;left:0;pointer-events:none;z-index:0;
  background-image:
    radial-gradient(circle at 14px 14px,rgba(58,36,24,.06) 5px,rgba(58,36,24,0) 6px),
    radial-gradient(circle at 52px 44px,rgba(27,143,142,.08) 8px,rgba(27,143,142,0) 9px),
    radial-gradient(circle at 80px 18px,rgba(27,143,142,.06) 4px,rgba(27,143,142,0) 5px);
  background-size:72px 72px,112px 112px,96px 96px;
  background-position:calc(var(--px,0) * 8px) calc(var(--py,0) * 8px),calc(var(--px,0) * 16px) calc(var(--py,0) * 16px),calc(var(--px,0) * 11px) calc(var(--py,0) * 11px);
  transition:background-position .35s ease-out;
}
#app.winter::before{
  background-image:
    radial-gradient(circle at 14px 14px,rgba(255,255,255,.07) 2px,rgba(255,255,255,0) 3px),
    radial-gradient(circle at 52px 44px,rgba(255,255,255,.05) 4px,rgba(255,255,255,0) 5px),
    radial-gradient(circle at 80px 18px,rgba(255,255,255,.06) 1.5px,rgba(255,255,255,0) 2.5px);
}
@media (min-width:520px) and (min-height:640px){
  #app{height:calc(100% - 40px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
}
#fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none}

/* шапка бренда — на каждом экране */
.brandbar{position:relative;z-index:1;flex:none;text-align:center;padding:14px 16px 6px}
.wm{position:relative;display:inline-block;font-weight:900;font-size:36px;line-height:1;letter-spacing:-.02em;color:var(--t-brand)}
.flake{display:none;position:absolute;right:-24px;top:1px;width:18px;height:18px;fill:none;stroke:var(--snow);stroke-width:2;stroke-linecap:round;animation:spin 14s linear infinite}
.winter .flake{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.city{font-weight:700;font-size:12px;line-height:1.2;letter-spacing:.16em;text-transform:uppercase;color:var(--t-brand-dark);margin-top:3px}
#app.is-game .brandbar{padding:8px 16px 2px}
#app.is-game .wm{font-size:26px}
#app.is-game .city{font-size:10px;margin-top:1px}
#app.is-game .flake{width:13px;height:13px;right:-18px}
/* гирлянда под шапкой — только зимой, вне игры (в игре гирлянда нарисована на сцене) */
.garland{display:none;position:relative;z-index:1;flex:none;height:18px;padding:0 10px;justify-content:space-between}
.winter .garland{display:flex}
.winter.is-game .garland{display:none}
.garland::before{content:"";position:absolute;left:4px;right:4px;top:-12px;height:16px;border-bottom:1.5px solid rgba(255,255,255,.32);border-radius:0 0 50% 50%/0 0 100% 100%}
.garland i{
  display:block;width:9px;height:12px;border-radius:50% 50% 50% 50%/42% 42% 58% 58%;color:var(--sun);background:currentColor;
  box-shadow:0 0 10px 3px currentColor;opacity:.9;animation:twinkle 2.6s ease-in-out infinite;transition:box-shadow .4s;
}
.garland i:nth-child(4n+2){color:#FF7387;animation-delay:-.7s}
.garland i:nth-child(4n+3){color:var(--film-hi);animation-delay:-1.5s}
.garland i:nth-child(4n){color:var(--warm-hi);animation-delay:-2.1s}
.garland i:nth-child(1),.garland i:nth-child(9){margin-top:0}
.garland i:nth-child(2),.garland i:nth-child(8){margin-top:2.5px}
.garland i:nth-child(3),.garland i:nth-child(7){margin-top:4px}
.garland i:nth-child(4),.garland i:nth-child(6){margin-top:5px}
.garland i:nth-child(5){margin-top:5.5px}
.garland.bright i{box-shadow:0 0 18px 7px currentColor;animation-duration:.8s}
@keyframes twinkle{0%,100%{opacity:.55}50%{opacity:1}}

.screens{position:relative;z-index:1;flex:1;min-height:0}
.screen{position:absolute;top:0;right:0;bottom:0;left:0;display:none;flex-direction:column}
.screen.is-on{display:flex;animation:scr-in .36s cubic-bezier(.2,.9,.3,1) both}
.screen.is-off{display:flex;pointer-events:none;animation:scr-out .2s ease-in both}
.screen.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
@keyframes scr-in{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes scr-out{from{opacity:1;transform:none}to{opacity:0;transform:translateY(-12px)}}

.btn{
  -webkit-appearance:none;appearance:none;border:0;border-radius:999px;cursor:pointer;flex:none;
  background:linear-gradient(180deg,#E8384F,var(--accent) 55%,var(--accent-dark));color:#fff;font:800 20px/1 var(--font);letter-spacing:.01em;
  padding:18px 30px;min-width:220px;box-shadow:0 6px 0 rgba(31,42,42,.2),0 12px 22px rgba(220,34,60,.28);
  touch-action:manipulation;transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px) scale(.98);box-shadow:0 2px 0 rgba(31,42,42,.2),0 6px 12px rgba(220,34,60,.24)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}

/* старт */
#s-start{--gap:8px;align-items:center;text-align:center;padding:0 18px 4px;gap:var(--gap)}
/* распорки сверху и снизу держат содержимое по центру; когда места нет — сжимаются до нуля, экран прокручивается */
#s-start::before,#s-result::before,#s-limit::before{content:"";flex:1 0 0;margin-bottom:calc(var(--gap) * -1)}
#s-start::after,#s-result::after,#s-limit::after{content:"";flex:1 0 0;margin-top:calc(var(--gap) * -1)}
.origin{font-size:12px;line-height:1.2;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--t-accent)}
.top{display:flex;align-items:center;gap:10px;width:100%;max-width:360px;text-align:left}
.hero-wrap{position:relative;flex:none;width:42%;height:200px;height:clamp(186px,36vh,340px)}
#hero{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.intro{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.title{font-size:34px;line-height:1;font-weight:900;letter-spacing:-.01em;color:var(--t-ink)}
.daily{font-size:15px;line-height:1.3;color:var(--t-muted)}
.daily b{color:var(--t-ink);font-weight:800}
.stars{color:var(--t-accent);letter-spacing:.06em;white-space:nowrap}
.compo{font-size:12px;line-height:1.35;color:var(--t-muted)}
.stats{
  width:100%;max-width:360px;background:var(--card);border:2px solid var(--line);border-radius:18px;
  padding:8px 12px 7px;display:flex;flex-direction:column;gap:5px;box-shadow:0 8px 20px rgba(21,111,110,.10);
}
.stat-row{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:800;color:var(--ink)}
.cups7{display:flex;justify-content:space-between;gap:2px}
.c7{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px}
.c7 svg{width:20px;height:27px;display:block}
.c7 path{fill:none;stroke:var(--brand);stroke-width:1.6;stroke-linejoin:round}
.c7 ellipse{fill:var(--card);stroke:var(--brand);stroke-width:1.6}
.c7 span{font-size:10px;font-weight:700;color:var(--muted)}
.c7.got path{fill:var(--brand)}
.c7.got ellipse{fill:var(--brand-dark)}
.c7.today span{color:var(--accent)}
.c7.today svg{filter:drop-shadow(0 2px 0 var(--sun))}
.rule{font-size:14px;line-height:1.35;color:var(--t-muted);max-width:340px}
.meta{font-size:13px;line-height:1.4;color:var(--t-muted)}
.meta b{color:var(--t-ink)}
.proto{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--t-brand-dark);opacity:.8}
@media (max-width:340px){.title{font-size:30px}.daily{font-size:14px}.wm{font-size:32px}.hint{font-size:14px;line-height:1.2}}
@media (max-height:600px){.btn{padding:15px 26px}#s-start{--gap:6px}.brandbar{padding-top:10px}}

/* игра */
#s-game{touch-action:none;cursor:pointer}
.hud{display:flex;gap:8px;padding:6px 12px 6px}
.chip{
  flex:1;min-width:0;background:var(--card);border:2px solid var(--line);border-radius:14px;
  padding:4px 4px 5px;text-align:center;
}
.chip i{display:block;font-style:normal;font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.chip b{display:block;font-size:24px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums}
.chip.total{background:linear-gradient(135deg,var(--brand),var(--brand-dark));border-color:var(--brand-dark)}
.chip.total i{color:rgba(255,255,255,.8)}
.chip.total b{color:#fff}
.chip.bump{animation:bump .3s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1)}}
.timer{height:6px;margin:0 16px 6px;border-radius:3px;background:rgba(27,143,142,.18);overflow:hidden}
.winter .timer{background:rgba(255,255,255,.2)}
.timer div{height:100%;width:100%;background:var(--brand);transform-origin:0 50%;border-radius:3px}
.winter .timer div{background:var(--film-hi)}
.timer.low div{background:var(--accent)}
.stage{
  position:relative;flex:1;min-height:0;margin:0 10px;border-radius:24px;overflow:hidden;
  background:linear-gradient(180deg,var(--soft),var(--soft-2));touch-action:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.winter .stage{background:linear-gradient(180deg,var(--night-1),var(--night-3));box-shadow:inset 0 0 0 2px rgba(255,255,255,.12)}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.pop{
  position:absolute;left:50%;top:10px;z-index:2;pointer-events:none;text-align:center;white-space:nowrap;
  background:var(--card);border-radius:18px;padding:8px 18px 9px;box-shadow:0 6px 18px rgba(31,42,42,.2);
  opacity:0;transform:translate(-50%,-8px) scale(.92);transition:opacity .18s,transform .18s;
}
.pop b{display:block;font-size:32px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:var(--brand-dark)}
.pop span{display:block;font-size:14px;font-weight:800;margin-top:3px}
.pop.on{opacity:1;animation:pop .34s cubic-bezier(.2,1.5,.4,1) both}
.pop.bull{background:var(--sun)}
.pop.bull b{color:var(--ink)}
.pop.bad b{color:var(--accent)}
@keyframes pop{from{transform:translate(-50%,-8px) scale(.6)}to{transform:translate(-50%,0) scale(1)}}
.combo{
  position:absolute;right:10px;bottom:10px;z-index:2;pointer-events:none;
  background:var(--accent);color:#fff;font-size:14px;font-weight:900;letter-spacing:.02em;
  padding:6px 12px;border-radius:999px;opacity:0;transform:scale(.8);transition:opacity .2s,transform .2s;
}
.combo.on{opacity:1;transform:scale(1)}
.hint{height:40px;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 12px;font-size:15px;font-weight:800;color:var(--t-brand-dark)}

/* результат и лимит */
#s-result,#s-limit{--gap:10px;align-items:center;text-align:center;padding:0 20px 6px;gap:var(--gap)}
.res-title{font-size:27px;line-height:1.14;font-weight:900;max-width:340px;color:var(--t-ink)}
.score{display:flex;align-items:baseline;justify-content:center;gap:8px}
.score b{font-size:76px;line-height:.95;font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;color:var(--t-ink)}
.win .score b{color:var(--t-brand)}
.score span{font-size:18px;font-weight:700;color:var(--t-muted)}
.rows{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;width:100%;max-width:340px}
.rows div{
  background:var(--card);border:2px solid var(--line);border-radius:9px;padding:5px 0;font-size:13px;font-weight:900;color:var(--ink);
  font-variant-numeric:tabular-nums;animation:chip-in .32s cubic-bezier(.2,1.5,.4,1) both;animation-delay:calc(var(--i,0) * 45ms + 120ms);
}
.rows .bull{background:var(--accent);border-color:var(--accent);color:#fff}
.rows .zero{color:var(--muted);opacity:.7}
@keyframes chip-in{from{opacity:0;transform:translateY(8px) scale(.7)}to{opacity:1;transform:none}}
/* билет приза */
.ticket{
  position:relative;width:100%;max-width:340px;border-radius:22px;background:var(--card);color:var(--ink);overflow:hidden;
  box-shadow:0 0 0 2px var(--brand),0 14px 30px rgba(21,111,110,.25);animation:ticket-in .5s cubic-bezier(.2,1.3,.4,1) both;
}
@keyframes ticket-in{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
.ticket-top{position:relative;overflow:hidden;color:#fff;padding:10px 16px 11px;background:linear-gradient(135deg,var(--film-hi),var(--brand) 45%,var(--brand-dark))}
.ticket.drink .ticket-top{background:linear-gradient(135deg,#F0495F,var(--accent) 45%,var(--accent-dark))}
.ticket-top::after{
  content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;
  background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:shine 2.8s ease-in-out infinite;
}
@keyframes shine{0%,35%{left:-60%}75%,100%{left:120%}}
.ticket-head{font-size:24px;line-height:1.1;font-weight:900}
.ticket-line{font-size:15px;font-weight:700;opacity:.95;margin-top:3px}
.ticket-tag{display:inline-block;background:rgba(31,42,42,.28);color:#fff;font-size:10px;line-height:1.2;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-bottom:4px}
.ticket-body{padding:11px 14px 12px}
.ticket-how{font-size:14px;line-height:1.3;font-weight:700;color:var(--muted)}
.ticket-word{
  margin:8px 0;padding:10px 6px;border-radius:14px;border:2px dashed var(--brand);background:var(--bg);
  font-size:32px;line-height:1;font-weight:900;letter-spacing:.05em;color:var(--accent);
}
.ticket-one{font-size:13px;font-weight:700;color:var(--muted)}
.ticket-stamp{font-size:17px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand-dark);margin-top:3px}
.ticket-bow{display:none}
/* зимой билет — новогодняя открытка: тёплый свет, лента с бантом, снег на шапке билета */
.winter .ticket{
  background:radial-gradient(120% 90% at 50% 0%,var(--warm-hi),#FFE9BE 70%,#FFDDA2);
  box-shadow:0 0 0 2px rgba(255,241,207,.9),0 0 46px rgba(255,197,107,.55),0 14px 30px rgba(0,0,0,.3);
}
.winter .ticket-top{
  background-image:
    radial-gradient(circle at 12px 10px,rgba(255,255,255,.8) 1.6px,rgba(255,255,255,0) 2.4px),
    radial-gradient(circle at 34px 30px,rgba(255,255,255,.55) 1.2px,rgba(255,255,255,0) 2px),
    linear-gradient(135deg,var(--film-hi),var(--brand) 45%,var(--brand-dark));
  background-size:46px 40px,58px 46px,auto;
}
.winter .ticket.drink .ticket-top{
  background-image:
    radial-gradient(circle at 12px 10px,rgba(255,255,255,.8) 1.6px,rgba(255,255,255,0) 2.4px),
    radial-gradient(circle at 34px 30px,rgba(255,255,255,.55) 1.2px,rgba(255,255,255,0) 2px),
    linear-gradient(135deg,#F0495F,var(--accent) 45%,var(--accent-dark));
}
.winter .ticket-top,.winter .ticket-body{padding-left:46px}
.winter .ticket::before{
  content:"";position:absolute;z-index:2;top:0;bottom:0;left:18px;width:14px;
  background:linear-gradient(90deg,var(--accent-dark),var(--accent) 30%,#F0495F 50%,var(--accent) 70%,var(--accent-dark));
  box-shadow:0 0 0 1px rgba(255,255,255,.35);
}
.winter .ticket.drink::before{background:linear-gradient(90deg,#C99A2E,var(--sun) 30%,var(--warm-hi) 50%,var(--sun) 70%,#C99A2E)}
.winter .ticket-bow{display:block;position:absolute;z-index:3;left:-3px;top:38px;width:56px;height:40px;fill:var(--accent);stroke:var(--accent-dark);stroke-width:1.5;stroke-linejoin:round}
.winter .ticket.drink .ticket-bow{fill:var(--sun);stroke:#C99A2E}
.winter .ticket-word{background:rgba(255,255,255,.7)}
.note{font-size:15px;line-height:1.35;color:var(--t-muted);max-width:330px}
.note:empty{display:none}
.limit-title{font-size:28px;line-height:1.15;font-weight:900;max-width:320px;color:var(--t-ink)}
.limit-record{font-size:18px;font-weight:800;color:var(--t-brand-dark)}
.toast{
  position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.on{opacity:.94}
@media (max-height:600px){.score b{font-size:58px}#s-result,#s-limit{--gap:6px}.ticket-word{font-size:28px;padding:8px 6px;margin:6px 0}.ticket-head{font-size:22px}.ticket-body{padding:9px 14px 10px}}
/* меньше движения: без мерцания, блеска и вращения; переходы экранов короткие */
@media (prefers-reduced-motion:reduce){
  .garland i,.flake,.ticket-top::after{animation:none}
  .screen.is-on,.screen.is-off,.ticket,.rows div,.chip.bump{animation-duration:.01s;animation-delay:0s}
  #app::before{transition:none;background-position:0 0}
}

.wd-mascot{display:block;flex:none;width:clamp(72px,18vh,136px);height:clamp(72px,18vh,136px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;
  animation:wd-sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(31,42,42,.18));
  pointer-events:none;-webkit-user-select:none;user-select:none}
/* у билета маскот выглядывает над его правым верхним краем и не занимает места в потоке (кнопки не уезжают) */
.wd-prize-m{display:none;position:relative;height:0;width:100%;flex:none;pointer-events:none;z-index:2}
.wd-prize-m::before{content:"";position:absolute;right:0;bottom:-12px;width:clamp(68px,10vh,88px);height:clamp(68px,10vh,88px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;animation:wd-sway 3.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 6px rgba(31,42,42,.22))}
#s-result:has(#res-ticket:not(:empty)) .wd-prize-m{display:block}
@keyframes wd-sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
#app.winter .wd-mascot,#app[data-season="winter"] .wd-mascot{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#app.winter .wd-prize-m::before,#app[data-season="winter"] .wd-prize-m::before{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@media (max-height:640px){.wd-mascot{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.wd-mascot,.wd-prize-m::before{animation:none}}

/* ===== v6: общий слой — кнопка «Все игры», настройки, быстрая кнопка звука, касания, безопасные зоны ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}
a,button{-webkit-touch-callout:none}
.wdx-ibtn{
  position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);
  display:none;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:#156F6E;box-shadow:0 2px 10px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(27,143,142,.35);
  font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .1s;
}
.wdx-ibtn svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wdx-ibtn:active{transform:scale(.92)}
.wdx-ibtn:focus-visible,.wdx-row:focus-visible,.wdx-done:focus-visible,.wdx-next:focus-visible,.wdx-back:focus-visible{outline:3px solid #DC223C;outline-offset:2px}
.wdx-gear{display:flex}
.wdx-snd{top:calc(env(safe-area-inset-top,0px) + 4px);width:42px;height:42px}
.wdx-snd svg{width:22px;height:22px}
#app .wdx-gear{display:none}
#app:has(#s-start.is-on) .wdx-gear,#app:has(#s-result.is-on) .wdx-gear,#app:has(#s-limit.is-on) .wdx-gear{display:flex}
#app:has(#s-game.is-on) .wdx-snd{display:flex}
@supports not selector(:has(*)){#app .wdx-gear{display:flex}}
body > .wdx-ibtn{position:absolute}

.wdx-back{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;min-height:50px;margin:4px auto 0;padding:12px 18px;
  border-radius:16px;background:#fff;color:#156F6E;box-shadow:inset 0 0 0 2.5px #1B8F8E,0 3px 0 rgba(21,111,110,.35);
  font:800 17px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-decoration:none;text-align:center;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,box-shadow .08s;
}
.wdx-back:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px #1B8F8E,0 1px 0 rgba(21,111,110,.35)}
.wdx-back::before{content:"";width:9px;height:9px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);margin-right:2px;flex:none}

.wdx-set{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,32,36,.62);animation:wdx-in .18s ease both}
.wdx-set.wdx-fixed{position:fixed}
.wdx-set[hidden]{display:none !important}
.wdx-card{width:100%;max-width:340px;max-height:100%;overflow:auto;padding:20px 18px 18px;border-radius:24px;background:#FFFDF6;color:#1F2A2A;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:wdx-pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.wdx-card h2{margin:0 0 6px;font:900 24px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;color:#156F6E}
.wdx-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;margin:0;padding:8px 2px;border:0;border-bottom:1px solid #E8DFC4;border-radius:0;background:none;
  color:#1F2A2A;font:800 18px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;
}
.wdx-sw{position:relative;flex:none;width:54px;height:32px;border-radius:16px;background:#B9C6C5;transition:background .15s}
.wdx-sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.wdx-row[aria-checked="true"] .wdx-sw{background:#1B8F8E}
.wdx-row[aria-checked="true"] .wdx-sw::after{transform:translateX(22px)}
.wdx-done{display:block;width:100%;min-height:52px;margin:16px 0 0;padding:12px;border:0;border-radius:16px;background:#DC223C;color:#fff;box-shadow:0 4px 0 #A5192C;
  font:900 18px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-done:active{transform:translateY(2px);box-shadow:0 2px 0 #A5192C}
.wdx-now{margin:12px 2px 0;font:700 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#4E5F5E;overflow-wrap:anywhere}
.wdx-next{display:block;width:100%;min-height:48px;margin:10px 0 0;padding:10px;border:2px solid #1B8F8E;border-radius:14px;background:none;color:#156F6E;font:800 16px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-next:active{transform:translateY(1px)}
.wdx-next:disabled{opacity:.4;cursor:default}
.wdx-now[hidden],.wdx-next[hidden]{display:none}
@keyframes wdx-in{from{opacity:0}to{opacity:1}}
@keyframes wdx-pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wdx-set,.wdx-card{animation:none}.wdx-ibtn,.wdx-back,.wdx-sw,.wdx-sw::after{transition:none}}

<script>
/* ============================================================================
   WDX (v9) — общий слой всех игр и зала WeDrink: настройки, музыка, Telegram Mini App, MAX, VK Mini Apps, слова дня,
   прямой вход в игру по ссылке, счётчики для штаба, суточный потолок главного приза.
   Один источник: _build/kit/wdx.js; в зал и игры раскладывает _build/sync_wdx.py (блок одинаков во всех файлах).
   Профиль wedrink.profile.v1: пишем только поля music и sfx (по умолчанию включено), остальное не трогаем.
   Музыка: плейлист assets/music/playlist.json, треки идут по кругу; текущий тянется лениво, только после первого касания.
   Сеть: скрипты клиентов (Telegram, MAX, VK Bridge) только внутри своего клиента; config/prize.json (тексты приза);
   на боевом адресе — сервер игр /api/ (события без личных данных и проверка главного приза). Сервер недоступен — игра идёт как раньше.
   ============================================================================ */
(function () {
  'use strict';
  var PROFILE_KEY = 'wedrink.profile.v1';
  var MUSIC_DIR = 'assets/music/';           // playlist.json и треки
  var MUSIC_GAP = 400;                       // пауза, если перехода нет, мс
  var MUSIC_XF = 1.5;                        // плавный переход между треками, с
  var MUSIC_XF_SKIP = 0.6;                   // то же по кнопке «Следующий трек»
  var MUSIC_VOL = 0.35;                      // громкость фоновой музыки
  var TG_SRC = 'https://telegram.org/js/telegram-web-app.js';
  var TG_FLAG = 'wedrink.tg';
  var MAX_SRC = 'https://st.max.ru/js/max-web-app.js';                  // dev.max.ru/docs/webapps/bridge, «Подключение библиотеки»
  var MAX_FLAG = 'wedrink.max';
  var VK_SRC = 'https://unpkg.com/@vkontakte/vk-bridge@2.15.12/dist/browser.min.js';   // адрес из dev.vk.ru/en/bridge/getting-started, версия закреплена
  var VK_SRI = 'sha384-zMslrVQ3fVDIQqW7ztZS5ewZJsN29NP1vJFbKATVzqIeeinYRVG8gCR2p7X/SuwC';
  var LP_KEY = 'wedrink.lp';                  // параметры запуска (VK / MAX / Telegram), чтобы не терять при переходах зал <-> игра
  /* Тексты приза. Главное место — config/prize.json (правит штаб после сверки с кассой); здесь запасная копия на случай,
     если файл не загрузился. Числа порогов и попыток живут в коде игр (PRIZE_TOPPING, ATTEMPTS_PER_DAY) — тексты им не противоречат. */
  var COND = '250 очков и больше — топпинг в подарок к напитку, все 300 — напиток до 250 ₽ за наш счёт при заказе от 120 ₽. Главных призов — десять в день: кто набрал 300 позже, получает топпинг. Назови на кассе слово дня и номер телефона в день игры: каждый приз — раз в день, в одном заказе — один приз, кофе не участвует. До 31 декабря.';
  var VALID = 'Слово действует сегодня до закрытия точки (22:00 по Новосибирску).';
  var HEAD = { topping: 'Топпинг в подарок', drink: 'Напиток до 250 ₽ за наш счёт' };
  var CAP_NOTE = 'Главные призы на сегодня разобраны — за 300 очков сегодня топпинг в подарок.';
  var PRIZE_URL = 'config/prize.json';
  /* Сервер игр (server/README.md): только на боевом адресе. window.WDX_API — подмена адреса для проверки. */
  var API = 'https://games.we-drink.online/api/';
  var VID_KEY = 'wedrink.vid', SRC_KEY = 'wedrink.src', CAP_KEY = 'wedrink.cap';
  var HALL_COLOR = { light: '#FBF7EC', winter: '#0F5059' };
  var GAME_COLOR = { light: '#FBF7EC', winter: '#0F5059' };

  var cfg = { base: '', hall: false, sfx: false, shell: false };
  var cache = {}, ui = {}, audio = null, ctx = null, gain = null;
  var list = null, idx = 0, loaded = -1, seekTo = 0, wantPlay = false, listLoading = false, listTries = 0, gapT = 0, errs = 0, slots = [], cur = null, primed = false;
  var started = false, suspended = false, lastFocus = null, touched = false;
  var theme = { winter: false }, tgW = null, tgPending = false, tgLoading = false;
  var mxW = null, mxLoading = false, vkB = null, vkLoading = false, coded = null;
  var holdMode = false, backCb = null, shellWin = null, shellClose = null, shellSt = { has: false, now: '' };
  var srvCur = null, capPend = false, capMem = null, memVid = '', prizeLoaded = false, realPlay = false;

  /* ---------- профиль: читаем целиком, меняем одно поле ---------- */
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function readProfile() {
    try { var o = JSON.parse(window.localStorage.getItem(PROFILE_KEY)); return isObj(o) ? o : {}; } catch (e) { return {}; }
  }
  function pref(name) {
    if (Object.prototype.hasOwnProperty.call(cache, name)) return cache[name];
    return readProfile()[name] !== false;     // по умолчанию включено
  }
  function setPref(name, on) {
    var p;
    cache[name] = !!on;
    try { p = readProfile(); p[name] = !!on; window.localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* без хранилища — до конца сессии */ }
  }

  /* ---------- параметры запуска клиентов: VK (vk_*, sign), Telegram (tgWebApp*), MAX (WebApp*) ---------- */
  var LP_NAME = /^(vk_[a-z_]+|sign|tgWebApp[A-Za-z]*|WebApp[A-Za-z]*)$/;
  function launchQuery() {                    // только служебные параметры клиентов, без ?preview= и ?season=
    var q = '', parts, i, out = [], k, saved = '';
    try { q = String(window.location.search || '').replace(/^\?/, ''); } catch (e) { q = ''; }
    parts = q ? q.split('&') : [];
    for (i = 0; i < parts.length; i++) { k = parts[i].split('=')[0]; if (LP_NAME.test(k)) out.push(parts[i]); }
    if (out.length) {
      q = out.join('&');
      try { window.sessionStorage.setItem(LP_KEY, q); } catch (e) { /* нет sessionStorage */ }
      return q;
    }
    try { saved = window.sessionStorage.getItem(LP_KEY) || ''; } catch (e) { saved = ''; }
    return /^[A-Za-z0-9_=&%.~+\-]*$/.test(saved) ? saved : '';
  }
  function maxHash() {                        // MAX кладёт WebAppData, WebAppPlatform, WebAppVersion в часть после # (dev.max.ru/docs/webapps/validation)
    var h = '';
    try { h = String(window.location.hash || ''); } catch (e) { h = ''; }
    return /[#&](WebAppData|WebAppPlatform|WebAppVersion)=/.test(h) ? h : '';
  }
  function withParams(url) {                  // дописать к ссылке параметры запуска, если они есть
    var h = '', i = url.indexOf('#'), lp = launchQuery();
    if (i >= 0) { h = url.slice(i); url = url.slice(0, i); }
    if (lp) url += (url.indexOf('?') < 0 ? '?' : '&') + lp;
    if (!h) h = maxHash();
    return url + h;
  }
  function hallUrl() {
    var m = null, q = '';
    try { m = /[?&]season=(winter|default)(?:&|$)/.exec(String(window.location.search || '')); } catch (e) { m = null; }
    if (m && !cfg.hall) q = '?season=' + m[1];
    return withParams(cfg.base + 'index.html' + q);
  }
  function goHall() {
    if (cfg.shell) { shellPost('close'); return; }       // в оболочке «в зал» — закрыть iframe
    try { window.location.href = hallUrl(); } catch (e) { /* адрес недоступен */ }
  }
  function backFn() { if (cfg.hall) { if (backCb) backCb(); } else goHall(); }    // «назад» Telegram / MAX: в зале — закрыть игру, в игре — в зал
  function setBack(cb) { backCb = typeof cb === 'function' ? cb : null; if (tgW) tgApply(); if (mxW) maxApply(); }

  /* ---------- оболочка (Р-1176): зал держит плеер, игра внутри iframe шлёт ему сообщения; музыка не прерывается при переходах ---------- */
  var HAPTIC_OK = { light: 1, medium: 1, heavy: 1, rigid: 1, soft: 1, success: 1, warning: 1, error: 1, select: 1 };
  function buzzPat(p) {                       // число или короткий массив чисел 0…500 мс (то, что приходит из игры, чистим)
    var out = [], i;
    if (typeof p === 'number') return Math.max(0, Math.min(500, +p || 0));
    if (!Array.isArray(p)) return 10;
    for (i = 0; i < p.length && i < 12; i++) out.push(Math.max(0, Math.min(500, +p[i] || 0)));
    return out;
  }
  function shellFlag() {                      // игра открыта внутри iframe зала: в адресе shell=1 и есть родитель
    var q = '';
    try { q = String(window.location.search || ''); } catch (e) { q = ''; }
    try { return /[?&]shell=1(?:&|$)/.test(q) && !!window.parent && window.parent !== window; } catch (e) { return false; }
  }
  function shellPost(t, d) {                  // игра -> зал
    var m = { wdx: 1, t: t }, k;
    if (d) for (k in d) if (Object.prototype.hasOwnProperty.call(d, k)) m[k] = d[k];
    try { window.parent.postMessage(m, window.location.origin); } catch (e) { /* зала нет */ }
  }
  function shellState() {                     // зал -> игра: что показать в настройках
    var m = { wdx: 1, t: 'state', has: !!(list && list.length), now: curTitle() };
    try { if (shellWin && shellWin.postMessage) shellWin.postMessage(m, window.location.origin); } catch (e) { /* игра закрыта */ }
  }
  function onShellMsg(e) {
    var m = e && e.data;
    try { if (!e || e.origin !== window.location.origin || !isObj(m) || m.wdx !== 1) return; } catch (x) { return; }
    if (cfg.shell) {                          // зал -> игре
      if (m.t === 'state') { shellSt.has = !!m.has; shellSt.now = String(m.now || '').slice(0, 80); syncUi(); }
      return;
    }
    if (!cfg.hall || !shellWin || e.source !== shellWin) return;      // игре -> залу: только от нашего iframe
    if (m.t === 'ready') shellState();
    else if (m.t === 'pref') { cache = {}; if (m.k === 'music') { if (pref('music')) play(); else stop(); } syncUi(); }
    else if (m.t === 'next') { skip(); syncUi(); }
    else if (m.t === 'hold') { holdMode = true; stop(); }
    else if (m.t === 'release') { holdMode = false; if (pref('music')) play(); }
    else if (m.t === 'haptic') { touched = true; if (HAPTIC_OK[m.k] === 1) haptic(m.k); }
    else if (m.t === 'buzz') { touched = true; buzz(buzzPat(m.p)); }
    else if (m.t === 'close') { if (shellClose) shellClose(); }
  }


  /* ---------- музыка: плейлист assets/music/playlist.json, плавные переходы между треками ---------- */
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';   // для «разблокировки» запасных плееров первым касанием
  function trackUrl(i) { return cfg.base + MUSIC_DIR + list[i].file; }
  function nextIdx(i) { return (i + 1) % list.length; }
  function curTitle() { return (list && list[idx]) ? list[idx].title : ''; }
  function savePos() {                        // файл и позиция текущего трека — для перехода зал <-> игра
    var t = 0;
    if (!list || !list[idx]) return;
    if (loaded === idx && audio && audio.currentTime > 0) t = audio.currentTime;
    try { window.sessionStorage.setItem('wedrink.mt', JSON.stringify({ f: list[idx].file, t: t, ts: Date.now() })); } catch (e) { /* нет sessionStorage */ }
  }
  function restoreIdx() {                     // первый запуск — случайный трек, дальше по порядку
    var s = null, i, k = -1;
    try { s = JSON.parse(window.sessionStorage.getItem('wedrink.mt')); } catch (e) { s = null; }
    if (s && typeof s.f === 'string') for (i = 0; i < list.length; i++) if (list[i].file === s.f) k = i;
    if (k < 0) { idx = Math.floor(Math.random() * list.length); return; }
    if (isFinite(s.t) && Date.now() - s.ts < 20000) { idx = k; seekTo = s.t > 0 ? s.t : 0; }   // продолжаем с того же места
    else idx = nextIdx(k);
  }
  function loadList() {
    var done;
    if (cfg.shell || list || listLoading || listTries >= 2) return;
    listLoading = true; listTries++;
    done = function (arr) {
      var out = [], i, o;
      listLoading = false;
      if (!Array.isArray(arr)) return;
      for (i = 0; i < arr.length; i++) {
        o = arr[i];
        if (isObj(o) && typeof o.file === 'string' && /^[A-Za-z0-9_\-]+\.mp3$/.test(o.file)) out.push({ file: o.file, title: typeof o.title === 'string' ? o.title : '', sec: +o.sec || 0 });
      }
      if (!out.length) return;
      list = out;
      restoreIdx();
      syncUi();
      if (wantPlay) { wantPlay = false; play(); }
    };
    try {
      fetch(cfg.base + MUSIC_DIR + 'playlist.json').then(function (r) { if (!r.ok) throw new Error('http'); return r.json(); }).then(done, function () { listLoading = false; });
    } catch (e) { listLoading = false; }
  }

  /* уровень слота 0..1 (итоговая громкость = уровень * MUSIC_VOL): через усилитель Web Audio или audio.volume */
  function setLv(s, v) {
    var t;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    s.lv = v;
    if (s.g) { try { t = ctx.currentTime; s.g.gain.cancelScheduledValues(t); s.g.gain.setValueAtTime(v * MUSIC_VOL, t); } catch (e) { /* не страшно */ } }
    else { try { s.a.volume = v * MUSIC_VOL; } catch (e) { /* не страшно */ } }
  }
  function rampLv(s, to, secs) {
    var from = s.lv, t, t0;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    if (s.g) {
      try {
        t = ctx.currentTime;
        s.g.gain.cancelScheduledValues(t);
        s.g.gain.setValueAtTime(s.g.gain.value, t);
        s.g.gain.linearRampToValueAtTime(to * MUSIC_VOL, t + secs);
      } catch (e) { /* не страшно */ }
      s.lv = to;
      return;
    }
    t0 = Date.now();
    s.ivl = setInterval(function () {
      var k = Math.min(1, (Date.now() - t0) / (secs * 1000));
      s.lv = from + (to - from) * k;
      try { s.a.volume = s.lv * MUSIC_VOL; } catch (e) { /* не страшно */ }
      if (k >= 1) { clearInterval(s.ivl); s.ivl = 0; }
    }, 40);
  }
  function quiet(s) {                         // слот освобождается: пауза, таймеры сброшены
    if (s.tm) { clearTimeout(s.tm); s.tm = 0; }
    if (s.pend) { clearTimeout(s.pend); s.pend = 0; }
    s.wantIn = false;
    if (s.ivl) { clearInterval(s.ivl); s.ivl = 0; }
    try { s.a.pause(); } catch (e) { /* не страшно */ }
    if (s.st === 'fade') s.st = 'idle';
    if (s.st === 'idle') s.f = -1;
    s.lv = 0;
  }
  function loadInto(s, i) { if (s.f !== i) { s.f = i; try { s.a.src = trackUrl(i); } catch (e) { /* не страшно */ } } }
  function slotWith(i) { var k; for (k = 0; k < slots.length; k++) if (slots[k].st === 'idle' && slots[k].f === i) return slots[k]; return null; }
  function idleSlot() { var k; for (k = 0; k < slots.length; k++) if (slots[k].st === 'idle') return slots[k]; return null; }
  function makeCur(s) { cur = s; s.st = 'cur'; audio = s.a; loaded = s.f; }

  function preloadNext() {                    // следующий трек подгружаем во второй плеер, когда текущий дошёл до середины
    var n, s;
    if (!list || list.length < 2 || loaded < 0) return;
    n = nextIdx(loaded);
    if (slotWith(n)) return;

    var w = { h: [], v: [], bodies: [], bubbles: [], t: rnd() * 10, straw: null }, i, j, def, n, b;
    for (i = 0; i < WN; i++) { w.h.push(0); w.v.push(0); }
    for (i = 0; i < list.length; i++) {
      def = BODY[list[i][0]];
      n = REDUCED ? Math.ceil(list[i][1] * 0.7) : list[i][1];
      for (j = 0; j < n; j++) {
        b = { kind: list[i][0], r: def.r * (0.88 + 0.24 * rnd()), dens: def.dens, box: !!def.box, x: 0, y: 0, vx: 0, vy: 0, rot: rnd() * TAU, vr: 0 };
        if (def.spread) b.y = LIQ + 0.15 + rnd() * (BODY_H - LIQ - 0.3);
        else if (def.mid) b.y = LIQ + 0.5 + rnd() * 0.35;
        else if (def.dens < 1) b.y = LIQ + 0.15 + rnd() * 0.6;
        else b.y = BODY_H - 0.12 - rnd() * 1.2;
        b.x = (rnd() * 2 - 1) * (wallAt(b.y) - b.r);
        w.bodies.push(b);
      }
    }
    n = REDUCED ? 4 : 9;
    for (i = 0; i < n; i++) w.bubbles.push(newBubble(rnd, true));
    for (i = 0; i < 150; i++) subStep(w, 1 / 60, rnd);              // добавки укладываются до показа
    for (i = 0; i < w.bodies.length; i++) { w.bodies[i].vx = 0; w.bodies[i].vy = 0; w.bodies[i].vr = 0; }

  }
  function stepWorld(w, dt, rnd) {
    var n = Math.max(1, Math.ceil(dt / 0.012)), s;
    for (s = 0; s < n; s++) subStep(w, dt / n, rnd);
  }
  function subStep(w, dt, rnd) {
    var list = w.bodies, hh = w.h, vv = w.v, i, j, a, b, f, k, lim, fl, dx, dy, d, m, nx, ny, rel, sY, bb;
    w.t += dt;
    // поверхность: каждый столбик — пружина, соседи тянут друг друга, волна гаснет
    for (i = 0; i < WN; i++) {
      vv[i] += (-WAVE_K * hh[i] + WAVE_S * (hh[i > 0 ? i - 1 : i] + hh[i < WN - 1 ? i + 1 : i] - 2 * hh[i]) - WAVE_D * vv[i]) * dt;
    }
    for (i = 0; i < WN; i++) hh[i] = clamp(hh[i] + vv[i] * dt, -0.22, 0.22);
    // добавки: тяжесть, выталкивание, вязкость, стенки и дно
    for (i = 0; i < list.length; i++) {
      b = list[i];
      sY = LIQ + waveAt(w, b.x);
      f = clamp((b.y + b.r - sY) / (2 * b.r), 0, 1);                 // погружённая доля
      b.vy += GRAV * (1 - f / b.dens) * dt;
      k = Math.exp(-(0.4 + 3.4 * f) * dt);
      b.vx *= k; b.vy *= k; b.vr *= k;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;
      if (w.straw && b.y - b.r < w.straw.tip) {                      // трубочка расталкивает добавки
        dx = b.x - w.straw.x; m = w.straw.hw + b.r;
        if (dx < m && dx > -m) { d = dx >= 0 ? 1 : -1; b.x = w.straw.x + d * m; b.vx += d * 0.5; }
      }
      lim = wallAt(b.y) - b.r;
      if (b.x > lim) { b.x = lim; if (b.vx > 0) b.vx = -b.vx * 0.4; }
      else if (b.x < -lim) { b.x = -lim; if (b.vx < 0) b.vx = -b.vx * 0.4; }
      fl = floorAt(b.x) - b.r;
      if (b.y > fl) { b.y = fl; if (b.vy > 0) b.vy = -b.vy * 0.35; b.vx *= 0.97; }
      if (b.y < b.r + 0.08) { b.y = b.r + 0.08; if (b.vy < 0) b.vy = -b.vy * 0.3; }      // сверху плёнка
    }
    // столкновения кругов между собой
    for (i = 0; i < list.length; i++) {
      a = list[i];
      for (j = i + 1; j < list.length; j++) {
        b = list[j];
        dx = b.x - a.x; dy = b.y - a.y; m = a.r + b.r;
        if (dx > m || dx < -m || dy > m || dy < -m) continue;
        d = dx * dx + dy * dy;
        if (d >= m * m) continue;
        d = Math.sqrt(d) || 0.0001;
        nx = dx / d; ny = dy / d; f = (m - d) * 0.5;
        a.x -= nx * f; a.y -= ny * f; b.x += nx * f; b.y += ny * f;
        rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) { rel *= 0.65; a.vx += nx * rel; a.vy += ny * rel; b.vx -= nx * rel; b.vy -= ny * rel; }
      }
    }
    // пузырьки
    for (i = w.bubbles.length - 1; i >= 0; i--) {
      bb = w.bubbles[i];
      bb.y -= bb.v * dt;
      bb.x += Math.sin(w.t * 3 + bb.ph) * 0.06 * dt;
      if (bb.y < LIQ + 0.05) { if (bb.once) w.bubbles.splice(i, 1); else w.bubbles[i] = newBubble(rnd, false); }
    }
  }
  // Удар трубочки: волна от места входа, добавки подпрыгивают и разлетаются, пузырьки
  function splashWorld(w, xs, power, rnd) {
    var hw = wallAt(LIQ), i, b, dx, k;
    for (i = 0; i < WN; i++) {
      dx = -hw + 2 * hw * i / (WN - 1) - xs;
      w.v[i] += power * (1.9 * Math.exp(-dx * dx / 0.04) - 0.7 * Math.exp(-dx * dx / 0.3));
    }
    for (i = 0; i < w.bodies.length; i++) {
      b = w.bodies[i];
      dx = b.x - xs; k = power / (1 + dx * dx * 1.6);
      b.vx += (dx >= 0 ? 1 : -1) * (0.4 + rnd()) * k * 1.3;
      b.vy -= (1.5 + 1.7 * rnd()) * k * (b.dens > 1 ? 1 : 0.45);
      b.vr += (rnd() - 0.5) * 9 * k;
    }
    for (i = 0; i < Q(6); i++) {
      w.bubbles.push({ x: clamp(xs + (rnd() - 0.5) * 0.3, -0.6, 0.6), y: LIQ + 0.3 + rnd() * 1.3, r: 0.015 + 0.02 * rnd(), v: 0.9 + rnd(), ph: rnd() * TAU, once: true });
    }
  }
  // Толчок всего стакана (выезд, удар в край): напиток плещется от стенки к стенке
  function sloshWorld(w, power, rnd) {
    var i;
    for (i = 0; i < WN; i++) w.v[i] += power * 1.5 * (i / (WN - 1) - 0.5);
    for (i = 0; i < w.bodies.length; i++) { w.bodies[i].vx -= power * (0.5 + 0.6 * rnd()); w.bodies[i].vy -= power * 0.5 * rnd(); }
  }

  /* =====================================================================
     8. СЦЕНА: один стакан от выезда до удара. Используется и в игре, и на стартовом экране (стакан играет сам).
     Фазы: enter (выезжает) → aim (ждём удара) → strike (замах и удар) → react (эффекты) → gone (уезжает).
     Частицы и подпрыгивающие добавки — в координатах стакана (от центра ободка), в пикселях.
     ===================================================================== */
  function makeScene(c, drink, rnd, gn) {
    var sc = { c: c, drink: drink, hot: WINTER && drink.hot, rnd: rnd, world: makeWorld(bodiesOf(drink), rnd),
               hit: null, phase: 'enter', t0: gn, aim0: gn + ENTER_MS, parts: [], pops: [], flakes: [],
               shake: 0, fog: 0, glow: 0, from: null, keep: false, steamAt: 0, flakeAt: 0 };
    sloshWorld(sc.world, 1, rnd);

  }
  function addPart(sc, type, x, y, vx, vy, max, size, color, rot, vr) {
    if (sc.parts.length >= MAX_PARTS) return;
    sc.parts.push({ type: type, x: x, y: y, vx: vx, vy: vy, life: 0, max: max, size: size, color: color, rot: rot || 0, vr: vr || 0 });
  }
  // Частицы: 0 — капля напитка, 1 — лоскуток плёнки, 2 — искра, 3 — пар, 4 — снежная пыль
  function tickScene(sc, gn, dt) {
    var g = L.RX / 100, w = sc.world, rnd = sc.rnd, i, p, k, kk, hx, hy, n;
    if (sc.hit && !sc.hit.rim && (sc.phase === 'react' || sc.phase === 'gone')) {
      kk = sc.phase === 'react' ? (gn - sc.t0) / 1000 : 1;
      w.straw = { x: sc.hit.S[0] * FILM, tip: PEN * easeBack(clamp(kk / 0.2, 0, 1)), hw: 0.11 };
    }
    stepWorld(w, dt, rnd);
    for (i = sc.parts.length - 1; i >= 0; i--) {
      p = sc.parts[i];
      p.life += dt;
      if (p.life >= p.max) { sc.parts.splice(i, 1); continue; }
      if (p.type === 0) p.vy += 1500 * g * dt;
      else if (p.type === 1) { k = Math.exp(-2.4 * dt); p.vx *= k; p.vy = p.vy * k + 640 * g * dt; p.rot += p.vr * dt; }
      else if (p.type === 2) { k = Math.exp(-3.4 * dt); p.vx *= k; p.vy = p.vy * k + 300 * g * dt; }
      else if (p.type === 3) { p.vx += (Math.sin(p.rot + p.life * 4) * 26 * g - p.vx) * Math.min(1, dt * 3); p.size += 24 * g * dt; }
      else { k = Math.exp(-3 * dt); p.vx *= k; p.vy = p.vy * k + 110 * g * dt; }
      p.x += p.vx * dt; p.y += p.vy * dt;
    }
    for (i = sc.pops.length - 1; i >= 0; i--) {                     // подпрыгивающая добавка: тяжесть и отскок от плёнки
      p = sc.pops[i];
      p.sq *= Math.exp(-11 * dt);
      if (p.n >= 3) { p.vx *= Math.exp(-5 * dt); p.x += p.vx * dt; continue; }
      p.vy += 2300 * g * dt;
      p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      k = p.x / L.RXf; kk = p.floor / L.RYf;
      if (k * k + kk * kk < 1 && p.y > p.floor && p.vy > 0) {
        p.y = p.floor; p.vy = -p.vy * 0.5; p.vx *= 0.8; p.vr *= 0.6; p.n += 1; p.sq = 1;
        if (p.n >= 3) p.vy = 0;
      }
      if (p.y > L.RX * 5) sc.pops.splice(i, 1);
    }
    sc.shake *= Math.exp(-9 * dt);
    sc.fog *= Math.exp(-3 * dt);
    sc.glow *= Math.exp(-2.2 * dt);
    if (sc.hot && w.straw && gn >= sc.steamAt) {                    // зимой из отверстия в горячем напитке идёт пар
      sc.steamAt = gn + (REDUCED ? 170 : 75);
      hx = sc.hit.S[0] * L.RXf; hy = sc.hit.S[1] * L.RYf;
      addPart(sc, 3, hx + (rnd() - 0.5) * 10 * g, hy - 6 * g, (rnd() - 0.5) * 14 * g, -(50 + 30 * rnd()) * g, 1.1 + 0.7 * rnd(), (10 + 6 * rnd()) * g, '', rnd() * TAU, 0);
    }
    if (WINTER) {                                                   // снежинки ложатся на плёнку и тают
      n = REDUCED ? 5 : 14;
      if (!sc.hit && gn >= sc.flakeAt && sc.flakes.length < n) {
        sc.flakeAt = gn + 150 + 260 * rnd();
        k = rnd() * TAU; kk = Math.sqrt(rnd()) * 0.9;
        sc.flakes.push({ u: Math.cos(k) * kk, v: Math.sin(k) * kk, r: 0.02 + 0.028 * rnd(), age: 0, max: 2.2 + 1.8 * rnd() });
      }
      for (i = sc.flakes.length - 1; i >= 0; i--) {
        p = sc.flakes[i];
        p.age += dt;

      }
    }
  }
  // Удар дошёл до плёнки: рвём плёнку, плещем напиток, запускаем отклики
  function sceneImpact(sc, gn) {
    var h = sc.hit, g = L.RX / 100, rnd = sc.rnd, x = h.S[0] * L.RXf, y = h.S[1] * L.RYf, C = COLS;
    var bull = h.score === CUP_MAX, good = h.score >= NEAR_SCORE, pw, n, i, a, sp, f, col, dir, look = LOOKS[sc.drink.look];
    sc.phase = 'react';
    sc.t0 = gn;
    for (i = 0; i < sc.flakes.length; i++) {                        // снег с плёнки разлетается пылью
      f = sc.flakes[i];
      a = Math.atan2(f.v * L.RYf - y, f.u * L.RXf - x);
      sp = (60 + 120 * rnd()) * g;
      addPart(sc, 4, f.u * L.RXf, f.v * L.RYf, Math.cos(a) * sp, Math.sin(a) * sp - 70 * g, 0.5 + 0.4 * rnd(), (1.6 + 1.6 * rnd()) * g, PAL.snow);
    }
    sc.flakes.length = 0;
    if (h.rim) {                                                    // мимо плёнки: стук о край стакана
      sc.shake = 1; sc.fog = WINTER ? 1 : 0;
      sloshWorld(sc.world, x >= 0 ? 1.2 : -1.2, rnd);
      for (i = 0; i < Q(9); i++) {
        a = -Math.PI * (0.15 + 0.7 * rnd()); sp = (90 + 150 * rnd()) * g;
        addPart(sc, 4, x, y, Math.cos(a) * sp, Math.sin(a) * sp, 0.35 + 0.25 * rnd(), (1.5 + 1.5 * rnd()) * g, PAL.card);
      }
      return;
    }
    pw = bull ? 1.3 : (good ? 1.05 : 0.8);
    splashWorld(sc.world, h.S[0] * FILM, pw, rnd);
    if (h.score === 0) { sc.shake = 0.7; sc.fog = WINTER ? 1 : 0; }
    n = Q(7 + (good ? 3 : 0));                                      // лоскутки плёнки
    for (i = 0; i < n; i++) {
      a = -Math.PI * (0.05 + 0.9 * rnd()); sp = (120 + 220 * rnd()) * g;
      addPart(sc, 1, x, y, Math.cos(a) * sp, Math.sin(a) * sp * 1.1, 0.55 + 0.4 * rnd(), (4 + 4 * rnd()) * g,
              i % 3 === 0 ? PAL.filmHi : (i % 3 === 1 ? PAL.brand : PAL.brandDark), rnd() * TAU, (rnd() - 0.5) * 16);
    }
    n = Q(8 + (good ? 6 : 0) + (bull ? 8 : 0));                     // капли напитка дня
    for (i = 0; i < n; i++) {
      a = -Math.PI * (0.22 + 0.56 * rnd()); sp = (230 + 330 * rnd()) * g * pw;
      col = (C.foam && i % 3 === 0) ? C.foam : (i % 4 === 1 ? C.bot : C.top);
      addPart(sc, 0, x + (rnd() - 0.5) * 8 * g, y, Math.cos(a) * sp * 0.75, Math.sin(a) * sp, 0.7 + 0.5 * rnd(), (2.4 + 3.2 * rnd()) * g, col);
    }
    if (good) {
      sc.glow = bull ? 1 : 0.5;
      n = Q((bull ? 12 : 5) + (WINTER ? (bull ? 12 : 6) : 0));      // искры; зимой — как от бенгальского огня
      for (i = 0; i < n; i++) {
        a = rnd() * TAU; sp = (150 + 260 * rnd()) * g;
        addPart(sc, 2, x, y - 4 * g, Math.cos(a) * sp, Math.sin(a) * sp * 0.8 - 60 * g, 0.3 + 0.35 * rnd(), (2 + 2.4 * rnd()) * g, i % 3 === 0 ? '#FFFFFF' : PAL.sun);
      }
      if (WINTER) {
        for (i = 0; i < Q(8); i++) {
          a = rnd() * TAU; sp = (40 + 90 * rnd()) * g;
          addPart(sc, 4, x, y, Math.cos(a) * sp, Math.sin(a) * sp * TILT - 50 * g, 0.5 + 0.4 * rnd(), (1.4 + 1.8 * rnd()) * g, PAL.snow);
        }
      }
    }
    if (bull) {                                                     // добавка напитка выпрыгивает и скачет по плёнке
      dir = x >= 0 ? -1 : 1;
      sc.pops.push({ kind: look.pop, x: x + dir * L.RX * 0.14, y: y - L.RX * 0.1, vx: dir * (50 + 60 * rnd()) * g, vy: -(600 + 90 * rnd()) * g,
                     r: L.RX * 0.125, floor: y - L.RX * 0.07, n: 0, sq: 0, rot: 0, vr: (rnd() - 0.5) * 10 });
    }
  }

  /* =====================================================================
     9. РИСОВАНИЕ. Два холста: сцена игры и стакан на стартовом экране. Тяжёлое (фон, стекло с бликами,
     печать, добавки, свечение) готовится заранее на отдельных холстах при раскладке, в кадре — только drawImage.
     ===================================================================== */
  var VIEW_GAME = { kind: 'game', cv: el.cv, ctx: el.cv.getContext('2d'), box: el.stage, fit: 0.40, L: null };
  var VIEW_HERO = { kind: 'hero', cv: el.hero, ctx: el.hero.getContext('2d'), box: el.heroWrap, fit: 0.47, L: null };
  var ctx = VIEW_GAME.ctx, L = null;               // текущий холст и его раскладка
  var BG_PAD = 14;                                 // запас фона под параллакс, px
  var PETAL = mix(PAL.filmHi, '#FFFFFF', 0.25), RIM_SHADE = mix(PAL.card, PAL.brandDark, 0.3);
  var GLOW_COLS = [PAL.sun, mix(PAL.accent, '#FFFFFF', 0.35), PAL.filmHi, PAL.warmHi];
  var XS = [], FY = [], BY = [];

  function use(view) { ctx = view.ctx; L = view.L; }
  function layer(w, h) {                           // отдельный холст для заготовки
    var cv = document.createElement('canvas'), g;
    cv.width = Math.max(1, Math.ceil(w * L.dpr)); cv.height = Math.max(1, Math.ceil(h * L.dpr));
    g = cv.getContext('2d'); g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    return { cv: cv, g: g, w: w, h: h };
  }
  function paintOn(lay, fn) { var keep = ctx; ctx = lay.g; fn(); ctx = keep; }
  function circle(x, y, r, fill) { ctx.beginPath(); ctx.arc(x, y, r, 0, TAU); ctx.fillStyle = fill; ctx.fill(); }
  function rrect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }
  function halfW(d) { return L.RX * (0.985 - (0.985 - BOT) * d / L.BH); }       // полуширина стакана на глубине d, px
  function bodyPath(cx, cy) {
    ctx.beginPath();
    ctx.moveTo(cx - L.RX * 0.985, cy);
    ctx.lineTo(cx - L.RX * BOT, cy + L.BH);
    ctx.ellipse(cx, cy + L.BH, L.RX * BOT, L.RYb, 0, Math.PI, 0, true);          // дно: нижняя дуга
    ctx.lineTo(cx + L.RX * 0.985, cy);
    ctx.closePath();
  }
  // Полоса вдоль стенки: a, b — доли полуширины, d0, d1 — глубина в долях высоты
  function wallQuad(cx, cy, a, b, d0, d1) {
    var h0 = halfW(d0 * L.BH), h1 = halfW(d1 * L.BH);
    ctx.beginPath();
    ctx.moveTo(cx + a * h0, cy + d0 * L.BH); ctx.lineTo(cx + b * h0, cy + d0 * L.BH);
    ctx.lineTo(cx + b * h1, cy + d1 * L.BH); ctx.lineTo(cx + a * h1, cy + d1 * L.BH);
    ctx.closePath(); ctx.fill();
  }
  // Пояс вокруг стакана между глубинами d0 и d1 (px): края — передние дуги
  function cuffPath(cx, cy, d0, d1, grow) {
    var h0 = halfW(d0) + grow, h1 = halfW(d1) + grow;
    ctx.beginPath();
    ctx.moveTo(cx - h0, cy + d0);
    ctx.ellipse(cx, cy + d0, h0, h0 * TILT, 0, Math.PI, 0, true);
    ctx.lineTo(cx + h1, cy + d1);
    ctx.ellipse(cx, cy + d1, h1, h1 * TILT, 0, 0, Math.PI, false);
    ctx.closePath();
  }
  // Надпись по дуге стенки на глубине d (px)
  function curveText(str, cx, cy, d, fs, fill, stroke) {
    var hw = halfW(d), wd = [], tot = 0, pass, i, x, q;
    ctx.font = '900 ' + fs.toFixed(1) + 'px ' + FONT;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    for (i = 0; i < str.length; i++) { wd.push(ctx.measureText(str.charAt(i)).width); tot += wd[i]; }
    for (pass = 0; pass < 2; pass++) {                              // сначала вся обводка, потом вся заливка
      x = -tot / 2;
      for (i = 0; i < str.length; i++) {
        q = clamp((x + wd[i] / 2) / hw, -0.94, 0.94);
        ctx.save();
        ctx.translate(cx + x + wd[i] / 2, cy + d + hw * TILT * Math.sqrt(1 - q * q));
        ctx.rotate(Math.atan(-TILT * q / Math.sqrt(1 - q * q)));
        if (pass === 0) { ctx.lineWidth = Math.max(2.5, fs * 0.24); ctx.strokeStyle = stroke; ctx.strokeText(str.charAt(i), 0, 0); }
        else { ctx.fillStyle = fill; ctx.fillText(str.charAt(i), 0, 0); }
        ctx.restore();
        x += wd[i];
      }
    }
  }

  /* ---------- раскладка и заготовки ---------- */
  function layoutView(view) {
    var w = Math.max(40, view.box.clientWidth), h = Math.max(80, view.box.clientHeight), d = Math.min(2, window.devicePixelRatio || 1);
    var RX = Math.min(w * view.fit, h / SCENE_H), top = (h - RX * SCENE_H) / 2;
    view.cv.width = Math.round(w * d);
    view.cv.height = Math.round(h * d);

      if (sc.from) { sx = lerp(L.cx + sc.from[0], sx, e); tipY = lerp(L.cy + sc.from[1], tipY, e); }   // прошлая отскочила — она же едет к новому месту

    } else show = false;
    drawBody(sc, cx, cy, pierced ? { x: lx, top: ly, ent: cy + LIQ * RX + S[1] * L.RYf, tip: tipY, lean: -lean * 0.12 } : null);
    drawFilm(sc, cx, cy, T, r, gn, press, pierced ? (mode === 'react' ? clamp(kk / 0.18, 0, 1) : 1) : -1, mode === 'react' ? kk : 9);

  // Частицы и подпрыгивающая добавка
  function drawFx(sc, cx, cy) {
    var g = L.RX / 100, i, p, a, st, e, x, y, f;
    ctx.lineCap = 'round';
    for (i = 0; i < sc.parts.length; i++) {
      p = sc.parts[i]; x = cx + p.x; y = cy + p.y;
      if (p.type === 3) {                                           // пар
        ctx.globalAlpha = 0.72 * Math.sin(Math.PI * Math.min(1, p.life / p.max));
        e = p.size; ctx.drawImage(L.puff.cv, x - e, y - e, e * 2, e * 2);
        continue;
      }
      a = clamp((1 - p.life / p.max) * 1.7, 0, 1);
      ctx.globalAlpha = a;
      if (p.type === 0) {                                           // капля вытянута по скорости
        st = Math.min(1.1, hypot(p.vx, p.vy) / (650 * g));
        ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.ellipse(x, y, p.size * (1 + st), p.size * (1 - st * 0.22), Math.atan2(p.vy, p.vx), 0, TAU); ctx.fill();
        ctx.globalAlpha = a * 0.5; ctx.fillStyle = '#FFFFFF';

      } else if (p.type === 1) {                                    // лоскуток плёнки кувыркается
        e = p.size; f = 0.35 + 0.65 * Math.abs(Math.cos(p.rot * 0.9));

        ctx.beginPath();
        ctx.moveTo(x + Math.cos(p.rot) * e, y + Math.sin(p.rot) * e * f);
        ctx.lineTo(x + Math.cos(p.rot + 2.3) * e * 0.85, y + Math.sin(p.rot + 2.3) * e * 0.85 * f);
        ctx.lineTo(x + Math.cos(p.rot + 4.2) * e * 0.95, y + Math.sin(p.rot + 4.2) * e * 0.95 * f);
        ctx.closePath(); ctx.fill();
      } else if (p.type === 2) {                                    // искра — штрих по ходу полёта
        ctx.strokeStyle = p.color; ctx.lineWidth = Math.max(1, p.size * 0.55);
        ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.vx * 0.04, y - p.vy * 0.04); ctx.stroke();
      } else { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(x, y, p.size, 0, TAU); ctx.fill(); }
    }

    for (i = 0; i < sc.pops.length; i++) {
      p = sc.pops[i]; e = p.sq * 0.3;

        ctx.beginPath(); ctx.ellipse(cx + p.x, cy + p.floor + p.r * 0.7, p.r * 0.8, p.r * 0.8 * TILT, 0, 0, TAU);
        ctx.fillStyle = rgba(PAL.ink, 0.2); ctx.fill();

    }
  }
  // Фон сцены игры: заготовка с параллаксом; зимой — мерцание гирлянды и дальний снег
  function drawBackdrop(gn, boost) {

    ctx.drawImage(L.bg.cv, -BG_PAD + ox, -BG_PAD + oy, L.bg.w, L.bg.h);

      s = L.glowR * (1 + boost * 0.5);

  // Зимой перед стаканом: сугроб (растёт за попытку) и ближний снег

  /* =====================================================================
     10. ИГРА: состояние и ход

  var G = null;                    // текущая попытка

  function startGame() {
    PREVIEW = false;

    if (store.ok && day.used >= ATTEMPTS_PER_DAY) { showLimit(day); return; }
    day.used += 1;                 // попытка списывается на старте: перезагрузка её не вернёт
    saveDay(day);
    try { WDX.attempt(); } catch (e) { /* сервер игр не критичен */ }
    memAttempts += 1;
    attemptNo = store.ok ? day.used : memAttempts;
    touchStreak();
    HERO = null;
    COLS = lookCols(LOOKS[NOW.drink.look]);
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
    el.pop.className = 'pop';
    el.combo.className = 'combo';
    show('game');

    gn = gnow();
    G = { cups: makeAttempt(NOW.dateInt, attemptNo, NOW.drink.stars), drink: NOW.drink, dow: NOW.dow,
          i: 0, scores: [], total: 0, shown: 0, shownText: -1, combo: 0, sc: null, prev: null, out: false,
          fx: mulberry32(seedFor(NOW.dateInt, attemptNo) ^ 0x5F356495) };             // генератор для брызг (только рисование)
    G.sc = makeScene(G.cups[0], G.drink, G.fx, gn);
    el.hCup.textContent = '1/' + CUPS;

  }
  function userStrike() {
    if (!G || cur !== 'game' || G.sc.phase !== 'aim' || hiddenAt !== null) return;
    strike(gnow(), false);
  }
  function strike(gn, auto) {
    var sc = G.sc, t = clamp((gn - sc.aim0) / 1000, 0, T_LIMIT);
    sc.hit = judge(sc.c, t);                                       // печать и трубочка замирают в момент нажатия
    sc.hit.auto = auto;
    sc.phase = 'strike';
    sc.t0 = gn;
  }
  function verdict(h) {
    if (h.rim) return 'Мимо! В край стакана';
    if (h.auto && h.score < NEAR_SCORE) return 'Время вышло';
    if (h.score === CUP_MAX) return 'В точку!';
    if (h.score >= NEAR_SCORE) return 'Почти!';
    if (h.score >= 10) return 'Неплохо';
    if (h.score >= 1) return 'По краю';

  }
  function impact(gn) {
    var h = G.sc.hit;

    sceneImpact(G.sc, gn);
    el.popScore.textContent = h.score > 0 ? '+' + h.score : '0';   // всплывающая подпись
    el.popText.textContent = verdict(h);
    el.pop.className = 'pop';
    void el.pop.offsetWidth;                                        // перезапуск анимации
    el.pop.className = 'pop on' + (h.score === CUP_MAX ? ' bull' : (h.score === 0 ? ' bad' : ''));
    clearTimeout(popTimer);
    popTimer = setTimeout(function () { el.pop.classList.remove('on'); }, 800);
    el.combo.textContent = 'серия ×' + G.combo;
    el.combo.classList.toggle('on', G.combo >= 2);
    if (h.score > 0) { el.hTotal.classList.remove('bump'); void el.hTotal.offsetWidth; el.hTotal.classList.add('bump'); }
    if (h.score >= NEAR_SCORE) {               // вибрация — только на удачных ударах
      try { WDX.buzz(h.score === CUP_MAX ? [18, 40, 28] : 16); } catch (e) { /* нет доступа */ }
    }
  }
  function nextCup(gn) {

      G.i += 1;
      G.sc = makeScene(G.cups[G.i], G.drink, G.fx, gn);
      if (prev.hit.rim) G.sc.from = [prev.hit.S[0] * L.RXf, prev.hit.S[1] * L.RYf - L.RX * 0.62];
      el.hCup.textContent = (G.i + 1) + '/' + CUPS;

  }
  function finish() {
    var g = G, day;

    if (g.total > day.top) day.top = g.total;
    saveDay(day);
    addToCollection(g.dow, g.total);
    try { WDX.finish(g.total); } catch (e) { /* сервер игр не критичен */ }   // до билета: при 300 сервер проверяет дневной потолок главного приза
    showResult(g, day);
  }
  function update(gn, dt) {
    var sc = G.sc, e = gn - sc.t0, left, s;
    if (G.out) { if (e >= OUT_MS) { finish(); return; } }
    else if (sc.phase === 'enter') { if (e >= ENTER_MS) { sc.phase = 'aim'; G.prev = null; } }
    else if (sc.phase === 'aim') { if ((gn - sc.aim0) / 1000 >= T_LIMIT) strike(gn, true); }
    else if (sc.phase === 'strike') { if (e >= STRIKE_MS) impact(gn); }
    else if (sc.phase === 'react') { if (e >= REACT_MS) nextCup(gn); }
    sc = G.sc;
    tickScene(sc, gn, dt);                                          // физика и частицы — по дельте времени: одинаково на 60 и 120 Гц
    if (G.prev) tickScene(G.prev, gn, dt);
    if (WINTER) tickSnow(L.snow, L.w, L.h, dt, gn);
    if (G.shown < G.total) G.shown = REDUCED ? G.total : Math.min(G.total, G.shown + Math.max(40 * dt, (G.total - G.shown) * dt * 9));   // счёт «набегает»

  }

  /* ---------- стартовый экран: стакан дня играет сам ---------- */
  function heroStart() {
    var rnd = mulberry32(seedFor(NOW.dateInt, 0) ^ 0x2B8F8E), gn = gnow();      // попытки с номером 0 не бывает: раскладку игры не выдаём
    COLS = lookCols(LOOKS[NOW.drink.look]);
    layoutView(VIEW_HERO);
    HERO = { rnd: rnd, i: 0, sc: null, prev: null, drink: NOW.drink };
    HERO.sc = makeScene(makeCup(rnd, NOW.drink.stars, 0), NOW.drink, rnd, gn);
    HERO.sc.phase = 'aim';
    HERO.sc.aim0 = gn;
    startLoop();
  }
  function heroTick(gn, dt) {
    var sc = HERO.sc, e = gn - sc.t0, c = sc.c, t;
    if (sc.phase === 'enter') { if (e >= ENTER_MS) { sc.phase = 'aim'; HERO.prev = null; } }
    else if (sc.phase === 'aim') {
      t = (gn - sc.aim0) / 1000;
      if (t >= c.tStar + (HERO.i % 3 === 2 ? c.bullMs * 0.0017 : 0)) {          // два раза в точку, на третий — рядом
        sc.hit = judge(c, Math.min(t, T_LIMIT)); sc.phase = 'strike'; sc.t0 = gn;
      }
    }
    else if (sc.phase === 'strike') { if (e >= STRIKE_MS) sceneImpact(sc, gn); }
    else if (sc.phase === 'react' && e >= REACT_MS + 1100) {
      sc.phase = 'gone'; sc.t0 = gn;
      HERO.prev = sc;
      HERO.i += 1;
      HERO.sc = makeScene(makeCup(HERO.rnd, HERO.drink.stars, HERO.i % CUPS), HERO.drink, HERO.rnd, gn);
      if (sc.hit.rim) HERO.sc.from = [sc.hit.S[0] * L.RXf, sc.hit.S[1] * L.RYf - L.RX * 0.62];
    }
    tickScene(HERO.sc, gn, dt);
    if (HERO.prev) tickScene(HERO.prev, gn, dt);
  }
  function heroDraw(gn) {
    var sc = HERO.sc, slide = L.w * 1.4, ke;
    ctx.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
    ctx.clearRect(0, 0, L.w, L.h);
    if (WINTER) {                                                   // зимой стакан стоит в снегу
      ctx.beginPath(); ctx.ellipse(L.cx, L.cy + L.BH + L.RYb * 0.8, L.RX * 1.25, L.RX * 0.3, 0, 0, TAU);
      ctx.fillStyle = PAL.snow; ctx.fill();
    }

    } else drawScene(sc, 0, gn);
  }

  /* ---------- общий слой поверх экранов: снег вне игры, салют при призе ---------- */
  var FX = { ctx: el.fx.getContext('2d'), w: 0, h: 0, dpr: 1, snow: [], bits: [], dirty: false };
  function fxLayout() {
    FX.w = el.app.clientWidth; FX.h = el.app.clientHeight; FX.dpr = Math.min(2, window.devicePixelRatio || 1);
    el.fx.width = Math.round(FX.w * FX.dpr);
    el.fx.height = Math.round(FX.h * FX.dpr);
    FX.snow = WINTER ? makeSnow(FX.w, FX.h, REDUCED ? 10 : 42) : [];
  }
  // Приз: конфетти в фирменных цветах; зимой ещё салют из снежинок и гирлянда ярче
  function celebrate(big) {
    var cols = [PAL.brand, PAL.filmHi, PAL.accent, PAL.sun, PAL.bg], n = Q(big ? 70 : 46), m = Q(12), i, b, a, sp;
    for (i = 0; i < n; i++) {
      a = -Math.PI * (0.12 + 0.76 * VRND()); sp = 260 + 420 * VRND();
      FX.bits.push({ type: 0, x: FX.w / 2 + (VRND() - 0.5) * 60, y: FX.h * 0.32, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: VRND() * TAU,
                     vr: (VRND() - 0.5) * 14, size: 4 + 4 * VRND(), color: cols[i % cols.length], life: 0, max: 1.8 + 1.4 * VRND(), wait: (i % 3) * 0.12 });
    }
    if (!WINTER) return;
    for (b = 0; b < 3; b++) {
      for (i = 0; i < m; i++) {
        a = i / m * TAU; sp = 150 + 70 * VRND();
        FX.bits.push({ type: 1, x: FX.w * (0.25 + 0.25 * b), y: FX.h * (0.2 + 0.07 * (b % 2)), vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, rot: VRND() * TAU,
                       vr: (VRND() - 0.5) * 6, size: 4 + 3 * VRND(), color: PAL.snow, life: 0, max: 1.3 + 0.5 * VRND(), wait: 0.25 + b * 0.3 });
      }
    }

  }
  function fxTick(dt, t) {
    var c = FX.ctx, snowing = WINTER && cur !== 'game', i, j, b, k, s;
    if (!FX.w) return false;
    if (!snowing && !FX.bits.length) {
      if (FX.dirty) { c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, el.fx.width, el.fx.height); FX.dirty = false; }
      return false;
    }
    c.setTransform(FX.dpr, 0, 0, FX.dpr, 0, 0);
    c.clearRect(0, 0, FX.w, FX.h);
    FX.dirty = true;
    if (snowing) { tickSnow(FX.snow, FX.w, FX.h, dt, t); drawSnow(c, FX.snow, 0, 2, REDUCED ? 0 : par.x * 4); }
    c.lineCap = 'round';
    for (i = FX.bits.length - 1; i >= 0; i--) {
      b = FX.bits[i];
      if (b.wait > 0) { b.wait -= dt; continue; }
      b.life += dt;
      if (b.life >= b.max || b.y > FX.h + 20) { FX.bits.splice(i, 1); continue; }
      k = Math.exp(-(b.type ? 2.2 : 1.5) * dt);
      b.vx *= k; b.vy = b.vy * k + (b.type ? 90 : 640) * dt;
      b.x += b.vx * dt; b.y += b.vy * dt; b.rot += b.vr * dt;

        }

        c.fillStyle = b.color;
        c.save(); c.translate(b.x, b.y); c.rotate(b.rot);
        c.fillRect(-b.size, -b.size * 0.5 * Math.abs(Math.cos(b.rot * 1.3)) - 0.5, b.size * 2, b.size * Math.abs(Math.cos(b.rot * 1.3)) + 1);
        c.restore();
      }
    }
    c.globalAlpha = 1;
    return true;
  }

  /* ---------- цикл ---------- */
  function relayout() {
    fxLayout();
    if (cur === 'game' && G) layoutView(VIEW_GAME);
    else if (cur === 'start' && HERO) layoutView(VIEW_HERO);
  }
  function startLoop() { if (!raf) { lastFrame = pnow(); raf = requestAnimationFrame(frame); } }
  function frame() {
    var now = pnow(), dt = Math.min(0.05, Math.max(0, (now - lastFrame) / 1000)), gn, busy = false;
    raf = 0;
    lastFrame = now;
    if (hiddenAt !== null) return;                        // вкладка скрыта — цикл стоит, startLoop() вернёт его по visibilitychange
    gn = now - pausedTotal;
    if (needLayout) { needLayout = false; relayout(); }
    par.x += (par.tx - par.x) * Math.min(1, dt * 5);
    par.y += (par.ty - par.y) * Math.min(1, dt * 5);
    if (cur === 'game' && G) { use(VIEW_GAME); update(gn, dt); if (G) drawGame(gn); busy = true; }
    else if (cur === 'start' && HERO) { use(VIEW_HERO); heroTick(gn, dt); heroDraw(gn); busy = true; }
    if (fxTick(dt, gn)) busy = true;
    if (busy) raf = requestAnimationFrame(frame);
  }

  /* =====================================================================
     11. ВВОД: pointer-события и клавиатура
     ===================================================================== */
  function onDown(e) {
    if (cur !== 'game') return;
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (e.cancelable) e.preventDefault();
    userStrike();
  }
  function swallow(e) { if (cur === 'game' && e.cancelable) e.preventDefault(); }
  if (window.PointerEvent) {
    el.game.addEventListener('pointerdown', onDown);
    el.game.addEventListener('pointermove', swallow);
    el.game.addEventListener('pointerup', swallow);
    el.game.addEventListener('pointercancel', swallow);
  } else {                                                                     // старые встроенные браузеры
    el.game.addEventListener('touchstart', function (e) { if (e.cancelable) e.preventDefault(); userStrike(); }, { passive: false });
    el.game.addEventListener('mousedown', function (e) { if (e.button === 0) userStrike(); });
  }
  el.game.addEventListener('touchmove', swallow, { passive: false });
  document.addEventListener('gesturestart', function (e) { if (e.cancelable) e.preventDefault(); });
  el.app.addEventListener('contextmenu', function (e) { e.preventDefault(); });

  // Параллакс фона: движение пальца или мыши, наклон телефона
  function setPar(x, y) {
    if (REDUCED) return;
    par.tx = clamp(x, -1, 1); par.ty = clamp(y, -1, 1);
    if (cur !== 'game') { el.app.style.setProperty('--px', par.tx.toFixed(2)); el.app.style.setProperty('--py', par.ty.toFixed(2)); }
  }
  el.app.addEventListener('pointermove', function (e) {
    var r = el.app.getBoundingClientRect();
    if (r.width > 0 && r.height > 0) setPar((e.clientX - r.left) / r.width * 2 - 1, (e.clientY - r.top) / r.height * 2 - 1);
  });
  window.addEventListener('deviceorientation', function (e) {
    if (typeof e.gamma === 'number' && typeof e.beta === 'number') setPar(e.gamma / 25, (e.beta - 45) / 25);
  });

  function isSpace(e) { return e.code === 'Space' || e.key === ' ' || e.key === 'Spacebar' || e.keyCode === 32; }
  function isEnter(e) { return e.key === 'Enter' || e.keyCode === 13; }
  window.addEventListener('keydown', function (e) {
    if (!isSpace(e) && !isEnter(e)) return;
    if (cur === 'game') {
      e.preventDefault();
      if (!e.repeat) userStrike();
      return;
    }
    if (e.repeat) return;
    if (document.activeElement && document.activeElement.tagName === 'BUTTON') return;   // кнопка в фокусе сработает сама
    e.preventDefault();
    if (cur === 'start') startGame();
    else if (cur === 'result') onAgain();
  });
  window.addEventListener('keyup', function (e) { if (cur === 'game' && isSpace(e)) e.preventDefault(); });

  function onAgain() { if (againMode === 'limit') { refreshDay(); showLimit(loadDay()); } else startGame(); }
  el.btnPlay.addEventListener('click', startGame);
  el.btnAgain.addEventListener('click', onAgain);

  // Вкладка скрыта — игровое время стоит: полоска времени не тает, печать не уезжает
  document.addEventListener('visibilitychange', function () {
    var now = pnow();
    if (document.hidden) { if (hiddenAt === null) hiddenAt = now; }
    else if (hiddenAt !== null) { pausedTotal += now - hiddenAt; hiddenAt = null; lastFrame = now; startLoop(); }
  });

  function askLayout() { needLayout = true; startLoop(); }
  if (typeof ResizeObserver === 'function') { var ro = new ResizeObserver(askLayout); ro.observe(el.app); ro.observe(el.stage); }
  window.addEventListener('resize', askLayout);
  window.addEventListener('orientationchange', function () { setTimeout(askLayout, 120); });

  /* =====================================================================
     12. ЗАПУСК
     ===================================================================== */
  try { WDX.init({ base: '../' }); WDX.theme(WINTER); } catch (e) { /* общий слой не критичен */ }

  el.hint.textContent = (window.matchMedia && window.matchMedia('(pointer: coarse)').matches)
    ? 'Тапни, когда красная точка под трубочкой'
    : 'Клик или пробел, когда красная точка под трубочкой';

  var didReset = false;
  try {
    if (/[?&]reset=1(&|$)/.test(String(window.location.search || ''))) { store.del(GAME_KEY); didReset = true; }
  } catch (e) { didReset = false; }

  fxLayout();
  var pvScore = null;
  try { pvScore = WDX.previewScore(); } catch (e) { pvScore = null; }
  if (pvScore !== null) {
    // Просмотр экрана результата: ничего не сохраняет, попытку не тратит, слово дня — «ПРИМЕР»
    PREVIEW = true;
    (function () {
      var left = pvScore, sc = [], k, v;
      for (k = 0; k < CUPS; k++) { v = Math.min(CUP_MAX, left); sc.push(v); left -= v; }
      showResult({ total: pvScore, scores: sc }, { used: 0, best: 0 });
    })();
    toast('Просмотр экрана: ничего не сохраняется');
  } else {
    showStart();
    if (didReset) toast('Счётчик попыток сброшен');
  }
})();
</script>
</body>
</html>
