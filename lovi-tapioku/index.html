<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  «Лови тапиоку» — прототип мини-игры WeDrink (Новосибирск). Стандарт: ../SPEC.md (v2 + дополнения v3 и v4).
  Один файл: HTML + CSS + JS, без внешних библиотек, шрифтов, картинок и запросов в сеть.
  Палитра бренда — в :root (источник: аудит бренда и исходники постеров; брендбука нет).
  Цвета напитков и ингредиентов — рабочие, подобраны под игру; меняются там же, canvas читает их из :root.
  Проверка:
    ?reset=1          — обнуляет счётчик попыток за сегодня;
    ?season=winter | ?season=default — зимний или обычный вид (без параметра — по дате: 15.11–28.02 зима);
    ?preview=300 | 295 | 240 — экран результата без игры (слово дня всегда «ПРИМЕР», метка «просмотр»; ничего не сохраняет).
-->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#156F6E">
<meta name="description" content="Води стакан и лови шарики тапиоки и ингредиенты. Мини-игра WeDrink, Новосибирск.">
<link rel="icon" type="image/webp" href="../assets/icon-96.webp">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WeDrink">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="WeDrink — Лови тапиоку">
<meta property="og:description" content="Води стакан и лови шарики тапиоки и ингредиенты. Мини-игра WeDrink, Новосибирск.">
<meta property="og:url" content="https://holopi1.github.io/wedrink-games/lovi-tapioku/">
<meta property="og:image" content="https://holopi1.github.io/wedrink-games/assets/mascot-512.webp">
<meta property="og:image:type" content="image/webp">

<meta property="og:image:height" content="512">

<title>Лови тапиоку — WeDrink</title>
<style>
:root{
  /* --- бренд WeDrink --- */
  --brand:#1B8F8E; --brand-dark:#156F6E; --accent:#DC223C; --bg:#FBF7EC; --ink:#1F2A2A;
  /* --- служебные --- */
  --card:#FFFDF6; --muted:#4A5A5A; --soft:#DDEDEA; --soft-2:#CFE9E6; --line:#E8DFC4; --sun:#FFD45C; --glass:#FFFFFF;
  --brand-light:#5FD0C8; --warm:#FFD98A;
  /* --- напитки и ингредиенты (по составу из меню) --- */
  --milk:#FFF6E4; --milk-tea:#E3C29A; --milk-tea-dark:#C79A68; --black-tea:#6E4126; --cheese-foam:#FFE9A6; --cheese-foam-dark:#F1CB6A;
  --tapioca:#3B2519; --tapioca-hi:#8A5E40;
  --jasmine-tea:#EAD98C; --grape:#7B4FA3; --grape-tea:#A982C6; --lemon:#FBE77E; --lemon-rind:#EFC02F;
  --strawberry:#E8455A; --strawberry-tea:#F6B3B8; --peach:#FFB27A; --peach-dark:#F08A4B;
  --cookie:#2E2422; --cookie-cream:#F6EFE2; --cookie-tea:#CDB69C;
  --choco:#6B3F2A; --choco-tea:#A9795A; --coconut:#F8F5EE; --coconut-edge:#CFE3DF;
  --bean:#7C2A2E; --bean-hi:#B5524A;
  /* --- зима --- */
  --night-1:#0E4750; --night-2:#113D5A; --night-3:#172F5C; --snow:#F4FAFF; --snow-shade:#C9DCEE;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--brand-dark);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
body.winter{background:#0A2C3A}
#app{
  /* тема экрана: зимой эти переменные переопределяются ниже, палитра в :root не меняется */
  --t-ink:var(--ink); --t-muted:var(--muted); --t-strong:var(--brand-dark); --t-wm:var(--brand);
  --t-pill:var(--card); --t-pill-line:var(--line); --t-star:var(--accent); --t-track:var(--soft-2); --t-bar:var(--brand);
  position:fixed;top:0;right:0;bottom:0;left:0;margin:auto;
  width:100%;max-width:460px;height:100%;max-height:920px;
  color:var(--t-ink);
  background:
    radial-gradient(120% 60% at 12% 0%,rgba(95,208,200,.20),rgba(95,208,200,0) 60%),
    radial-gradient(90% 50% at 100% 100%,rgba(255,212,92,.16),rgba(255,212,92,0) 65%),
    var(--bg);
  display:flex;flex-direction:column;overflow:hidden;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app.winter{
  --t-ink:#F3FAF8; --t-muted:#C9DEDD; --t-strong:#8FE6DE; --t-wm:#FFFFFF;
  --t-pill:rgba(255,255,255,.10); --t-pill-line:rgba(255,255,255,.24); --t-star:#FF7A8C; --t-track:rgba(255,255,255,.16); --t-bar:#4FC9C0;
  background:
    radial-gradient(110% 46% at 50% 0%,rgba(255,217,138,.13),rgba(255,217,138,0) 70%),
    linear-gradient(180deg,var(--night-1) 0%,var(--night-2) 55%,var(--night-3) 100%);
}
@media (min-width:520px) and (min-height:640px){
  #app{height:calc(100% - 40px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
}
/* слой эффектов поверх экранов: снег, гирлянда, конфетти. Нажатия не перехватывает */
#fx{position:absolute;top:0;left:0;width:100%;height:100%;z-index:4;pointer-events:none;display:block}
#app.playing #fx{display:none}

/* шапка бренда — на каждом экране */
.brand{position:relative;z-index:2;flex:none;display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 16px 2px}
#app.winter .brand{padding-top:30px}
.wm{font:900 40px/1 var(--font);letter-spacing:-.02em;color:var(--t-wm);display:inline-flex;align-items:center;gap:6px}
.wm svg{display:none;width:.42em;height:.42em;stroke:var(--brand-light);stroke-width:2.4;stroke-linecap:round;fill:none}
#app.winter .wm svg{display:block}
#app.winter .wm{text-shadow:0 2px 14px rgba(0,0,0,.28)}
.city{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--t-muted);margin-top:4px}
.tag{display:none;font-size:12.5px;font-weight:800;letter-spacing:.04em;color:var(--t-strong);margin-top:6px}
#app.at-start .tag{display:block}
#app.winter .tag{color:var(--warm)}
.hud-score{background:var(--brand-dark);color:#fff;border-radius:16px;padding:5px 16px 6px;text-align:center;min-width:96px;transition:background .15s,transform .15s}
#app.winter .hud-score{background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.24)}
.hud-score i{display:block;font-style:normal;font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.hud-score b{display:block;font-size:28px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums}
.hud-score.bump{animation:bump .26s cubic-bezier(.2,1.6,.4,1)}
.hud-score.hit,#app.winter .hud-score.hit{background:var(--accent)}
@keyframes bump{from{transform:scale(1.16)}to{transform:scale(1)}}
#app.playing .brand{justify-content:space-between;text-align:left;padding:8px 14px 0}
#app.winter.playing .brand{padding-top:8px}
#app.playing .wm{font-size:28px}
#app.playing .city{font-size:9px;margin-top:2px}

.screen{position:relative;z-index:1;display:none;flex:1;min-height:0;flex-direction:column}
.screen.is-on{display:flex;animation:scr-in .34s cubic-bezier(.2,.8,.2,1) both}
.screen.is-out{animation:scr-out .16s ease-in both}
#s-game.is-on{animation-name:scr-fade}
@keyframes scr-in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes scr-fade{from{opacity:0}to{opacity:1}}
@keyframes scr-out{to{opacity:0;transform:translateY(-8px)}}
.screen.scroll{overflow-y:auto;overflow-x:hidden;touch-action:pan-y}
.inner{margin:auto 0;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:8px 20px 16px}

.btn{
  -webkit-appearance:none;appearance:none;border:0;border-radius:999px;cursor:pointer;position:relative;overflow:hidden;
  background:linear-gradient(180deg,#EC3550,var(--accent));color:#fff;font:800 20px/1 var(--font);letter-spacing:.01em;
  padding:17px 30px;min-width:220px;box-shadow:0 6px 0 rgba(31,42,42,.18),0 12px 24px rgba(220,34,60,.22);
  touch-action:manipulation;transition:transform .08s,box-shadow .08s;
}
.btn::after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:40%;background:linear-gradient(100deg,rgba(255,255,255,0),rgba(255,255,255,.35),rgba(255,255,255,0));animation:shine 3.4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:130%}}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(31,42,42,.18)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#app.winter .btn{box-shadow:0 6px 0 rgba(0,0,0,.28),0 12px 26px rgba(0,0,0,.25)}

/* старт */
.hero-row{display:flex;align-items:flex-end;justify-content:center;gap:10px}
.hero{display:block;width:150px;height:24vh;max-height:200px;min-height:104px}
#app.winter .hero-row{background:radial-gradient(closest-side,rgba(255,217,138,.20),rgba(255,217,138,0))}
.title{font-size:32px;line-height:1.02;font-weight:900;letter-spacing:-.015em}
.day{font-size:15px;line-height:1.35;font-weight:700;max-width:340px}
.day b{color:var(--t-strong)}
.stars{color:var(--t-star);white-space:nowrap}
.catch{font-size:12.5px;line-height:1.35;font-weight:700;color:var(--t-muted);max-width:330px}
.catch b{color:var(--t-ink);font-weight:800}
.stats{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;font-size:13px;font-weight:800}
.stats span{background:var(--t-pill);border:2px solid var(--t-pill-line);border-radius:999px;padding:5px 12px;white-space:nowrap}
.coll{display:flex;gap:7px;justify-content:center}
.cc{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:var(--t-muted)}
.cc svg{width:22px;height:28px;display:block}
.cc path{fill:transparent;stroke:var(--t-bar);stroke-width:1.6;stroke-linejoin:round;opacity:.6}
.cc rect{fill:var(--t-bar);opacity:.5}
.cc.on path,.cc.on rect{opacity:1}
.cc.today{color:var(--t-star)}
.rule{font-size:14px;line-height:1.35;color:var(--t-muted);max-width:330px}
.meta{font-size:13px;line-height:1.4;color:var(--t-muted)}
.proto{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t-strong);opacity:.85}
@media (max-height:600px){
  .hero{height:19vh;min-height:92px}.title{font-size:26px}.inner{gap:7px}.btn{padding:14px 26px}.wm{font-size:34px}.brand{padding-top:8px}
  #app.winter .brand{padding-top:24px}.rule{font-size:13px}.tag{margin-top:4px}
}

/* игра */
#s-game{touch-action:none}
.timer{flex:none;height:10px;margin:8px 14px;border-radius:999px;background:var(--t-track);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--t-bar);border-radius:999px;transform-origin:left center;will-change:transform}
.timer.hot i{background:var(--accent)}
#app.winter .timer.hot i{background:#FF5A6E}
.stage{
  position:relative;flex:1;min-height:0;margin:0 12px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,var(--soft),var(--soft-2));touch-action:none;cursor:ew-resize;
  box-shadow:inset 0 0 0 1.5px rgba(21,111,110,.10);
}
#app.winter .stage{background:linear-gradient(180deg,#0C3B46,#173763);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.10)}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.caption{
  position:absolute;left:50%;top:22%;z-index:2;pointer-events:none;text-align:center;width:max-content;max-width:86%;
  background:var(--card);border-radius:18px;padding:10px 20px 11px;box-shadow:0 8px 22px rgba(31,42,42,.2);
  font-size:22px;font-weight:900;line-height:1.15;color:var(--brand-dark);
  opacity:0;transform:translate(-50%,-10px) scale(.86);transition:opacity .18s,transform .28s cubic-bezier(.2,1.5,.4,1);
}
.caption.on{opacity:1;transform:translate(-50%,0) scale(1)}
.hint{flex:none;height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:800;color:var(--t-strong);touch-action:none}

/* результат и лимит */
.res-title{font-size:26px;line-height:1.12;font-weight:900;max-width:340px;letter-spacing:-.01em}
.prize .res-title{color:var(--t-strong);font-size:31px}
#app.winter .prize .res-title{color:var(--warm)}
.res-sub{font-size:16px;font-weight:800;color:var(--t-ink);margin-top:-4px}
.res-sub:empty{display:none}
.score{display:flex;align-items:baseline;justify-content:center;gap:8px}
.score b{font-size:76px;line-height:.95;font-weight:900;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score span{font-size:18px;font-weight:700;color:var(--t-muted)}
.rows{display:flex;gap:6px;width:100%;max-width:340px}
.rows div{flex:1;min-width:0;background:var(--t-pill);border:2px solid var(--t-pill-line);border-radius:14px;padding:6px 2px}
.rows span{display:block;font-size:10.5px;font-weight:700;color:var(--t-muted);white-space:nowrap}
.rows b{display:block;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.ticket{
  position:relative;width:100%;max-width:340px;background:var(--card);color:var(--ink);
  border:3px dashed var(--brand);border-radius:22px;padding:22px 16px 13px;margin-top:8px;
  animation:ticket-in .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes ticket-in{from{opacity:0;transform:scale(.9) rotate(-2deg)}to{opacity:1;transform:none}}
.ticket-tag{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;
}
.ticket-gift{font-size:17px;line-height:1.2;font-weight:900;color:var(--brand-dark);margin-bottom:6px}
.ticket-how{font-size:14.5px;line-height:1.25;font-weight:700;color:var(--muted)}
.ticket-word{
  font-size:32px;line-height:1.1;font-weight:900;letter-spacing:.04em;color:var(--accent);margin:7px 0 6px;
  overflow-wrap:anywhere;
}
.ticket-rule{font-size:12.5px;font-weight:700;color:var(--muted)}
.ticket-stamp{margin-top:9px;padding-top:8px;border-top:2px dashed var(--line);font-size:18px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand-dark)}
/* зимой билет — новогодняя открытка: тёплый свет и ленточка */
#app.winter .ticket{
  border:0;background:radial-gradient(120% 90% at 50% 0%,#FFFFFF 0%,#FFF6DF 55%,#FFE9BD 100%);
  box-shadow:0 0 0 2px rgba(255,217,138,.55),0 10px 40px rgba(255,190,90,.35),0 2px 0 rgba(0,0,0,.2);overflow:hidden;
}
.ribbon{display:none}
#app.winter .ribbon{display:block;position:absolute;top:0;right:22px;width:22px;height:44px;background:linear-gradient(90deg,#B91830,var(--accent) 45%,#F0566C);box-shadow:0 2px 4px rgba(0,0,0,.18)}
#app.winter .ribbon::after{content:"";position:absolute;left:0;bottom:-11px;border-left:11px solid var(--accent);border-right:11px solid #F0566C;border-bottom:11px solid transparent}
#app.winter .ticket-tag{top:9px;left:14px;transform:none;background:rgba(21,111,110,.12);color:var(--brand-dark)}
#app.winter .ticket{padding-top:34px}
#app.winter .ticket-how,#app.winter .ticket-gift{padding:0 34px}
.note{font-size:15px;line-height:1.35;color:var(--t-muted);max-width:330px}
.note:empty{display:none}
.note.strong{color:var(--t-ink);font-weight:800}
.limit-title{font-size:28px;line-height:1.15;font-weight:900;max-width:320px}
.limit-record{font-size:18px;font-weight:800;color:var(--t-strong)}
@media (max-height:640px){
  .res-title{font-size:22px}.prize .res-title{font-size:25px}.res-sub{font-size:14px}.score b{font-size:56px}
  .ticket{padding:18px 14px 10px;margin-top:6px}#app.winter .ticket{padding-top:30px}
  .ticket-word{font-size:27px;margin:4px 0}.ticket-stamp{margin-top:6px;padding-top:6px;font-size:16px}.ticket-how{font-size:13.5px}
  .note{font-size:14px}.limit-title{font-size:24px}
}
.toast{
  position:absolute;left:50%;bottom:12px;transform:translateX(-50%);z-index:5;pointer-events:none;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.on{opacity:.92}
@media (prefers-reduced-motion:reduce){
  .screen.is-on,.screen.is-out,.ticket,.hud-score.bump{animation:none}
  .btn::after{display:none}
  .caption{transition:opacity .18s}

.wd-mascot{display:block;flex:none;width:clamp(72px,18vh,136px);height:clamp(72px,18vh,136px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;
  animation:wd-sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(31,42,42,.18));
  pointer-events:none;-webkit-user-select:none;user-select:none}
/* у билета маскот выглядывает над его правым верхним краем и не занимает места в потоке (кнопки не уезжают) */
.wd-prize-m{display:none;position:relative;height:0;width:100%;flex:none;pointer-events:none;z-index:2}
.wd-prize-m::before{content:"";position:absolute;right:0;bottom:-12px;width:clamp(68px,10vh,88px);height:clamp(68px,10vh,88px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;animation:wd-sway 3.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 6px rgba(31,42,42,.22))}
.screen:has(.ticket:not([hidden])) .wd-prize-m{display:block}
@keyframes wd-sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
#app.winter .wd-mascot,#app[data-season="winter"] .wd-mascot{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#app.winter .wd-prize-m::before,#app[data-season="winter"] .wd-prize-m::before{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@media (max-height:640px){.wd-mascot{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.wd-mascot,.wd-prize-m::before{animation:none}}

/* ===== v6: общий слой — кнопка «Все игры», настройки, быстрая кнопка звука, касания, безопасные зоны ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}
a,button{-webkit-touch-callout:none}
.wdx-ibtn{
  position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);
  display:none;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:#156F6E;box-shadow:0 2px 10px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(27,143,142,.35);
  font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .1s;
}
.wdx-ibtn svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wdx-ibtn:active{transform:scale(.92)}
.wdx-ibtn:focus-visible,.wdx-row:focus-visible,.wdx-done:focus-visible,.wdx-next:focus-visible,.wdx-back:focus-visible{outline:3px solid #DC223C;outline-offset:2px}
.wdx-gear{display:flex}
.wdx-snd{top:calc(env(safe-area-inset-top,0px) + 4px);width:42px;height:42px}
.wdx-snd svg{width:22px;height:22px}
#app .wdx-gear{display:none}
#app:has(#s-start.is-on) .wdx-gear,#app:has(#s-result.is-on) .wdx-gear,#app:has(#s-limit.is-on) .wdx-gear{display:flex}
#app:has(#s-game.is-on) .wdx-snd{display:flex}
@supports not selector(:has(*)){#app .wdx-gear{display:flex}}
body > .wdx-ibtn{position:absolute}

.wdx-back{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;min-height:50px;margin:4px auto 0;padding:12px 18px;
  border-radius:16px;background:#fff;color:#156F6E;box-shadow:inset 0 0 0 2.5px #1B8F8E,0 3px 0 rgba(21,111,110,.35);
  font:800 17px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-decoration:none;text-align:center;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,box-shadow .08s;
}
.wdx-back:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px #1B8F8E,0 1px 0 rgba(21,111,110,.35)}
.wdx-back::before{content:"";width:9px;height:9px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);margin-right:2px;flex:none}

.wdx-set{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,32,36,.62);animation:wdx-in .18s ease both}
.wdx-set.wdx-fixed{position:fixed}
.wdx-set[hidden]{display:none !important}
.wdx-card{width:100%;max-width:340px;max-height:100%;overflow:auto;padding:20px 18px 18px;border-radius:24px;background:#FFFDF6;color:#1F2A2A;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:wdx-pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.wdx-card h2{margin:0 0 6px;font:900 24px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;color:#156F6E}
.wdx-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;margin:0;padding:8px 2px;border:0;border-bottom:1px solid #E8DFC4;border-radius:0;background:none;
  color:#1F2A2A;font:800 18px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;
}
.wdx-sw{position:relative;flex:none;width:54px;height:32px;border-radius:16px;background:#B9C6C5;transition:background .15s}
.wdx-sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.wdx-row[aria-checked="true"] .wdx-sw{background:#1B8F8E}
.wdx-row[aria-checked="true"] .wdx-sw::after{transform:translateX(22px)}
.wdx-done{display:block;width:100%;min-height:52px;margin:16px 0 0;padding:12px;border:0;border-radius:16px;background:#DC223C;color:#fff;box-shadow:0 4px 0 #A5192C;
  font:900 18px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-done:active{transform:translateY(2px);box-shadow:0 2px 0 #A5192C}
.wdx-now{margin:12px 2px 0;font:700 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#4E5F5E;overflow-wrap:anywhere}
.wdx-next{display:block;width:100%;min-height:48px;margin:10px 0 0;padding:10px;border:2px solid #1B8F8E;border-radius:14px;background:none;color:#156F6E;font:800 16px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-next:active{transform:translateY(1px)}
.wdx-next:disabled{opacity:.4;cursor:default}
.wdx-now[hidden],.wdx-next[hidden]{display:none}
@keyframes wdx-in{from{opacity:0}to{opacity:1}}
@keyframes wdx-pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wdx-set,.wdx-card{animation:none}.wdx-ibtn,.wdx-back,.wdx-sw,.wdx-sw::after{transition:none}}
/* v6: стартовый экран помещается в 320×568 вместе с кнопкой «Все игры» */
@media (max-height:620px){
  #s-start>.inner>*{flex-shrink:0}
  #s-start .inner{gap:5px;padding:4px 16px 8px}
  .hero{height:13vh;min-height:70px;width:110px}
  .wd-mascot{width:60px;height:60px}
  .title{font-size:24px}
  .day{font-size:13.5px;line-height:1.25}
  .catch{font-size:11.5px;line-height:1.25}
  .stats{font-size:12px;gap:6px;flex-wrap:nowrap}.stats span{padding:3px 9px;border-width:1.5px}
  .coll{gap:5px}.cc{font-size:9px}.cc svg{width:18px;height:22px}
  .rule{font-size:12px;line-height:1.25}
  .btn{padding:15px 26px;font-size:19px}
  .wdx-back{min-height:48px;padding:8px 18px;margin-top:0}
  .meta{font-size:12px;line-height:1.25}
}
/* v6: быстрая кнопка звука в игре — правый нижний угол (строка подсказки), чтобы не закрывать счёт */
.wdx-snd{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 1px);width:38px;height:38px}

/* v7: строки приза на билете, одинаковые во всех играх */
.ticket{flex:none}
.ticket-prize{font-size:21px;line-height:1.12;font-weight:900;color:var(--brand-dark);margin:0 0 7px}
.ticket-lab{font-size:12px;line-height:1.2;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticket-valid{margin-top:8px;font-size:12.5px;line-height:1.28;font-weight:800;color:var(--ink)}
.ticket-cond{margin-top:6px;font-size:11.5px;line-height:1.3;font-weight:600;color:var(--muted)}
@media (max-height:640px){.ticket-prize{font-size:19px;margin-bottom:3px}.ticket-valid{margin-top:5px;font-size:12px}.ticket-cond{margin-top:4px;font-size:11px;line-height:1.25}}
#app.winter .ticket-prize{padding:0 34px}
</style>
</head>
<body>
<div id="app">

  <!-- Шапка бренда: общая для всех экранов. В игре справа появляется счёт; зимой рядом со знаком — снежинка -->
  <header class="brand">
    <div class="brand-id">
      <div class="wm">WeDrink<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2v20M3.3 7l17.4 10M20.7 7L3.3 17M12 6l-2.6-2.4M12 6l2.6-2.4M12 18l-2.6 2.4M12 18l2.6 2.4"/></svg></div>
      <div class="city">Новосибирск</div>
      <div class="tag">Бабл-ти из Китая</div>
    </div>
    <div class="hud-score" id="hud-score" hidden><i>Счёт</i><b id="hud-num">0</b></div>
  </header>

  <!-- Экран 1: старт -->
  <section class="screen scroll is-on" id="s-start"><div class="inner">
    <div class="hero-row">
      <!-- MASCOT_SLOT -->
      <div class="wd-mascot"></div>
      <canvas class="hero" id="hero" aria-hidden="true"></canvas>
    </div>
    <h1 class="title">Лови тапиоку</h1>
    <p class="day">Напиток дня: <b id="day-name"></b> · сложность&nbsp;<span class="stars" id="day-stars"></span></p>
    <p class="catch" id="day-catch"></p>
    <div class="stats"><span id="st-streak"></span><span id="st-coll"></span></div>
    <div class="coll" id="coll" aria-hidden="true"></div>
    <p class="rule">Води стакан, лови тапиоку и&nbsp;ингредиенты. Пару шариков лови серединой. Дедлайны и&nbsp;будильники&nbsp;— мимо.</p>
    <button class="btn" id="btn-play" type="button">Играть</button>
    <a class="wdx-back" href="../index.html">Все игры</a>
    <div class="meta" id="start-attempts"></div>
    <div class="proto" id="proto-start">прототип</div>
  </div></section>

  <!-- Экран 2: игра -->
  <section class="screen" id="s-game">
    <div class="timer" id="timer"><i id="timer-bar"></i></div>
    <div class="stage" id="stage">
      <canvas id="cv"></canvas>
      <div class="caption" id="caption"></div>
    </div>
    <div class="hint" id="hint"></div>
  </section>

  <!-- Экран 3: результат -->
  <section class="screen scroll" id="s-result"><div class="inner">
    <h2 class="res-title" id="res-title"></h2>
    <p class="res-sub" id="res-sub"></p>
    <div class="score"><b id="res-score">0</b><span id="res-max"></span></div>
    <!-- Билет приза: слово дня берётся из WORDS_TOPPING / WORDS_DRINK; цен, сумм и условий здесь нет -->
    <div class="wd-prize-m" aria-hidden="true"></div>
    <div class="ticket" id="ticket" hidden></div>
    <div class="rows" id="res-rows"></div>
    <p class="note" id="res-note"></p>
    <button class="btn" id="btn-again" type="button">Ещё раз</button>
    <a class="wdx-back" href="../index.html">Все игры</a>
    <p class="note" id="res-left"></p>
  </div></section>

  <!-- Экран 4: попытки на сегодня кончились -->
  <section class="screen scroll" id="s-limit"><div class="inner">
    <h2 class="limit-title">На сегодня всё. Завтра новый напиток</h2>
    <p class="limit-record" id="limit-record"></p>
    <div class="ticket" id="limit-ticket" hidden></div>
    <p class="note" id="limit-next"></p>
    <a class="wdx-back" href="../index.html">Все игры</a>
  </div></section>

  <canvas id="fx" aria-hidden="true"></canvas>
  <div class="toast" id="toast"></div>
</div>

<script>
/* ============================================================================
   WDX (v9) — общий слой всех игр и зала WeDrink: настройки, музыка, Telegram Mini App, MAX, VK Mini Apps, слова дня,
   прямой вход в игру по ссылке, счётчики для штаба, суточный потолок главного приза.
   Один источник: _build/kit/wdx.js; в зал и игры раскладывает _build/sync_wdx.py (блок одинаков во всех файлах).
   Профиль wedrink.profile.v1: пишем только поля music и sfx (по умолчанию включено), остальное не трогаем.
   Музыка: плейлист assets/music/playlist.json, треки идут по кругу; текущий тянется лениво, только после первого касания.
   Сеть: скрипты клиентов (Telegram, MAX, VK Bridge) только внутри своего клиента; config/prize.json (тексты приза);
   на боевом адресе — сервер игр /api/ (события без личных данных и проверка главного приза). Сервер недоступен — игра идёт как раньше.
   ============================================================================ */
(function () {
  'use strict';
  var PROFILE_KEY = 'wedrink.profile.v1';
  var MUSIC_DIR = 'assets/music/';           // playlist.json и треки
  var MUSIC_GAP = 400;                       // пауза, если перехода нет, мс
  var MUSIC_XF = 1.5;                        // плавный переход между треками, с
  var MUSIC_XF_SKIP = 0.6;                   // то же по кнопке «Следующий трек»
  var MUSIC_VOL = 0.35;                      // громкость фоновой музыки
  var TG_SRC = 'https://telegram.org/js/telegram-web-app.js';
  var TG_FLAG = 'wedrink.tg';
  var MAX_SRC = 'https://st.max.ru/js/max-web-app.js';                  // dev.max.ru/docs/webapps/bridge, «Подключение библиотеки»

  /* =====================================================================
     ДЕТЕРМИНИРОВАННЫЙ ГЕНЕРАТОР. Встроенный генератор случайных чисел в логике не используется:

  // Сначала расставляются «места» (одно место — один предмет или пара шариков), в конце пары разворачиваются в два шарика.
  function tryBuild(seed, lv) {

    var tau = [], slots = [], goods = [], singles = [], items = [], i, j, lo, hi, idx, it;

    // 1) Времена: плотность потока растёт линейно и к концу в (1 + ramp) раз выше, чем в начале
    for (i = 0; i < n; i++) {

      var jit = (rnd() - 0.5) * 0.5 * (next - prev) / 2;        // небольшой сбой ритма, порядок не меняет
      slots.push({
        kind: 'pearl', sub: 0, pts: PTS_PEARL, x: 0.5, pair: false,
        arrive: FIRST_ARRIVAL + clamp(tau[i] + jit, 0, 1) * (LAST_ARRIVAL - FIRST_ARRIVAL)
      });
    }
    slots.sort(function (p, q) { return p.arrive - q.arrive; });

    // 2) Плохие: по одному в каждой «полосе» потока; первые два и последний предмет — всегда хорошие
    var span = n - 3;
    for (j = 0; j < lv.bad; j++) {
      lo = 2 + Math.floor(j * span / lv.bad);
      hi = 2 + Math.floor((j + 1) * span / lv.bad) - 1;
      if (hi < lo) hi = lo;
      idx = lo + Math.floor(rnd() * (hi - lo + 1));
      slots[idx].kind = 'bad';
      slots[idx].pts = 0;
      slots[idx].sub = Math.floor(rnd() * BAD_LABELS.length) % BAD_LABELS.length;
    }

    // 3) Ингредиенты: равномерно среди хороших, два вида по очереди

    var g = goods.length, flip = rnd() < 0.5 ? 0 : 1;
    for (j = 0; j < lv.ingr; j++) {

      hi = Math.floor((j + 1) * g / lv.ingr) - 1;
      if (hi < lo) hi = lo;
      idx = lo + Math.floor(rnd() * (hi - lo + 1));
      goods[idx].kind = 'ingr';
      goods[idx].pts = PTS_INGR;
      goods[idx].sub = (j + flip) % 2;
    }

    // 3а) Пары: равномерно среди оставшихся шариков; первый предмет раунда — всегда одиночный.
    //     Перед парой ставится хороший предмет: если там неприятность, пара меняется с ней местами.
    //     Затем пара подтягивается по времени к этому предмету: до неё pairLead секунд (±10%).
    for (i = 1; i < n; i++) if (slots[i].kind === 'pearl') singles.push(i);

    for (j = 0; j < nPair && j < s; j++) {

      hi = Math.floor((j + 1) * s / nPair) - 1;
      if (hi < lo) hi = lo;
      idx = singles[lo + Math.floor(rnd() * (hi - lo + 1))];
      while (idx >= 2 && idx < n - 1 && slots[idx - 1].kind === 'bad') {
        sw = slots[idx - 1].sub;
        slots[idx - 1].kind = 'pearl'; slots[idx - 1].pts = PTS_PEARL; slots[idx - 1].sub = 0;
        slots[idx].kind = 'bad'; slots[idx].pts = 0; slots[idx].sub = sw;
        idx--;

      it.pair = true;
      lead = lv.pairLead * (0.9 + 0.2 * rnd());
      gapNext = idx < n - 1 ? slots[idx + 1].arrive - 0.25 : LAST_ARRIVAL;
      it.arrive = Math.max(slots[idx - 1].arrive + 0.2, Math.min(it.arrive, slots[idx - 1].arrive + lead, gapNext));
    }

        hi = Math.min(1, px + d);

        for (q = 0; q < n; q++) {
          if (q === i) continue;

          if (o.kind === 'bad') {
            // два плохих рядом по времени не накладываются друг на друга
            if (q < i && dtq < 0.3) m = Math.min(m, dxq + (lv.safeDx - 0.22));
          } else if (dtq < lv.safeDt) {

        }
        if (m > bestD) { bestD = m; best = cand; }

    // 6) Разворачиваем пары и считаем скорость падения: к концу раунда предметы летят быстрее
    function add(sl, x, pairNo) {
      var fall = lerp(lv.fallStart, lv.fallEnd, sl.arrive / ROUND_SEC);

  // Проходимость: существует ли путь стакана, который ловит все хорошие и не задевает ни одного плохого.
  // Множество допустимых положений стакана — набор отрезков; между событиями оно расширяется со скоростью GEN_REACH.
  // Пара — два шарика с одним временем прилёта: допустимое место под ней сужается само (пересечение двух окон).
  function feasible(items, lv) {

      out = [];

        hi = it.x + GEN_AWAY;
        for (j = 0; j < set.length; j++) {

          if (hi <= a || lo >= b) { out.push([a, b]); continue; }

  // Расписание раунда: пересобираем с соседним сидом, пока идеальный проход не станет возможен.

    var items = null, a;

      if (feasible(items, lv)) { items.tries = a + 1; return items; }
    }
    items.tries = -1;          // не встречалось на проверке; игра всё равно пойдёт с последним вариантом

  }

  /* =====================================================================

      nPearl: 0, nIngr: 0, nBad: 0,              // сколько всего в раунде

  // ИТОГ на шкале 0–300: (очки пойманных хороших − 15 за каждый пойманный плохой) / очки всех хороших × 300.

  // Попадание считается в точный момент прилёта: положение стакана берётся между кадрами,

  var hero = { c: el.hero.getContext('2d'), cup: new Cup(), W: 0, H: 0, dpr: 1, left: 0, t: 0 };

    hero.left = REDUCED ? 0 : 16; hero.t = 0.25;

  /* =====================================================================

  var game = null;
  var gameCup = new Cup();
  var parts = [], pops = [], debris = [], rings = [];
  var snow = makeSnow(SNOW_GAME);

  var hudTimer = 0, starting = false;
  var SHUDDER_SEC = 0.38;                           // стакан вздрагивает после неприятности

  var POP = WINTER

  function startRound() {

    starting = true;
    day.used += 1;                                  // попытка списывается в момент старта
    saveDay(day);

    touchStreak(now);
    applyDrink(now.getDay());
    game = {
      r: newRound(seedFor(dateIntOf(today), day.used), drink.level),

    show('game', function () {

  // Шаг логики до момента now. Вызывается из кадра и из каждого события указателя:
  // положение стакана учитывается в момент движения пальца, а не раз в кадр.
  function advance(now) {
    var g = game, dt;
    if (!g || g.state !== 'play') return;
    dt = (now - g.lastLogic) / 1000;
    if (dt <= 0) return;
    g.lastLogic = now;
    if (dt > 0.05) dt = 0.05;                       // после паузы или подвисания время не «проскакивает»
    stepRound(g.r, dt, g.cup, g.ev);
  }

  function bumpHud(bad) {

    }
  }
  function pop(x, y, text, color, k) {

    if (pops.length > 14) pops.shift();
  }

    if (REDUCED) n = Math.ceil(n / 3);
    for (i = 0; i < n; i++) {

    }

  function sparks(x, y, n) {                         // зима: искры как от бенгальского огня и снежная пыль

    if (REDUCED) n = Math.ceil(n / 3);
    for (i = 0; i < n; i++) {
      a = -Math.PI / 2 + fr(-1.5, 1.5); sp = fr(120, 330) * G.s;
      addPart({ kind: 1, x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 520 * G.s, life: fr(0.22, 0.48), max: 0.48, r: 1.6, col: cols[i % 3] });
    }
    for (i = 0; i < Math.ceil(n / 2); i++) {
      addPart({ kind: 2, x: x + fr(-1, 1) * G.m * 0.3, y: y, vx: fr(-60, 60) * G.s, vy: fr(-90, -20) * G.s, g: 130 * G.s, life: fr(0.5, 0.9), max: 0.9, r: fr(1.2, 2.6), col: '#FFFFFF' });
    }
  }
  function ring(x, y, color) { rings.push({ x: x, y: y, life: 0.3, max: 0.3, col: color }); if (rings.length > 6) rings.shift(); }
  function toDebris(sp, x, y, vx, vy, scale, r) {

    if (debris.length > 14) debris.shift();
  }
  function splashCb(x, y, p) {                       // тело вошло в жидкость: брызги, если поверхность близко к горлу

    droplets(G.cx0 + g.cup * G.lane + x * G.m, G.mouthY + Math.max(0, y - 0.1) * G.m, Math.round(1 + p * 4), 0.45 + p * 0.3, css[g.drink.a]);
  }

  function onEvent(g, e) {
    var it = e.it, U = G.m, x = G.cx0 + it.x * G.lane, cupX = G.cx0 + g.cup * G.lane, y = G.mouthY;
    var lx = clamp(e.dx * G.lane / U, -0.44, 0.44), cupV = g.vel * G.lane / U, v, kind, b, i, out, side, sp, yNow, rim, items, mate;
    if (e.type === 'good') {
      v = clamp(fallV(it, it.arrive) / U, 2.5, 9);   // скорость входа в стакан
      if (it.kind === 'pearl') {
        gameCup.add('pearl', lx, -cupV * 0.35, v);
      } else {
        kind = g.drink.ingr[it.sub]; b = INGR_BODY[kind];
        if (b) { for (i = 0; i < b[1]; i++) gameCup.add(b[0], lx + (i - (b[1] - 1) / 2) * 0.12, -cupV * 0.35 + fr(-0.5, 0.5), v); }
        else { gameCup.foam = Math.min(0.2, gameCup.foam + 0.024); gameCup.poke(lx, 0.5); }      // сырная пенка ложится шапкой

      ring(cupX + lx * U, y, WINTER ? css.warm : css.brandLight);
      if (WINTER) sparks(cupX + lx * U, y, it.kind === 'ingr' ? 7 : 4);
      else droplets(cupX + lx * U, y, it.kind === 'ingr' ? 4 : 2, 0.5, css[g.drink.a]);
      if (it.pair && !g.pairsDone[it.pair]) {        // оба шарика пары в стакане
        items = g.r.items;
        mate = (items[it.id - 1] && items[it.id - 1].pair === it.pair) ? items[it.id - 1] : items[it.id + 1];
        if (mate && mate.pair === it.pair && mate.state === 'caught') {
          g.pairsDone[it.pair] = true;
          pop(G.cx0 + it.cx * G.lane, y - U * 0.78, 'Дуплет!', POP.duo, 1.12);
          if (WINTER) sparks(cupX, y, 8); else droplets(cupX, y, 5, 0.7, css.sun);
          gameCup.sqV += 1.2;

  function finishRound() {

  function groundY() { return WINTER ? G.bottom + G.m * 0.03 : G.bottom; }

    var g = game, r = g.r, i, p, s, v, acc, k, fl;
    if (!G) { layout(); if (!G) return false; }

    }
    if (g.shake > 0) g.shake = Math.max(0, g.shake - dt);
    if (g.shudder > 0) g.shudder = Math.max(0, g.shudder - dt);
    if (g.flash > 0) g.flash = Math.max(0, g.flash - dt * 3.2);
    for (i = parts.length - 1; i >= 0; i--) {

      if (p.life <= 0) parts.splice(i, 1);
    }
    for (i = pops.length - 1; i >= 0; i--) {
      p = pops[i];
      p.y -= 48 * dt; p.life -= dt;
      if (p.life <= 0) pops.splice(i, 1);

  } else {
    showStart();
    if (wasReset) toast('Счётчик попыток сброшен');
  }
  lastFrame = nowMs();
  window.requestAnimationFrame(tick);
})();
</script>
</body>
</html>
