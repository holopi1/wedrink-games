<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<!--
  «Собери заказ» — прототип мини-игры WeDrink (Новосибирск). Стандарт: ../SPEC.md (v2 + дополнения v3 и v4).
  Один файл: HTML + CSS + JS, без внешних библиотек, шрифтов, картинок и запросов в сеть.
  Механика: память и скорость. Чек выезжает на пару секунд, потом по памяти собираешь стакан по порядку.
  Палитра бренда — в :root (источник: аудит бренда и исходники постеров; брендбука нет).
  Цвета напитков и ингредиентов — там же, canvas читает их из :root.
  Составы — по меню (wedrink-tools/cards/menu_data.py), добавки гостя — только платные топпинги меню.
  Проверка:
    ?reset=1        — обнуляет попытки за сегодня;
    ?debug_day=0..6 — другой день недели (0 — воскресенье; профиль при этом не пишется); работает,
                      только пока константа DEBUG_PARAMS = true, при false параметр не читается;
    ?season=winter | ?season=default — зимний или обычный вид (по умолчанию — по дате, константа SEASON).
-->
<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#156F6E">
<meta name="description" content="Запомни чек и собери стакан по порядку. Мини-игра WeDrink, Новосибирск.">
<link rel="icon" type="image/webp" href="../assets/icon-96.webp">
<link rel="apple-touch-icon" href="../assets/icon-180.png">
<meta property="og:type" content="website">
<meta property="og:site_name" content="WeDrink">
<meta property="og:locale" content="ru_RU">
<meta property="og:title" content="WeDrink — Собери заказ">
<meta property="og:description" content="Запомни чек и собери стакан по порядку. Мини-игра WeDrink, Новосибирск.">
<meta property="og:url" content="https://holopi1.github.io/wedrink-games/soberi-zakaz/">
<meta property="og:image" content="https://holopi1.github.io/wedrink-games/assets/mascot-512.webp">
<meta property="og:image:type" content="image/webp">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary">
<title>WeDrink — Собери заказ</title>
<style>
:root{
  /* --- бренд WeDrink --- */
  --brand:#1B8F8E; --brand-dark:#156F6E; --accent:#DC223C; --bg:#FBF7EC; --ink:#1F2A2A;
  /* --- служебные оттенки интерфейса --- */
  --card:#FFFDF6; --muted:#4A5A5A; --soft:#DDEDEA; --soft-2:#CFE9E6; --line:#E8DFC4; --sun:#FFD45C;
  --miss:#FBD3D9; --glass:#FFFFFF; --mud:#8C7F6A; --brand-deep:#0E5554; --wood-top:#FFF4DC; --wood-bot:#EAD7AE;
  /* --- зима (включается только при SEASON = 'winter') --- */
  --night-1:#0C3B42; --night-2:#123763; --warm:#FFD98A; --warm-2:#F3B25E; --snow:#F4FAFF; --knit:#F6EBD5;
  /* --- напитки и ингредиенты (правдоподобные, подобраны под игру) --- */
  --tea-top:#D98A3A;   --tea-bot:#B8621F;    /* чёрный чай */
  --jas-top:#EEE39A;   --jas-bot:#D2C464;    /* жасминовый чай */
  --milk-top:#FFF6E4;  --milk-bot:#EFDDBE;   /* молочная основа */
  --coco-top:#FFFFFF;  --coco-bot:#ECE7DA;   /* кокосовое молоко */
  --coco-shell:#7A5234;
  --choco-top:#7A4A2E; --choco-bot:#54301E;  /* шоколад */
  --straw-top:#F58AA0; --straw-bot:#E8556A;  /* клубничный вкус */
  --peach-top:#FFC08A; --peach-bot:#F59A52;  /* персиковый вкус */
  --grape-top:#9A6CC4; --grape-bot:#6B4396;  /* виноградный джем */
  --foam-top:#FFF6CF;  --foam-bot:#FFE08A;   /* сырная пенка */
  --pearl:#3B2519;     --pearl-hi:#7A5138;   /* жемчужная тапиока */
  --jelly:#F7F3E3;     --jelly-line:#CFC7A8; /* кокосовое желе */
  --pjelly:#FFB877;    --pjelly-line:#EE8A4B;/* персиковое желе */
  --bean:#8A2F33;      --bean-hi:#B85056;    /* красная фасоль */
  --cookie:#2E2624;    --cream:#F6EFE2;      /* печенье Oreo */
  --lemon:#FFD84D;     --lemon-in:#FFF4B8;   /* лимон */
  --ice:#CFEAF2;       --ice-line:#93C9D9;   /* лёд */
  --leaf:#4E9A52;
  /* --- цвет текста прямо на фоне экрана (зимой фон тёмный) --- */
  --fg:var(--ink); --fg-muted:var(--muted); --fg-brand:var(--brand); --app-bg:var(--bg);
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none !important}
html,body{height:100%}
body{
  font-family:var(--font);color:var(--ink);background:var(--brand-dark);
  overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;text-size-adjust:100%;
}
#app{
  position:fixed;top:0;right:0;bottom:0;left:0;margin:auto;
  width:100%;max-width:460px;height:100%;max-height:920px;
  background:var(--app-bg);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#app[data-season="winter"]{--fg:#FFFFFF;--fg-muted:#D6EAEC;--fg-brand:#FFFFFF;--app-bg:var(--night-1)}
@media (min-width:520px) and (min-height:640px){
  #app{height:calc(100% - 40px);border-radius:28px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
}
#bg,#fx{position:absolute;top:0;left:0;width:100%;height:100%;display:block;pointer-events:none}
#bg{z-index:0}
#fx{z-index:8}
.screen{
  position:absolute;z-index:1;display:none;flex-direction:column;
  top:0;right:0;bottom:0;left:0;
  top:env(safe-area-inset-top,0px);right:env(safe-area-inset-right,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);
}
.screen.is-on{display:flex;animation:scr-in .36s cubic-bezier(.2,.9,.3,1) both}
.screen.is-off{display:flex;pointer-events:none;animation:scr-out .2s ease-in both}
@keyframes scr-in{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
@keyframes scr-out{from{opacity:1}to{opacity:0;transform:translateY(-12px) scale(.985)}}

/* шапка бренда — на каждом экране */
.brand{flex:none;text-align:center}
.brand-word{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:40px;line-height:1;letter-spacing:-.03em;color:var(--fg-brand)}
.brand-city{font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--fg-muted);margin-top:3px}
.brand.sm{text-align:left}
.brand.sm .brand-word{font-size:27px;gap:4px}
.brand.sm .brand-city{font-size:8.5px;margin-top:1px}
.flake{display:none;width:.42em;height:.42em;flex:none}
.flake path{fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}
#app[data-season="winter"] .flake{display:block;animation:flake-spin 9s linear infinite}
#app[data-season="winter"] .brand-word{text-shadow:0 2px 10px rgba(0,0,0,.35)}
@keyframes flake-spin{to{transform:rotate(360deg)}}
.tagline{flex:none;font-size:13px;font-weight:800;letter-spacing:.04em;color:var(--fg-brand);margin-top:-2px}
#app[data-season="winter"] .tagline{color:var(--warm)}

/* кнопки */
.btn{
  -webkit-appearance:none;appearance:none;border:0;border-radius:999px;cursor:pointer;flex:none;
  background:linear-gradient(180deg,#EC3550,var(--accent));color:#fff;font:800 20px/1 var(--font);letter-spacing:.01em;
  padding:17px 30px;min-width:220px;box-shadow:0 6px 0 #9E1428,0 12px 22px rgba(220,34,60,.3),inset 0 1px 0 rgba(255,255,255,.35);
  touch-action:manipulation;transition:transform .08s,box-shadow .08s;
}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #9E1428,0 4px 10px rgba(220,34,60,.3),inset 0 1px 0 rgba(255,255,255,.35)}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.proto{display:none;flex:none;font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-brand);opacity:.8}
#app.is-proto .proto{display:block}

/* старт */
#s-start{align-items:center;justify-content:space-between;text-align:center;padding:14px 20px 12px;gap:6px;overflow-y:auto;touch-action:pan-y}
.hero-wrap{position:relative;flex:1 1 auto;width:100%;min-height:104px;max-height:250px}
#hero{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.title{flex:none;font-size:32px;line-height:1.05;font-weight:900;letter-spacing:-.01em;color:var(--fg)}
.daily{flex:none;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:7px 14px 8px;font-size:15px;line-height:1.3;max-width:340px;box-shadow:0 6px 16px rgba(31,42,42,.08)}
.daily b{font-weight:900}
.stars{color:var(--accent);letter-spacing:.06em;white-space:nowrap}
.profile{flex:none;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:14px;font-weight:700;color:var(--fg-muted)}
.profile b{color:var(--fg)}
.coll{display:flex;gap:5px}
.cc{width:32px;text-align:center;font-size:9px;font-weight:800;color:var(--fg-muted);line-height:1.2}
.cc i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;margin:0 auto 1px;border-radius:50%;border:2px solid var(--soft-2);background:var(--card)}
.cc svg{width:16px;height:19px}
.cc .cup-body{fill:none;stroke:var(--soft-2);stroke-width:1.6}
.cc .cup-lid{fill:var(--soft-2)}
.cc.is-got i{background:var(--brand);border-color:var(--brand)}
.cc.is-got .cup-body{fill:#fff;stroke:#fff}
.cc.is-got .cup-lid{fill:var(--sun)}
.cc.is-today{color:var(--accent)}
#app[data-season="winter"] .cc.is-today{color:var(--warm)}
.cc.is-today i{box-shadow:0 0 0 2px var(--accent)}
.rule{flex:none;font-size:15px;line-height:1.3;color:var(--fg-muted);max-width:330px}
.meta{flex:none;font-size:13px;line-height:1.4;color:var(--fg-muted)}
.meta b{color:var(--fg)}
@media (max-height:600px){
  #s-start{padding-top:10px;gap:4px}
  .brand-word{font-size:34px}.title{font-size:26px}.btn{padding:14px 26px}
  .daily{font-size:14px;padding:5px 12px 6px}.rule{font-size:14px}.tagline{font-size:12px}
}

/* игра */
#s-game{padding:8px 10px 10px;gap:6px}
.topbar{flex:none;display:flex;align-items:center;gap:6px}
.topbar .brand{margin-right:auto}
.chip{background:var(--card);border:2px solid var(--line);border-radius:12px;padding:3px 10px 4px;text-align:center;min-width:62px}
.chip i{display:block;font-style:normal;font-size:10px;font-weight:700;color:var(--muted)}
.chip b{display:block;font-size:18px;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.chip.total{background:linear-gradient(180deg,var(--brand),var(--brand-dark));border-color:var(--brand-dark);min-width:70px}
.chip.total i{color:rgba(255,255,255,.82)}
.chip.total b{color:#fff;font-size:22px}
.chip.total.bump b{animation:bump .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.tbar{flex:none;position:relative;height:10px;border-radius:999px;background:rgba(27,143,142,.18);overflow:hidden}
#app[data-season="winter"] .tbar{background:rgba(255,255,255,.22)}
.tbar-fill{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,var(--brand),#35B7B4);transform-origin:0 50%}
.tbar.is-slow .tbar-fill{background:var(--sun)}
.tbar-mark{position:absolute;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--ink);opacity:.45;border-radius:2px}
.stage{
  position:relative;flex:1;min-height:110px;border-radius:22px;overflow:hidden;
  background:linear-gradient(180deg,var(--soft),var(--soft-2));touch-action:none;
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.5),0 8px 20px rgba(21,111,110,.12);
}
#cv{position:absolute;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
.pill{
  position:absolute;left:50%;top:9px;z-index:2;transform:translateX(-50%);pointer-events:none;
  max-width:94%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  background:var(--card);border-radius:999px;padding:6px 14px 7px;font-size:13px;font-weight:800;
  box-shadow:0 4px 12px rgba(31,42,42,.16);opacity:0;transition:opacity .2s;
}
.pill.on{opacity:1}
.pop{
  position:absolute;left:50%;top:5px;z-index:3;pointer-events:none;text-align:center;white-space:nowrap;
  background:var(--card);border-radius:16px;padding:6px 16px 7px;box-shadow:0 8px 20px rgba(31,42,42,.24);
  opacity:0;transform:translate(-50%,-8px) scale(.92);
}
.pop b{display:block;font-size:22px;font-weight:900;line-height:1.05;font-variant-numeric:tabular-nums;color:var(--brand-dark)}
.pop span{display:block;font-size:12px;font-weight:800;margin-top:1px}
.pop.on{opacity:1;animation:pop .34s cubic-bezier(.2,1.6,.4,1) both}
.pop.perfect{background:linear-gradient(180deg,#FFE58F,var(--sun))}
.pop.perfect b{color:var(--ink)}
.pop.bad b{color:var(--accent)}
@keyframes pop{from{transform:translate(-50%,-8px) scale(.5)}to{transform:translate(-50%,0) scale(1)}}

/* чек: выезжает из-под верхнего края сцены, сворачивается в рулон */
.rc-clip{position:absolute;z-index:5;left:0;right:0;bottom:0;overflow:hidden;pointer-events:none}
.rc-slot{position:absolute;z-index:6;left:50%;height:8px;width:min(88%,316px);transform:translate(-50%,-3px);border-radius:0 0 8px 8px;
  background:linear-gradient(180deg,#0B3F3E,var(--brand-dark));box-shadow:0 2px 5px rgba(0,0,0,.25);pointer-events:none}
.receipt{
  position:absolute;left:50%;top:0;width:min(82%,296px);margin-left:calc(min(82%,296px) / -2);
  transform-origin:50% 0;cursor:pointer;pointer-events:auto;will-change:transform;
  filter:drop-shadow(0 10px 14px rgba(31,42,42,.26));
}
.receipt.off{pointer-events:none;visibility:hidden}
.rc-win{overflow:hidden}
.rc-paper{position:relative;background:#fff;padding:9px 14px 12px;text-align:left;
  background-image:linear-gradient(180deg,rgba(31,42,42,.07),rgba(31,42,42,0) 14px)}
.rc-edge{height:8px;margin-top:-1px;
  background:
    linear-gradient(135deg,#fff 25%,transparent 25%) 0 0/12px 16px repeat-x,
    linear-gradient(225deg,#fff 25%,transparent 25%) 0 0/12px 16px repeat-x}
.rc-roll{display:none;height:15px;margin:0 -3px;border-radius:8px;
  background:linear-gradient(180deg,#fff 0%,#F2F2EC 35%,#C9CEC9 80%,#AEB6B2 100%);box-shadow:0 3px 6px rgba(31,42,42,.25)}
.receipt.rolling .rc-roll{display:block}
.receipt.rolling .rc-edge{display:none}
.rc-brand{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.rc-brand b{font-size:19px;font-weight:900;letter-spacing:-.03em;color:var(--brand);line-height:1}
.rc-brand span{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.rc-name{font-size:17px;font-weight:900;line-height:1.15;margin:5px 0 4px;padding:5px 0 6px;border-top:2px dashed var(--line);border-bottom:2px dashed var(--line)}
.rc-name em{display:inline-block;vertical-align:middle;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--accent);border-radius:999px;padding:2px 7px 3px;margin-left:4px}
.rc-name em.cold{background:var(--brand)}
.rc-list{list-style:none}
.rc-list li{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;line-height:1;padding:2px 0}
.rc-list .num{flex:none;width:21px;text-align:center;font-size:23px;font-weight:900;line-height:1;color:var(--brand-dark);font-variant-numeric:tabular-nums}
.rc-list canvas{flex:none;width:26px;height:26px;display:block}
.rc-list em{margin-left:auto;font-style:normal;font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.rc-bar{height:5px;border-radius:99px;background:var(--soft);margin-top:7px;overflow:hidden}
.rc-bar i{display:block;width:100%;height:100%;background:var(--accent);transform-origin:0 50%}
.rc-foot{display:flex;align-items:center;gap:8px;margin-top:6px}
.rc-tip{flex:1;font-size:11px;font-weight:700;color:var(--muted)}
.rc-code{flex:none;width:66px;height:16px;opacity:.8;
  background:repeating-linear-gradient(90deg,var(--ink) 0 2px,transparent 2px 3px,var(--ink) 3px 4px,transparent 4px 7px,var(--ink) 7px 10px,transparent 10px 12px)}
@media (max-height:640px){
  .rc-list li{font-size:14px;padding:0}
  .rc-list .num{font-size:21px}
  .rc-list canvas{width:23px;height:23px}
  .rc-paper{padding:7px 13px 9px}
  .rc-brand b{font-size:17px}
  .rc-name{font-size:15px;margin:4px 0 3px;padding:3px 0 4px}
  .rc-bar{margin-top:5px}
  .rc-foot{margin-top:4px}
  .rc-code{display:none}
}

/* слоты порядка */
.slots{flex:none;display:flex;justify-content:center;gap:6px;height:26px}
.slot{
  width:26px;height:26px;border-radius:50%;border:2px dashed var(--fg-brand);color:var(--fg-brand);
  font-style:normal;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center;
}
.slot svg{width:14px;height:14px}
.slot.now{border-style:solid;box-shadow:0 0 0 3px var(--sun)}
.slot.ok{border-style:solid;border-color:var(--brand);background:var(--brand);color:#fff;animation:slot-in .3s cubic-bezier(.3,1.8,.5,1)}
.slot.bad{border-style:solid;border-color:var(--accent);background:var(--accent);color:#fff;animation:slot-in .3s cubic-bezier(.3,1.8,.5,1)}
@keyframes slot-in{from{transform:scale(.4)}to{transform:scale(1)}}

/* полка с плитками */
.shelf{
  flex:none;display:flex;flex-wrap:wrap;justify-content:center;gap:7px 6px;padding:8px 6px 11px;
  background:linear-gradient(180deg,var(--brand-dark),var(--brand-deep));border-radius:18px;touch-action:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -3px 8px rgba(0,0,0,.25);
  --cols:4;--tile-h:clamp(54px,11.4vh,86px);
}
.shelf.n9,.shelf.n10{--tile-h:clamp(50px,10vh,74px)}
@media (min-width:380px){.shelf.n9,.shelf.n10{--cols:5;--tile-h:clamp(56px,12vh,86px)}}
.tile{
  -webkit-appearance:none;appearance:none;position:relative;border:0;cursor:pointer;
  flex:0 0 calc((100% - (var(--cols) - 1)*6px)/var(--cols) - .5px);height:var(--tile-h);
  border-radius:14px;background:linear-gradient(180deg,#FFFFFF 0%,var(--card) 50%,#F1E6CB 100%);
  box-shadow:0 4px 0 #D9C9A0,0 6px 9px rgba(0,0,0,.3),inset 0 1px 0 #fff,inset 0 -8px 10px rgba(27,143,142,.07);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;padding:3px 1px 3px;
  font:800 10.5px/1.08 var(--font);color:var(--ink);touch-action:none;min-width:0;
  transition:opacity .15s;
}
@media (max-width:379px){.tile{font-size:9.5px;letter-spacing:-.02em}}
.tile canvas{flex:1 1 auto;min-height:0;width:100%;display:block;pointer-events:none}
.tile span{flex:none;height:2.2em;display:flex;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.tile kbd{display:none;position:absolute;top:3px;left:5px;font:700 9px/1 var(--font);color:var(--muted);opacity:.7;pointer-events:none}
@media (hover:hover) and (pointer:fine){.tile kbd{display:block}}
.tile.tap{animation:tile-pop .36s cubic-bezier(.3,1.6,.5,1)}
.tile.hit{background:linear-gradient(180deg,#FFFFFF,var(--soft-2))}
.tile.miss{background:linear-gradient(180deg,#fff,var(--miss));animation:shake .3s}
.tile.kb{outline:3px solid var(--sun);outline-offset:-3px}
.tile:focus{outline:none}
.shelf.is-wait .tile{opacity:.62;cursor:default}
@keyframes tile-pop{0%{transform:translateY(4px) scale(.9,.84)}45%{transform:translateY(-5px) scale(1.06,1.1)}72%{transform:translateY(1px) scale(.99,.97)}100%{transform:none}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-5px) rotate(-2deg)}50%{transform:translateX(5px) rotate(2deg)}80%{transform:translateX(-3px)}}

/* результат и лимит */
#s-result,#s-limit{align-items:center;text-align:center;padding:14px 20px 14px;gap:9px;overflow-y:auto;touch-action:pan-y}
#s-result .brand,#s-limit .brand{margin-bottom:auto}
#s-result .proto,#s-limit .proto{margin-top:auto}
.res-title{font-size:26px;line-height:1.15;font-weight:900;max-width:330px;color:var(--fg)}
.win .res-title{color:var(--fg-brand);font-size:31px;letter-spacing:-.01em}
#app[data-season="default"] .win .res-title{color:var(--brand-dark)}
.score{display:flex;align-items:baseline;justify-content:center;gap:8px;color:var(--fg)}
.score b{font-size:64px;line-height:1;font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.score span{font-size:18px;font-weight:700;color:var(--fg-muted)}
.rows{display:flex;gap:5px;width:100%;max-width:340px}
.rows div{flex:1;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:4px 2px 5px}
.rows span{display:block;font-size:10px;font-weight:700;color:var(--muted)}
.rows b{display:block;font-size:18px;font-weight:900;font-variant-numeric:tabular-nums}
.rows div.full{background:var(--soft);border-color:var(--brand)}
.ticket{
  position:relative;width:100%;max-width:340px;background:var(--card);margin-top:8px;
  border:3px dashed var(--brand);border-radius:22px;padding:18px 14px 12px;box-shadow:0 10px 24px rgba(31,42,42,.14);
  animation:ticket-in .5s cubic-bezier(.2,1.4,.4,1) both;
}
@keyframes ticket-in{from{opacity:0;transform:translateY(18px) scale(.9) rotate(-2deg)}to{opacity:1;transform:none}}
.ticket-tag{
  position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:var(--brand-dark);color:#fff;
  font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;
}
.ticket-main{font-size:22px;line-height:1.15;font-weight:900;color:var(--brand-dark)}
.ticket-sub{font-size:17px;line-height:1.2;font-weight:900}
.ticket-how{font-size:13px;line-height:1.3;color:var(--muted);margin-top:7px}
.ticket-word{
  display:inline-block;margin-top:5px;padding:5px 16px 6px;border-radius:12px;background:var(--brand-dark);color:#fff;
  font-size:27px;line-height:1.1;font-weight:900;letter-spacing:.04em;
}
.ticket-one{font-size:12px;font-weight:700;color:var(--muted);margin-top:7px}
.ticket-stamp{
  margin-top:7px;padding-top:7px;border-top:2px dashed var(--line);
  font-size:19px;font-weight:900;font-variant-numeric:tabular-nums;color:var(--brand-dark);
}
/* зимой билет — новогодняя открытка: тёплый свет и ленточка */
#app[data-season="winter"] .ticket{
  border:0;overflow:hidden;padding-top:22px;
  background:radial-gradient(120% 90% at 50% 0%,#FFF7DF 0%,#FFE9B8 55%,#F9D48E 100%);
  box-shadow:0 0 0 3px rgba(255,255,255,.55),0 14px 34px rgba(0,0,0,.4),0 0 44px rgba(255,217,138,.35);
}
#app[data-season="winter"] .ticket::before{
  content:"";position:absolute;top:0;bottom:0;left:22px;width:13px;
  background:linear-gradient(90deg,#B3162C,var(--accent) 40%,#F0566B 60%,var(--accent));box-shadow:0 0 6px rgba(0,0,0,.18);
}
#app[data-season="winter"] .ticket::after{
  content:"";position:absolute;top:12px;left:9px;width:39px;height:22px;
  background:
    radial-gradient(circle at 50% 50%,#9E1428 0 5px,transparent 5.5px),
    radial-gradient(ellipse 12px 9px at 22% 50%,var(--accent) 0 98%,transparent 100%),
    radial-gradient(ellipse 12px 9px at 78% 50%,var(--accent) 0 98%,transparent 100%);
}
#app[data-season="winter"] .ticket > *{position:relative}
#app[data-season="winter"] .ticket-tag{top:4px;left:auto;right:10px;transform:none;position:absolute;font-size:9px;padding:3px 9px}
#app[data-season="winter"] .ticket-main,#app[data-season="winter"] .ticket-sub,
#app[data-season="winter"] .ticket-how,#app[data-season="winter"] .ticket-one{padding-left:26px}
#app[data-season="winter"] .ticket-stamp{border-top-color:rgba(158,20,40,.3)}
#app[data-season="winter"] #s-start{padding-bottom:26px}
#app[data-season="winter"] #s-result,#app[data-season="winter"] #s-limit{padding-bottom:42px}
.note{font-size:14px;line-height:1.35;color:var(--fg-muted);max-width:330px}
.note:empty{display:none}
.note b{color:var(--fg)}
.limit-title{font-size:28px;line-height:1.15;font-weight:900;max-width:320px;color:var(--fg)}
.limit-record{font-size:18px;font-weight:800;color:var(--fg-brand)}
#app[data-season="default"] .limit-record{color:var(--brand-dark)}
@media (max-height:640px){
  #s-result,#s-limit{gap:6px;padding-top:10px;padding-bottom:10px}
  .win .res-title{font-size:25px}
  .score b{font-size:46px}
  .win .rows{display:none}
  .ticket{padding:15px 12px 9px;margin-top:6px}
  .ticket-main{font-size:20px}
  .ticket-word{font-size:24px}
  .ticket-stamp{margin-top:6px;padding-top:5px;font-size:17px}
  .limit-title{font-size:25px}
}

.toast{
  position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:9;pointer-events:none;
  background:var(--ink);color:#fff;font-size:13px;font-weight:700;padding:8px 14px;border-radius:999px;
  opacity:0;transition:opacity .25s;white-space:nowrap;
}
.toast.on{opacity:.92}
@media (prefers-reduced-motion:reduce){
  .screen.is-on,.screen.is-off,.ticket,.tile.tap,.tile.miss,.pop.on,.slot.ok,.slot.bad,.chip.total.bump b{animation-duration:.01s}
  #app[data-season="winter"] .flake{animation:none}
}

.wd-mascot{display:block;flex:none;width:clamp(72px,18vh,136px);height:clamp(72px,18vh,136px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;
  animation:wd-sway 3.6s ease-in-out infinite;filter:drop-shadow(0 6px 8px rgba(31,42,42,.18));
  pointer-events:none;-webkit-user-select:none;user-select:none}
/* у билета маскот выглядывает над его правым верхним краем и не занимает места в потоке (кнопки не уезжают) */
.wd-prize-m{display:none;position:relative;height:0;width:100%;flex:none;pointer-events:none;z-index:2}
.wd-prize-m::before{content:"";position:absolute;right:0;bottom:-12px;width:clamp(68px,10vh,88px);height:clamp(68px,10vh,88px);
  background:var(--wd-img) center/contain no-repeat;transform-origin:50% 92%;animation:wd-sway 3.6s ease-in-out infinite;
  filter:drop-shadow(0 4px 6px rgba(31,42,42,.22))}
.screen:has(.ticket:not([hidden])) .wd-prize-m{display:block}
@keyframes wd-sway{0%,100%{transform:rotate(-2.5deg) translateY(0)}50%{transform:rotate(2.5deg) translateY(-3px)}}
#app.winter .wd-mascot,#app[data-season="winter"] .wd-mascot{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
#app.winter .wd-prize-m::before,#app[data-season="winter"] .wd-prize-m::before{
  background:var(--wd-img) center/contain no-repeat,radial-gradient(closest-side,rgba(255,244,214,.62),rgba(255,244,214,.22) 62%,rgba(255,244,214,0) 100%);
  filter:drop-shadow(0 0 5px rgba(255,255,255,.55)) drop-shadow(0 4px 8px rgba(0,0,0,.3))}
@media (max-height:640px){.wd-mascot{width:72px;height:72px}}
@media (prefers-reduced-motion:reduce){.wd-mascot,.wd-prize-m::before{animation:none}}
.hero-wrap .wd-mascot{position:absolute;left:2px;bottom:0;z-index:1}
/* ===== v6: общий слой — кнопка «Все игры», настройки, быстрая кнопка звука, касания, безопасные зоны ===== */
html,body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
@supports (height:100dvh){html,body{height:100dvh}}
a,button{-webkit-touch-callout:none}
.wdx-ibtn{
  position:absolute;z-index:40;top:calc(env(safe-area-inset-top,0px) + 6px);right:calc(env(safe-area-inset-right,0px) + 8px);
  display:none;align-items:center;justify-content:center;width:48px;height:48px;padding:0;border:0;border-radius:50%;
  background:rgba(255,255,255,.94);color:#156F6E;box-shadow:0 2px 10px rgba(0,0,0,.22),inset 0 0 0 1.5px rgba(27,143,142,.35);
  font:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .1s;
}
.wdx-ibtn svg{width:26px;height:26px;display:block;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.wdx-ibtn:active{transform:scale(.92)}
.wdx-ibtn:focus-visible,.wdx-row:focus-visible,.wdx-done:focus-visible,.wdx-next:focus-visible,.wdx-back:focus-visible{outline:3px solid #DC223C;outline-offset:2px}
.wdx-gear{display:flex}
.wdx-snd{top:calc(env(safe-area-inset-top,0px) + 4px);width:42px;height:42px}
.wdx-snd svg{width:22px;height:22px}
#app .wdx-gear{display:none}
#app:has(#s-start.is-on) .wdx-gear,#app:has(#s-result.is-on) .wdx-gear,#app:has(#s-limit.is-on) .wdx-gear{display:flex}
#app:has(#s-game.is-on) .wdx-snd{display:flex}
@supports not selector(:has(*)){#app .wdx-gear{display:flex}}
body > .wdx-ibtn{position:absolute}

.wdx-back{
  flex:none;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;max-width:340px;min-height:50px;margin:4px auto 0;padding:12px 18px;
  border-radius:16px;background:#fff;color:#156F6E;box-shadow:inset 0 0 0 2.5px #1B8F8E,0 3px 0 rgba(21,111,110,.35);
  font:800 17px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-decoration:none;text-align:center;
  touch-action:manipulation;-webkit-user-select:none;user-select:none;transition:transform .08s,box-shadow .08s;
}
.wdx-back:active{transform:translateY(2px);box-shadow:inset 0 0 0 2.5px #1B8F8E,0 1px 0 rgba(21,111,110,.35)}
.wdx-back::before{content:"";width:9px;height:9px;border-left:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg);margin-right:2px;flex:none}

.wdx-set{position:absolute;top:0;right:0;bottom:0;left:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(8,32,36,.62);animation:wdx-in .18s ease both}
.wdx-set.wdx-fixed{position:fixed}
.wdx-set[hidden]{display:none !important}
.wdx-card{width:100%;max-width:340px;max-height:100%;overflow:auto;padding:20px 18px 18px;border-radius:24px;background:#FFFDF6;color:#1F2A2A;box-shadow:0 18px 50px rgba(0,0,0,.4);animation:wdx-pop .22s cubic-bezier(.2,.9,.3,1.2) both}
.wdx-card h2{margin:0 0 6px;font:900 24px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;letter-spacing:-.02em;color:#156F6E}
.wdx-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:56px;margin:0;padding:8px 2px;border:0;border-bottom:1px solid #E8DFC4;border-radius:0;background:none;
  color:#1F2A2A;font:800 18px/1.2 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;text-align:left;cursor:pointer;touch-action:manipulation;
}
.wdx-sw{position:relative;flex:none;width:54px;height:32px;border-radius:16px;background:#B9C6C5;transition:background .15s}
.wdx-sw::after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.35);transition:transform .15s}
.wdx-row[aria-checked="true"] .wdx-sw{background:#1B8F8E}
.wdx-row[aria-checked="true"] .wdx-sw::after{transform:translateX(22px)}
.wdx-done{display:block;width:100%;min-height:52px;margin:16px 0 0;padding:12px;border:0;border-radius:16px;background:#DC223C;color:#fff;box-shadow:0 4px 0 #A5192C;
  font:900 18px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-done:active{transform:translateY(2px);box-shadow:0 2px 0 #A5192C}
.wdx-now{margin:12px 2px 0;font:700 15px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:#4E5F5E;overflow-wrap:anywhere}
.wdx-next{display:block;width:100%;min-height:48px;margin:10px 0 0;padding:10px;border:2px solid #1B8F8E;border-radius:14px;background:none;color:#156F6E;font:800 16px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;cursor:pointer;touch-action:manipulation}
.wdx-next:active{transform:translateY(1px)}
.wdx-next:disabled{opacity:.4;cursor:default}
.wdx-now[hidden],.wdx-next[hidden]{display:none}
@keyframes wdx-in{from{opacity:0}to{opacity:1}}
@keyframes wdx-pop{from{opacity:0;transform:translateY(12px) scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.wdx-set,.wdx-card{animation:none}.wdx-ibtn,.wdx-back,.wdx-sw,.wdx-sw::after{transition:none}}
/* v6: стартовый экран помещается в 320×568 вместе с кнопкой «Все игры» */
@media (max-height:620px){
  #s-start>*{flex-shrink:0}
  #s-start>.hero-wrap{flex-shrink:1}
  .btn{padding:15px 26px}
  .wdx-back{min-height:48px;padding:8px 18px;margin-top:0}
}
/* v6: быстрая кнопка звука в игре — в просвете между словесным знаком и плашками заказа */
.wdx-snd{left:139px;right:auto;top:36px;width:32px;height:32px}
.wdx-snd svg{width:18px;height:18px}

/* v7: строки приза на билете, одинаковые во всех играх */
.ticket{flex:none}
.ticket-prize{font-size:21px;line-height:1.12;font-weight:900;color:var(--brand-dark);margin:0 0 7px}
.ticket-lab{font-size:12px;line-height:1.2;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ticket-valid{margin-top:8px;font-size:12.5px;line-height:1.28;font-weight:800;color:var(--ink)}
.ticket-cond{margin-top:6px;font-size:11.5px;line-height:1.3;font-weight:600;color:var(--muted)}
@media (max-height:640px){.ticket-prize{font-size:19px;margin-bottom:3px}.ticket-valid{margin-top:5px;font-size:12px}.ticket-cond{margin-top:4px;font-size:11px;line-height:1.25}}
#app[data-season="winter"] .ticket-prize,#app[data-season="winter"] .ticket-lab,#app[data-season="winter"] .ticket-valid,#app[data-season="winter"] .ticket-cond{padding-left:26px}
</style>

<script>
/* ============================================================================
   WDX (v8) — общий слой всех игр и зала WeDrink: настройки, музыка, Telegram Mini App, MAX, VK Mini Apps, слова дня.
   Один и тот же код лежит в зале и в каждой игре (файлы самодостаточны).
   Профиль wedrink.profile.v1: пишем только поля music и sfx (по умолчанию включено), остальное не трогаем.
   Музыка: плейлист assets/music/playlist.json, треки идут по кругу; текущий тянется лениво, только после первого касания. Внешних запросов нет,
   кроме скриптов клиентов (Telegram, MAX, VK Bridge) и только внутри своего клиента.
   ============================================================================ */
(function () {
  'use strict';
  var PROFILE_KEY = 'wedrink.profile.v1';
  var MUSIC_DIR = 'assets/music/';           // playlist.json и треки
  var MUSIC_GAP = 400;                       // пауза, если перехода нет, мс
  var MUSIC_XF = 1.5;                        // плавный переход между треками, с
  var MUSIC_XF_SKIP = 0.6;                   // то же по кнопке «Следующий трек»
  var MUSIC_VOL = 0.35;                      // громкость фоновой музыки
  var TG_SRC = 'https://telegram.org/js/telegram-web-app.js';
  var TG_FLAG = 'wedrink.tg';
  var MAX_SRC = 'https://st.max.ru/js/max-web-app.js';                  // dev.max.ru/docs/webapps/bridge, «Подключение библиотеки»
  var MAX_FLAG = 'wedrink.max';
  var VK_SRC = 'https://unpkg.com/@vkontakte/vk-bridge@2.15.12/dist/browser.min.js';   // адрес из dev.vk.ru/en/bridge/getting-started, версия закреплена
  var VK_SRI = 'sha384-zMslrVQ3fVDIQqW7ztZS5ewZJsN29NP1vJFbKATVzqIeeinYRVG8gCR2p7X/SuwC';
  var LP_KEY = 'wedrink.lp';                  // параметры запуска (VK / MAX / Telegram), чтобы не терять при переходах зал <-> игра
  /* Строки условий приза: одна и та же на экране приза во всех играх */
  var COND = '290 очков — −40 ₽ на напиток, все 300 — напиток до 250 ₽ за наш счёт. Назови на кассе слово дня и номер телефона: каждый приз — раз в день, в одном заказе — один приз, кофе не участвует.';
  var VALID = 'Слово действует сегодня до закрытия точки (22:00 по Новосибирску).';
  var HEAD = { topping: '−40\u00a0₽ на\u00a0напиток', drink: 'Напиток до\u00a0250\u00a0₽ за\u00a0наш\u00a0счёт' };
  var HALL_COLOR = { light: '#FBF7EC', winter: '#0F5059' };
  var GAME_COLOR = { light: '#FBF7EC', winter: '#0F5059' };

  var cfg = { base: '', hall: false, sfx: false, shell: false };
  var cache = {}, ui = {}, audio = null, ctx = null, gain = null;
  var list = null, idx = 0, loaded = -1, seekTo = 0, wantPlay = false, listLoading = false, listTries = 0, gapT = 0, errs = 0, slots = [], cur = null, primed = false;
  var started = false, suspended = false, lastFocus = null, touched = false;
  var theme = { winter: false }, tgW = null, tgPending = false, tgLoading = false;
  var mxW = null, mxLoading = false, vkB = null, vkLoading = false, coded = null;
  var holdMode = false, backCb = null, shellWin = null, shellClose = null, shellSt = { has: false, now: '' };

  /* ---------- профиль: читаем целиком, меняем одно поле ---------- */
  function isObj(o) { return !!o && typeof o === 'object' && !Array.isArray(o); }
  function readProfile() {
    try { var o = JSON.parse(window.localStorage.getItem(PROFILE_KEY)); return isObj(o) ? o : {}; } catch (e) { return {}; }
  }
  function pref(name) {
    if (Object.prototype.hasOwnProperty.call(cache, name)) return cache[name];
    return readProfile()[name] !== false;     // по умолчанию включено
  }
  function setPref(name, on) {
    var p;
    cache[name] = !!on;
    try { p = readProfile(); p[name] = !!on; window.localStorage.setItem(PROFILE_KEY, JSON.stringify(p)); } catch (e) { /* без хранилища — до конца сессии */ }
  }

  /* ---------- параметры запуска клиентов: VK (vk_*, sign), Telegram (tgWebApp*), MAX (WebApp*) ---------- */
  var LP_NAME = /^(vk_[a-z_]+|sign|tgWebApp[A-Za-z]*|WebApp[A-Za-z]*)$/;
  function launchQuery() {                    // только служебные параметры клиентов, без ?preview= и ?season=
    var q = '', parts, i, out = [], k, saved = '';
    try { q = String(window.location.search || '').replace(/^\?/, ''); } catch (e) { q = ''; }
    parts = q ? q.split('&') : [];
    for (i = 0; i < parts.length; i++) { k = parts[i].split('=')[0]; if (LP_NAME.test(k)) out.push(parts[i]); }
    if (out.length) {
      q = out.join('&');
      try { window.sessionStorage.setItem(LP_KEY, q); } catch (e) { /* нет sessionStorage */ }
      return q;
    }
    try { saved = window.sessionStorage.getItem(LP_KEY) || ''; } catch (e) { saved = ''; }
    return /^[A-Za-z0-9_=&%.~+\-]*$/.test(saved) ? saved : '';
  }
  function maxHash() {                        // MAX кладёт WebAppData, WebAppPlatform, WebAppVersion в часть после # (dev.max.ru/docs/webapps/validation)
    var h = '';
    try { h = String(window.location.hash || ''); } catch (e) { h = ''; }
    return /[#&](WebAppData|WebAppPlatform|WebAppVersion)=/.test(h) ? h : '';
  }
  function withParams(url) {                  // дописать к ссылке параметры запуска, если они есть
    var h = '', i = url.indexOf('#'), lp = launchQuery();
    if (i >= 0) { h = url.slice(i); url = url.slice(0, i); }
    if (lp) url += (url.indexOf('?') < 0 ? '?' : '&') + lp;
    if (!h) h = maxHash();
    return url + h;
  }
  function hallUrl() {
    var m = null, q = '';
    try { m = /[?&]season=(winter|default)(?:&|$)/.exec(String(window.location.search || '')); } catch (e) { m = null; }
    if (m && !cfg.hall) q = '?season=' + m[1];
    return withParams(cfg.base + 'index.html' + q);
  }
  function goHall() {
    if (cfg.shell) { shellPost('close'); return; }       // в оболочке «в зал» — закрыть iframe
    try { window.location.href = hallUrl(); } catch (e) { /* адрес недоступен */ }
  }
  function backFn() { if (cfg.hall) { if (backCb) backCb(); } else goHall(); }    // «назад» Telegram / MAX: в зале — закрыть игру, в игре — в зал
  function setBack(cb) { backCb = typeof cb === 'function' ? cb : null; if (tgW) tgApply(); if (mxW) maxApply(); }

  /* ---------- оболочка (Р-1176): зал держит плеер, игра внутри iframe шлёт ему сообщения; музыка не прерывается при переходах ---------- */
  function shellFlag() {                      // игра открыта внутри iframe зала: в адресе shell=1 и есть родитель
    var q = '';
    try { q = String(window.location.search || ''); } catch (e) { q = ''; }
    try { return /[?&]shell=1(?:&|$)/.test(q) && !!window.parent && window.parent !== window; } catch (e) { return false; }
  }
  function shellPost(t, d) {                  // игра -> зал
    var m = { wdx: 1, t: t }, k;
    if (d) for (k in d) if (Object.prototype.hasOwnProperty.call(d, k)) m[k] = d[k];
    try { window.parent.postMessage(m, window.location.origin); } catch (e) { /* зала нет */ }
  }
  function shellState() {                     // зал -> игра: что показать в настройках
    var m = { wdx: 1, t: 'state', has: !!(list && list.length), now: curTitle() };
    try { if (shellWin && shellWin.postMessage) shellWin.postMessage(m, window.location.origin); } catch (e) { /* игра закрыта */ }
  }
  function onShellMsg(e) {
    var m = e && e.data;
    try { if (!e || e.origin !== window.location.origin || !isObj(m) || m.wdx !== 1) return; } catch (x) { return; }
    if (cfg.shell) {                          // зал -> игре
      if (m.t === 'state') { shellSt.has = !!m.has; shellSt.now = String(m.now || '').slice(0, 80); syncUi(); }
      return;
    }
    if (!cfg.hall || !shellWin || e.source !== shellWin) return;      // игре -> залу: только от нашего iframe
    if (m.t === 'ready') shellState();
    else if (m.t === 'pref') { cache = {}; if (m.k === 'music') { if (pref('music')) play(); else stop(); } syncUi(); }
    else if (m.t === 'next') { skip(); syncUi(); }
    else if (m.t === 'hold') { holdMode = true; stop(); }
    else if (m.t === 'release') { holdMode = false; if (pref('music')) play(); }
    else if (m.t === 'close') { if (shellClose) shellClose(); }
  }


  /* ---------- музыка: плейлист assets/music/playlist.json, плавные переходы между треками ---------- */
  var SILENT = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQAAAAA=';   // для «разблокировки» запасных плееров первым касанием
  function trackUrl(i) { return cfg.base + MUSIC_DIR + list[i].file; }
  function nextIdx(i) { return (i + 1) % list.length; }
  function curTitle() { return (list && list[idx]) ? list[idx].title : ''; }
  function savePos() {                        // файл и позиция текущего трека — для перехода зал <-> игра
    var t = 0;
    if (!list || !list[idx]) return;
    if (loaded === idx && audio && audio.currentTime > 0) t = audio.currentTime;
    try { window.sessionStorage.setItem('wedrink.mt', JSON.stringify({ f: list[idx].file, t: t, ts: Date.now() })); } catch (e) { /* нет sessionStorage */ }
  }
  function restoreIdx() {                     // первый запуск — случайный трек, дальше по порядку
    var s = null, i, k = -1;
    try { s = JSON.parse(window.sessionStorage.getItem('wedrink.mt')); } catch (e) { s = null; }
    if (s && typeof s.f === 'string') for (i = 0; i < list.length; i++) if (list[i].file === s.f) k = i;
    if (k < 0) { idx = Math.floor(Math.random() * list.length); return; }
    if (isFinite(s.t) && Date.now() - s.ts < 20000) { idx = k; seekTo = s.t > 0 ? s.t : 0; }   // продолжаем с того же места
    else idx = nextIdx(k);
  }
  function loadList() {
    var done;
    if (cfg.shell || list || listLoading || listTries >= 2) return;
    listLoading = true; listTries++;
    done = function (arr) {
      var out = [], i, o;
      listLoading = false;
      if (!Array.isArray(arr)) return;

    if (!g) return;
    px = g.cx + c.off; py = g.by - (CUP_H + 0.02) * g.S;
    spawnParts(px - g.S * 0.4, py, 5, ['#FFFFFF', COL.sun], 150, WINTER ? 'spark' : 'star');
    spawnParts(px + g.S * 0.4, py, 5, ['#FFFFFF', '#46C6C3'], 150, WINTER ? 'spark' : 'star');
    if (WINTER) spawnParts(px, py, 6, ['#FFFFFF'], 60, 'dust');
  }

  function finishAttempt() {
    var total = clamp(run.total, 0, MAX_SCORE), g = loadGame();
    if (g.day === run.day) { g.best = Math.max(g.best, total); saveGame(g); }
    touchProfile(run.day, run.date, run.dow, total);
    cur = null; rc.mode = 'off'; elReceipt.classList.add('off');
    showResult(total);
  }

  function updateGame(real, dt) {
    if (!cur) return;
    var o = cur.o, f, c = cur.cup;
    if (popT > 0) { popT -= real; if (popT <= 0) hidePop(); }
    updateReceipt(dt);
    if (c.lidT > 0.2 && !c.popped) sealPop(c);
    if (cur.phase === 'show') {
      cur.phaseT += real;
      f = $('rc-fill');
      if (f) f.style.transform = 'scaleX(' + Math.max(0, 1 - cur.phaseT / o.showMs).toFixed(4) + ')';
      if (cur.phaseT >= o.showMs) collapse();
    } else if (cur.phase === 'play') {
      cur.t += real;                                         // время заказа — настоящее: свёрнутая вкладка его не останавливает
      if (cur.t >= o.limitMs) { cur.t = o.limitMs; finishOrder(true, ''); }
      paintTimer();
    } else if (cur.phase === 'done') {
      cur.phaseT += real;
      if (!cur.sealed && cur.phaseT >= 430 && fx.flights.length === 0) { cur.sealed = true; c.lidT = 0; }   // плёнка — когда всё долетело
      if (!cur.left && cur.phaseT >= cur.doneMs - 360) { cur.left = true; c.slide = 'out'; c.slideT = 0; }
      if (cur.phaseT >= cur.doneMs) {
        if (!cur.sealed) c.lidT = 0.21;
        if (run.idx + 1 < ORDERS) { stage.prev = c; if (!c.slide) { c.slide = 'out'; c.slideT = 0; } beginOrder(run.idx + 1); }
        else finishAttempt();
      }
    }
  }
  var frameOn = true;
  function frame(ts) {
    var real = lastTs ? Math.max(0, ts - lastTs) : 16, dt;
    if (document.hidden) { frameOn = false; return; }        // вкладка скрыта — цикл стоит; время заказа идёт по часам и после возврата
    lastTs = ts; frameNo++;
    dt = Math.min(real, 50) / 1000;                           // анимации — с ограниченной дельтой, таймеры игры — по настоящему времени
    T += dt;
    par.x += (par.tx - par.x) * Math.min(1, dt * 5); par.y += (par.ty - par.y) * Math.min(1, dt * 5);
    tickTweens(real);
    if (screenId === 's-game') { updateGame(Math.min(real, 60000), dt); if (cur) { drawStage(dt); drawTiles(false); } }
    else if (screenId === 's-start') drawHero(dt);
    drawBg(dt);
    drawFx(dt);
    window.requestAnimationFrame(frame);
  }

  /* ================= Ввод: pointer и клавиатура ================= */
  function tileFrom(e) { return (e.target && e.target.closest) ? e.target.closest('.tile') : null; }
  var DOWN = window.PointerEvent ? 'pointerdown' : 'touchstart';
  function onShelfDown(e) {
    var t = tileFrom(e);
    if (!t) return;
    e.preventDefault();
    tapTile(t);
  }
  elShelf.addEventListener(DOWN, onShelfDown, { passive: false });
  if (!window.PointerEvent) elShelf.addEventListener('mousedown', onShelfDown);
  function onReceiptDown(e) {
    if (e && e.preventDefault) e.preventDefault();
    if (cur && cur.phase === 'show' && cur.phaseT >= TAP_GUARD_MS) collapse();
  }
  elReceipt.addEventListener(DOWN, onReceiptDown, { passive: false });
  if (!window.PointerEvent) elReceipt.addEventListener('mousedown', onReceiptDown);
  function onMove(e) {                                        // параллакс фона от движения пальца или мыши
    var r = elApp.getBoundingClientRect(), p = e.touches ? e.touches[0] : e;
    if (!p || !r.width) return;
    par.tx = clamp((p.clientX - r.left) / r.width * 2 - 1, -1, 1); par.ty = clamp((p.clientY - r.top) / r.height * 2 - 1, -1, 1);
  }
  if (!RM) {
    elApp.addEventListener(window.PointerEvent ? 'pointermove' : 'touchmove', onMove, { passive: true });
    elApp.addEventListener(DOWN, onMove, { passive: true });
    window.addEventListener('deviceorientation', function (e) {   // наклон телефона (где доступен без запроса)
      if (e && typeof e.gamma === 'number' && typeof e.beta === 'number') { par.tx = clamp(e.gamma / 25, -1, 1); par.ty = clamp((e.beta - 45) / 30, -1, 1); }
    });
  }

  $('btn-play').addEventListener('click', play);
  function again() {
    if (nowMs() - resultAt < RESULT_GUARD_MS) return;
    var g = loadGame();
    fx.conf.length = 0;
    if (attemptsLeft(g) > 0) play(); else showLimit();
  }
  $('btn-again').addEventListener('click', again);

  function moveKb(dx, dy) {
    var ts = tiles(), n = ts.length, i;
    if (!n) return;
    var cols = parseInt(window.getComputedStyle(elShelf).getPropertyValue('--cols'), 10) || 4;
    if (kbIdx < 0) kbIdx = 0; else kbIdx = clamp(kbIdx + dx + dy * cols, 0, n - 1);
    for (i = 0; i < n; i++) ts[i].classList.toggle('kb', i === kbIdx);
  }
  document.addEventListener('keydown', function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    var k = e.key, go = (k === ' ' || k === 'Spacebar' || k === 'Enter');
    if (screenId === 's-game') {
      if (!cur) return;
      if (go) {
        e.preventDefault();
        if (e.repeat) return;
        if (cur.phase === 'show') { if (cur.phaseT >= TAP_GUARD_MS) collapse(); }
        else if (cur.phase === 'play' && kbIdx >= 0) tapTile(tiles()[kbIdx]);
      } else if (k.length === 1 && k >= '0' && k <= '9') {
        e.preventDefault();
        if (e.repeat) return;
        tapTile(tiles()[k === '0' ? 9 : parseInt(k, 10) - 1]);
      } else if (k === 'ArrowLeft') { e.preventDefault(); moveKb(-1, 0); }
      else if (k === 'ArrowRight') { e.preventDefault(); moveKb(1, 0); }
      else if (k === 'ArrowUp') { e.preventDefault(); moveKb(0, -1); }
      else if (k === 'ArrowDown') { e.preventDefault(); moveKb(0, 1); }
      return;
    }
    if (go) {
      e.preventDefault();
      if (e.repeat) return;
      if (screenId === 's-start') play();
      else if (screenId === 's-result') again();
    }
  });

  /* без масштабирования жестом, контекстного меню и двойного тапа в игровой зоне */
  elApp.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  elApp.addEventListener('dblclick', function (e) { e.preventDefault(); });
  document.addEventListener('gesturestart', function (e) { e.preventDefault(); });
  window.addEventListener('resize', function () { readDpr(); bg.dirty = true; if (screenId === 's-game' && cur) layoutReceipt(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { bg.dirty = true; if (!frameOn) { frameOn = true; window.requestAnimationFrame(frame); } } });

  /* ================= Запуск ================= */
  try { WDX.init({ base: '../' }); WDX.theme(WINTER); } catch (e) { /* общий слой не критичен */ }
  elApp.setAttribute('data-season', SEASON);
  elApp.classList.toggle('is-proto', IS_PROTOTYPE);
  readDpr();
  readColors();
  if (qparam('reset') === '1') {
    saveGame({ day: today().key, used: 0, best: 0 });
    toast('Попытки на сегодня сброшены');
  }
  var pvScore = null;
  try { pvScore = WDX.previewScore(); } catch (e) { pvScore = null; }
  if (pvScore !== null) {
    // Просмотр экрана результата: ничего не сохраняет, попытку не тратит, слово дня — «ПРИМЕР»
    PREVIEW = true;
    run = { day: '', date: new Date(), dow: new Date().getDay(), attempt: 0, orders: [], idx: 0, total: pvScore, scores: [] };
    (function () { var left = pvScore, k, v; for (k = 0; k < ORDERS; k++) { v = Math.min(60, left); run.scores.push(v); left -= v; } })();
    showResult(pvScore);
    toast('Просмотр экрана: ничего не сохраняется');
  } else if (attemptsLeft(loadGame()) <= 0) showLimit(); else showStart();
  window.requestAnimationFrame(frame);
})();
</script>
</body>
</html>
